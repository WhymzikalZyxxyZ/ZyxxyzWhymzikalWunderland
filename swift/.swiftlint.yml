line_length: 200

disabled_rules:
  - comma
  # Chess engines use universal piece-constant naming (P N B R Q K) and
  # PST_ prefixed tables — both well-established conventions that conflict
  # with SwiftLint's identifier_name defaults.
  - identifier_name
  # Move-generation functions are inherently complex (switch over 6 piece
  # types, each with multiple move patterns). Complexity is irreducible
  # without splitting into trivial forwarding stubs.
  - cyclomatic_complexity
  # pseudoMoves takes the full game state as scalar params to keep the
  # function pure (no mutation of a shared struct). 10 params is the
  # minimum needed to express the chess state snapshot.
  - function_parameter_count
  # Nested for-loops over 8x8 board coordinates cannot always use
  # where-clauses when the inner loop body has early returns or mutations.
  - for_where
  # Explicit `= nil` on optional properties is intentional documentation
  # of the "starts unset" invariant; silencing this keeps it readable.
  - implicit_optional_initialization
  # Compact else/catch placement inside dense one-liner game logic.
  - statement_position
  # Multi-line parameter lists in pseudoMoves follow the same indentation
  # as the surrounding code block, not column-aligned style.
  - vertical_parameter_alignment
