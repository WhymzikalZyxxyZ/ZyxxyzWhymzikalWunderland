<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solitaire — ZYXXYZ's Whymzykal Wunderland</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/script.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="/js/firebase-config.js"></script>
    <script src="/js/username-gen.js"></script>
    <script src="/js/card-engine.js"></script>
    <script src="/js/solitaire-engine.js"></script>
    <style>
        #sol-page { max-width:760px; margin:0 auto; padding:0 12px 80px; }
        .sol-panel { background:rgba(0,0,0,0.75); border:1px solid #2a2a2a;
            border-radius:12px; padding:16px; margin-bottom:14px; }
        .sol-title { font-family:'Courier New',monospace; font-size:11px; letter-spacing:3px;
            text-transform:uppercase; color:#f4a261;
            border-bottom:1px solid #2a2a2a; padding-bottom:8px; margin:0 0 14px; }
        /* Cards */
        .card { display:inline-flex; flex-direction:column; justify-content:space-between;
            width:48px; height:70px; background:#f8f8f0; border:1.5px solid #bbb;
            border-radius:6px; padding:3px 4px; font-family:'Courier New',monospace;
            font-size:12px; font-weight:bold; color:#111; user-select:none;
            cursor:pointer; flex-shrink:0; box-sizing:border-box; }
        .card.red { color:#c0392b; }
        .card.back { background:repeating-linear-gradient(45deg,#1a237e,#1a237e 5px,#283593 5px,#283593 10px);
            border-color:#0d1b6e; cursor:default; }
        .card.selected { outline:2px solid #f4a261; box-shadow:0 0 8px rgba(244,162,97,0.5); }
        .card.empty-slot { background:rgba(255,255,255,0.04); border:1.5px dashed #333;
            cursor:pointer; color:transparent; }
        .card-b { transform:rotate(180deg); }
        /* Layout */
        #top-row { display:flex; gap:8px; align-items:flex-start; margin-bottom:10px; }
        #stock-waste { display:flex; gap:6px; }
        #foundations { display:flex; gap:6px; margin-left:auto; }
        #tableau { display:flex; gap:6px; align-items:flex-start; }
        .col { display:flex; flex-direction:column; position:relative;
            min-height:80px; width:52px; flex-shrink:0; }
        .col .card + .card { margin-top:-50px; }
        .col .card.face-up + .card { margin-top:-46px; }
        /* Timer + controls */
        .ctrl-row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
        .sol-btn { background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.15);
            color:#bbb; border-radius:6px; padding:7px 16px;
            font-family:'Courier New',monospace; font-size:12px; cursor:pointer; }
        .sol-btn:hover { border-color:#f4a261; color:#fff; }
        .sol-btn.accent { background:#f4a261; border-color:#f4a261; color:#111; font-weight:bold; }
        #sol-timer { font-family:'Courier New',monospace; font-size:18px; color:#f4a261; }
        #sol-moves { font-family:'Courier New',monospace; font-size:12px; color:#888; }
        #sol-msg   { font-family:'Courier New',monospace; font-size:1.1em; color:#4caf50;
            text-align:center; min-height:1.3em; margin-top:6px; }
        #hs-box { text-align:center; font-family:'Courier New',monospace;
            font-size:11px; color:#666; margin-top:10px; }
        #hs-box strong { color:#f4a261; }
        .mode-tabs { display:flex; gap:8px; margin-bottom:12px; }
        .mode-tab { flex:1; padding:7px; background:rgba(255,255,255,0.05);
            border:1px solid #333; border-radius:6px; cursor:pointer;
            font-family:'Courier New',monospace; font-size:11px; letter-spacing:2px;
            text-transform:uppercase; color:#888; text-align:center; }
        .mode-tab.active { border-color:#f4a261; color:#f4a261; background:rgba(244,162,97,0.08); }
        #mp-room-info { font-family:'Courier New',monospace; font-size:12px; color:#888; margin-top:6px; }
        #mp-players-list { font-family:'Courier New',monospace; font-size:11px; color:#666; margin-top:6px; }
    </style>
</head>
<body class="notYetBody">
    <h2>Zyxxyz, the Patient</h2>
    <div class="navbar">
        <a href="../index.html">Home</a>
        <a href="../gamer/games.html">Games</a>
    </div>

    <div id="sol-page">
        <div class="sol-panel">
            <div class="sol-title">Klondike Solitaire</div>
            <div class="mode-tabs">
                <div class="mode-tab active" id="tab-sp" onclick="setMode('sp')">Single Player</div>
                <div class="mode-tab"        id="tab-mp" onclick="setMode('mp')">Race Mode</div>
            </div>
            <div id="sp-setup">
                <button class="sol-btn accent" onclick="spStart()">&#9654; New Game</button>
            </div>
            <div id="mp-setup" style="display:none;">
                <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
                    <button class="sol-btn accent" onclick="mpCreate()">Create Race</button>
                    <input id="mp-join-id" placeholder="Room ID" maxlength="6"
                        style="width:90px;background:rgba(255,255,255,0.07);border:1px solid #444;
                               color:#ccc;border-radius:5px;padding:5px 8px;
                               font-family:'Courier New',monospace;font-size:13px;">
                    <button class="sol-btn" onclick="mpJoin()">Join</button>
                </div>
                <div id="mp-room-info"></div>
                <div id="mp-players-list"></div>
            </div>
        </div>

        <div class="sol-panel" id="game-panel" style="display:none;">
            <div class="ctrl-row">
                <span id="sol-timer">0:00</span>
                <span id="sol-moves">0 moves</span>
                <button class="sol-btn" onclick="autoFoundation()">Auto</button>
                <button class="sol-btn" onclick="restartGame()">Restart</button>
                <span style="font-family:'Courier New',monospace;font-size:11px;color:#555;">
                    (click card to select, click destination to place)
                </span>
            </div>
            <div id="sol-msg"></div>

            <!-- Stock + Waste + Foundations -->
            <div id="top-row" style="margin-top:12px;">
                <div id="stock-waste">
                    <div id="stock-slot"  class="col" style="cursor:pointer;" onclick="doDrawStock()"></div>
                    <div id="waste-slot"  class="col"></div>
                </div>
                <div id="foundations">
                    <div id="found-S" class="col" onclick="doClickFoundation('S')"></div>
                    <div id="found-H" class="col" onclick="doClickFoundation('H')"></div>
                    <div id="found-D" class="col" onclick="doClickFoundation('D')"></div>
                    <div id="found-C" class="col" onclick="doClickFoundation('C')"></div>
                </div>
            </div>

            <!-- Tableau -->
            <div id="tableau"></div>
        </div>

        <div id="hs-box">
            &#127942; Best Score: <strong id="hs-val">—</strong> by <strong id="hs-user">—</strong>
            <span style="color:#555;">(10000 - moves×5 - seconds×2)</span>
        </div>
    </div>

    <button type="button" onclick="navigateToPage('../gamer/games.html')">&#8592; Back to Games</button>
    <script src="/js/gamer-chat.js"></script>
    <script>
        const myName = (typeof getOrCreateUsername === 'function') ? getOrCreateUsername() : 'Guest';
        const FB_HS  = 'scores/solitaire';
        document.getElementById('user-label') && (document.getElementById('user-label').textContent = myName);

        let game = null, timerInterval = null, elapsed = 0;
        let selection = null; // { source:'waste'|'tableau', col:?, idx:? }
        let mode = 'sp', roomId = null, roomRef = null;

        // ── Card rendering ──────────────────────────────────────────────────────
        function cardEl(card, faceDown, extraClass) {
            const d = document.createElement('div');
            if (faceDown) { d.className = 'card back'; return d; }
            const red = card.suit === 'H' || card.suit === 'D';
            d.className = 'card' + (red ? ' red' : '') + (extraClass ? ' ' + extraClass : '');
            const lbl = rankLabel(card.rank) + suitSymbol(card.suit);
            d.innerHTML = `<span>${lbl}</span><span class="card-b">${lbl}</span>`;
            return d;
        }

        function emptySlot(label) {
            const d = document.createElement('div');
            d.className = 'card empty-slot';
            d.innerHTML = `<span style="color:#444;font-size:9px;letter-spacing:1px;">${label}</span>`;
            return d;
        }

        // ── Full render ─────────────────────────────────────────────────────────
        function render() {
            if (!game) return;
            // Stock
            const stockEl = document.getElementById('stock-slot');
            stockEl.innerHTML = '';
            if (game.stock.length) {
                stockEl.appendChild(cardEl({ suit:'S', rank:2 }, true));
            } else {
                const e = emptySlot('↺');
                e.style.cursor = 'pointer';
                stockEl.appendChild(e);
            }

            // Waste
            const wasteEl = document.getElementById('waste-slot');
            wasteEl.innerHTML = '';
            if (game.waste.length) {
                const top = game.waste[game.waste.length - 1];
                const c   = cardEl(top, false, selection && selection.source === 'waste' ? 'selected' : '');
                c.onclick = () => selectWaste();
                wasteEl.appendChild(c);
            } else {
                wasteEl.appendChild(emptySlot(''));
            }

            // Foundations
            ['S','H','D','C'].forEach(suit => {
                const el  = document.getElementById('found-' + suit);
                el.innerHTML = '';
                const top = game.foundations[suit];
                if (top > 0) {
                    el.appendChild(cardEl({ suit, rank: top }, false));
                } else {
                    el.appendChild(emptySlot(suitSymbol(suit)));
                }
            });

            // Tableau
            const tabEl = document.getElementById('tableau');
            tabEl.innerHTML = '';
            game.tableau.forEach((col, ci) => {
                const colEl = document.createElement('div');
                colEl.className = 'col';
                if (col.length === 0) {
                    const e = emptySlot('K');
                    e.onclick = () => dropOnTableau(ci);
                    colEl.appendChild(e);
                } else {
                    col.forEach((card, ri) => {
                        const isSel = selection && selection.source === 'tableau'
                            && selection.col === ci && ri >= selection.idx;
                        const c = cardEl(card, !card.faceUp, isSel ? 'selected' : '');
                        if (card.faceUp) {
                            c.onclick = () => clickTableau(ci, ri);
                        }
                        colEl.appendChild(c);
                    });
                }
                tabEl.appendChild(colEl);
            });

            document.getElementById('sol-moves').textContent = game.moves + ' moves';
        }

        // ── Selection & moves ───────────────────────────────────────────────────
        function selectWaste() {
            if (!game.waste.length) return;
            if (selection && selection.source === 'waste') { selection = null; render(); return; }
            selection = { source: 'waste' };
            render();
        }

        function clickTableau(col, idx) {
            const card = game.tableau[col][idx];
            if (!card.faceUp) return;
            if (selection) {
                dropOnTableau(col);
            } else {
                selection = { source: 'tableau', col, idx };
                render();
            }
        }

        function doClickFoundation(suit) {
            if (!selection) return;
            let next;
            if (selection.source === 'waste')
                next = wasteToFoundation(game);
            else if (selection.source === 'tableau' && selection.idx === game.tableau[selection.col].length - 1)
                next = tableauToFoundation(game, selection.col);
            else { selection = null; render(); return; }
            if (next !== game) { game = next; selection = null; checkSolved(); render(); }
        }

        function dropOnTableau(col) {
            if (!selection) return;
            let next;
            if (selection.source === 'waste')
                next = wasteToTableau(game, col);
            else
                next = tableauToTableau(game, selection.col, selection.idx, col);
            if (next !== game) { game = next; selection = null; checkSolved(); render(); }
            else { selection = null; render(); }
        }

        function doDrawStock() {
            selection = null;
            game = drawFromStock(game);
            render();
        }

        function autoFoundation() {
            // Keep moving cards to foundation as long as possible
            let changed = true;
            while (changed) {
                changed = false;
                let next = wasteToFoundation(game);
                if (next !== game) { game = next; changed = true; continue; }
                for (let i = 0; i < 7; i++) {
                    next = tableauToFoundation(game, i);
                    if (next !== game) { game = next; changed = true; break; }
                }
            }
            selection = null;
            checkSolved();
            render();
        }

        function checkSolved() {
            if (!game.solved) return;
            clearInterval(timerInterval);
            document.getElementById('sol-msg').textContent = '🎉 Solved in ' + fmtTime(elapsed) + '!';
            const score = calcSolitaireScore(game.moves, elapsed);
            maybeUpdateHighScore(score);
            if (mode === 'mp' && roomRef) {
                roomRef.child('players/' + myName).update({ solved: true, time: elapsed, moves: game.moves });
            }
        }

        // ── Timer ───────────────────────────────────────────────────────────────
        function startTimer() {
            clearInterval(timerInterval);
            elapsed = 0;
            timerInterval = setInterval(() => {
                elapsed++;
                document.getElementById('sol-timer').textContent = fmtTime(elapsed);
            }, 1000);
        }

        function fmtTime(s) {
            return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
        }

        // ── SP ──────────────────────────────────────────────────────────────────
        function setMode(m) {
            mode = m;
            document.getElementById('tab-sp').classList.toggle('active', m === 'sp');
            document.getElementById('tab-mp').classList.toggle('active', m === 'mp');
            document.getElementById('sp-setup').style.display = m === 'sp' ? '' : 'none';
            document.getElementById('mp-setup').style.display = m === 'mp' ? '' : 'none';
        }

        function spStart() {
            game = newSolitaireGame();
            selection = null;
            document.getElementById('game-panel').style.display = '';
            document.getElementById('sol-msg').textContent = '';
            startTimer();
            render();
        }

        function restartGame() {
            if (!game) return;
            spStart();
        }

        // ── MP Race ─────────────────────────────────────────────────────────────
        function mpRoomPath(id) { return 'solitaireRooms/' + id; }

        function mpCreate() {
            if (!window.FIREBASE_READY) { alert('Firebase not available.'); return; }
            roomId  = Math.random().toString(36).slice(2,8).toUpperCase();
            roomRef = firebase.database().ref(mpRoomPath(roomId));
            // Shuffle and share deck so all players race the same layout
            const sharedDeck = shuffle(createDeck());
            game = newSolitaireGame(sharedDeck);
            roomRef.set({ host: myName, deck: sharedDeck, started: true,
                          players: { [myName]: { solved: false } } });
            document.getElementById('mp-room-info').textContent = 'Room: ' + roomId + ' — share with friends';
            listenMPRoom();
            document.getElementById('game-panel').style.display = '';
            document.getElementById('sol-msg').textContent = '';
            selection = null;
            startTimer();
            render();
        }

        function mpJoin() {
            if (!window.FIREBASE_READY) { alert('Firebase not available.'); return; }
            roomId  = (document.getElementById('mp-join-id').value || '').toUpperCase();
            if (!roomId) return;
            roomRef = firebase.database().ref(mpRoomPath(roomId));
            roomRef.once('value', snap => {
                const v = snap.val();
                if (!v) { alert('Room not found.'); return; }
                game = newSolitaireGame(Object.values(v.deck));
                roomRef.child('players/' + myName).set({ solved: false });
                listenMPRoom();
                document.getElementById('game-panel').style.display = '';
                document.getElementById('sol-msg').textContent = '';
                selection = null;
                startTimer();
                render();
            });
        }

        function listenMPRoom() {
            if (!roomRef) return;
            roomRef.child('players').on('value', snap => {
                const players = snap.val() || {};
                const list    = document.getElementById('mp-players-list');
                list.innerHTML = Object.entries(players).map(([name, data]) =>
                    name + ': ' + (data.solved ? '✓ solved in ' + fmtTime(data.time || 0) + ' ('+data.moves+' moves)' : 'playing…')
                ).join('<br>');
            });
        }

        // ── High score ──────────────────────────────────────────────────────────
        function maybeUpdateHighScore(score) {
            if (!window.FIREBASE_READY) return;
            const ref = firebase.database().ref(FB_HS);
            ref.once('value', snap => {
                const v   = snap.val();
                const cur = (v && Number.isFinite(v.score)) ? v.score : 0;
                if (score > cur) ref.set({ score: Math.min(score, 999999), username: String(myName).slice(0,40) });
            });
        }

        if (window.FIREBASE_READY) {
            firebase.database().ref(FB_HS).on('value', snap => {
                const v = snap.val();
                if (!v) return;
                document.getElementById('hs-val').textContent  = Number.isFinite(v.score) ? v.score : '—';
                document.getElementById('hs-user').textContent = typeof v.username === 'string' ? v.username.slice(0,40) : '—';
            });
        }
    </script>
</body>
</html>
