<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Five Card Draw — ZYXXYZ's Whymzykal Wunderland</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/script.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="/js/firebase-config.js"></script>
    <script src="/js/username-gen.js"></script>
    <script src="/js/card-engine.js"></script>
    <script src="/js/five-card-draw-engine.js"></script>
    <style>
        #fcd-page { max-width:720px; margin:0 auto; padding:0 16px 80px; }
        .fcd-panel { background:rgba(0,0,0,0.75); border:1px solid #2a2a2a;
            border-radius:12px; padding:20px; margin-bottom:16px; }
        .fcd-title { font-family:'Courier New',monospace; font-size:11px; letter-spacing:3px;
            text-transform:uppercase; color:#f4a261;
            border-bottom:1px solid #2a2a2a; padding-bottom:8px; margin:0 0 16px; }
        .card { display:inline-flex; flex-direction:column; justify-content:space-between;
            width:54px; height:80px; background:#f8f8f0; border:1px solid #bbb;
            border-radius:7px; padding:4px 5px; font-family:'Courier New',monospace;
            font-size:13px; font-weight:bold; color:#111; user-select:none;
            flex-shrink:0; cursor:pointer; transition:transform .15s, border-color .15s; }
        .card.red  { color:#c0392b; }
        .card.back { background:repeating-linear-gradient(45deg,#1a237e,#1a237e 4px,#283593 4px,#283593 8px);
            border-color:#0d1b6e; cursor:default; }
        .card.ghost { background:rgba(255,255,255,0.04); border:1px dashed #333; cursor:default; }
        .card.selected { border-color:#e74c3c; transform:translateY(8px); }
        .card-b { transform:rotate(180deg); }
        .mode-tabs { display:flex; gap:8px; margin-bottom:14px; }
        .mode-tab { flex:1; padding:8px; background:rgba(255,255,255,0.05);
            border:1px solid #333; border-radius:6px; cursor:pointer;
            font-family:'Courier New',monospace; font-size:11px; letter-spacing:2px;
            text-transform:uppercase; color:#888; text-align:center; }
        .mode-tab.active { border-color:#f4a261; color:#f4a261; background:rgba(244,162,97,0.08); }
        .fcd-btn { background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.15);
            color:#bbb; border-radius:6px; padding:8px 16px;
            font-family:'Courier New',monospace; font-size:12px; cursor:pointer; }
        .fcd-btn:hover:not(:disabled) { border-color:#f4a261; color:#fff; }
        .fcd-btn:disabled { opacity:0.3; cursor:default; }
        .fcd-btn.accent { background:#f4a261; border-color:#f4a261; color:#111; font-weight:bold; }
        .fcd-btn.danger { background:#c0392b; border-color:#c0392b; color:#fff; }
        .fcd-row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:10px; }
        .phase-bar { display:flex; gap:4px; margin-bottom:14px; }
        .phase-step { flex:1; text-align:center; padding:5px 2px;
            font-family:'Courier New',monospace; font-size:9px; letter-spacing:1px;
            text-transform:uppercase; border-radius:4px;
            background:rgba(255,255,255,0.05); border:1px solid #2a2a2a; color:#555; }
        .phase-step.active { background:rgba(244,162,97,0.15); border-color:#f4a261; color:#f4a261; }
        .phase-step.done   { border-color:#4caf50; color:#4caf50; }
        .players-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
            gap:8px; margin-bottom:14px; }
        .player-seat { background:rgba(255,255,255,0.04); border:1px solid #2a2a2a;
            border-radius:8px; padding:10px; }
        .player-seat.active { border-color:#f4a261; }
        .player-seat.folded { opacity:0.4; }
        .player-seat.winner { border-color:#4caf50; background:rgba(76,175,80,0.06); }
        .seat-name  { font-family:'Courier New',monospace; font-size:10px; color:#aaa;
            letter-spacing:1px; margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .seat-chips { font-family:'Courier New',monospace; font-size:13px; color:#f4a261; }
        .seat-bet   { font-family:'Courier New',monospace; font-size:10px; color:#888; margin-top:2px; }
        .seat-cards { display:flex; gap:3px; margin-top:6px; }
        .seat-status { font-family:'Courier New',monospace; font-size:9px; color:#aaa;
            margin-top:4px; letter-spacing:1px; }
        .hand-name  { font-family:'Courier New',monospace; font-size:9px; margin-top:4px; letter-spacing:1px; }
        .hand-name.winner { color:#4caf50; }
        .your-hand { border-top:1px solid #2a2a2a; padding-top:14px; margin-top:6px; }
        .your-cards { display:flex; gap:8px; margin:10px 0; flex-wrap:wrap; }
        .pot-info { font-family:'Courier New',monospace; font-size:13px; color:#888;
            text-align:center; margin-bottom:10px; }
        .pot-info .v { color:#f4a261; font-size:16px; }
        .action-panel { border-top:1px solid #2a2a2a; padding-top:14px; margin-top:8px; }
        #raise-input { width:72px; background:rgba(255,255,255,0.07); border:1px solid #444;
            color:#f4a261; font-family:'Courier New',monospace; font-size:14px;
            border-radius:5px; padding:4px 8px; text-align:center; }
        .draw-hint { font-family:'Courier New',monospace; font-size:11px; color:#888;
            margin-bottom:8px; letter-spacing:1px; }
        #fcd-msg { font-family:'Courier New',monospace; font-size:1.1em;
            min-height:1.4em; text-align:center; margin:10px 0; }
        #fcd-msg.win  { color:#4caf50; }
        #fcd-msg.lose { color:#e74c3c; }
        #mp-setup input { background:rgba(255,255,255,0.07); border:1px solid #444;
            color:#ccc; border-radius:5px; padding:5px 10px;
            font-family:'Courier New',monospace; font-size:13px; }
        .lobby-row { font-family:'Courier New',monospace; font-size:12px; color:#ccc; padding:3px 0; }
        #hs-box { text-align:center; font-family:'Courier New',monospace;
            font-size:11px; color:#666; margin-top:12px; }
        #hs-box strong { color:#f4a261; }
        select.fcd-sel { background:rgba(255,255,255,0.07); border:1px solid #444;
            color:#ccc; border-radius:5px; padding:4px 8px;
            font-family:'Courier New',monospace; font-size:12px; }
    </style>
</head>
<body class="notYetBody">
    <h2>Zyxxyz, the Card Shark</h2>
    <div class="navbar">
        <a href="../index.html">Home</a>
        <a href="../gamer/games.html">Games</a>
    </div>

    <div id="fcd-page">
        <div class="fcd-panel">
            <div class="fcd-title">Five Card Draw</div>
            <div class="mode-tabs">
                <div class="mode-tab active" id="tab-sp" onclick="setMode('sp')">Single Player</div>
                <div class="mode-tab"        id="tab-mp" onclick="setMode('mp')">Multiplayer</div>
            </div>

            <div id="sp-setup">
                <div class="fcd-row">
                    <label style="font-family:'Courier New',monospace;font-size:11px;color:#888;">PLAYERS (incl. you)</label>
                    <select id="sp-count" class="fcd-sel">
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4" selected>4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                    </select>
                    <button class="fcd-btn accent" onclick="spStart()">&#9654; New Game</button>
                </div>
            </div>

            <div id="mp-setup" style="display:none;">
                <div class="fcd-row">
                    <button class="fcd-btn accent" onclick="mpCreate()">Create Room</button>
                    <input id="mp-join-id" placeholder="Room ID" maxlength="6" style="width:90px;">
                    <button class="fcd-btn" onclick="mpJoin()">Join</button>
                </div>
                <div id="mp-room-info" style="font-family:'Courier New',monospace;font-size:12px;color:#888;margin-top:6px;"></div>
                <div id="mp-lobby" style="margin-top:10px;"></div>
            </div>
        </div>

        <div class="fcd-panel" id="game-panel" style="display:none;">
            <div class="fcd-title">
                <span id="phase-label">Waiting</span>
                &ensp;<span id="dealer-label" style="color:#555;font-size:9px;"></span>
            </div>

            <div class="phase-bar">
                <div class="phase-step" id="ph-bet1">Bet 1</div>
                <div class="phase-step" id="ph-draw">Draw</div>
                <div class="phase-step" id="ph-bet2">Bet 2</div>
                <div class="phase-step" id="ph-showdown">Showdown</div>
            </div>

            <div class="pot-info">
                Pot: <span class="v" id="pot-val">0</span>
                &ensp;|&ensp;
                Current Bet: <span class="v" style="font-size:14px;" id="bet-val">0</span>
            </div>

            <div class="players-grid" id="players-grid"></div>

            <div class="your-hand">
                <div style="font-family:'Courier New',monospace;font-size:10px;color:#888;letter-spacing:2px;">YOUR HAND</div>
                <div class="draw-hint" id="draw-hint" style="display:none;">Click cards to select for discard</div>
                <div class="your-cards" id="your-cards"></div>
                <div id="your-hand-name" style="font-family:'Courier New',monospace;font-size:11px;color:#4caf50;margin-top:4px;"></div>
                <div style="font-family:'Courier New',monospace;font-size:11px;color:#888;margin-top:4px;">
                    Chips: <span style="color:#f4a261;font-size:14px;" id="my-chips">0</span>
                    &ensp;Bet: <span style="color:#888;" id="my-bet">0</span>
                </div>
            </div>

            <div id="fcd-msg"></div>

            <!-- Draw phase actions -->
            <div class="action-panel" id="draw-panel" style="display:none;">
                <div class="fcd-row">
                    <button class="fcd-btn accent" onclick="doDraw()">Draw Selected</button>
                    <button class="fcd-btn" onclick="standPat()">Stand Pat (keep all)</button>
                </div>
                <div style="font-family:'Courier New',monospace;font-size:10px;color:#888;margin-top:4px;">
                    <span id="selected-count">0</span> card(s) selected for discard
                </div>
            </div>

            <!-- Betting actions -->
            <div class="action-panel" id="bet-panel" style="display:none;">
                <div class="fcd-row">
                    <button class="fcd-btn danger" onclick="doBetAction('fold')">Fold</button>
                    <button class="fcd-btn" id="btn-check" onclick="doBetAction('check')">Check</button>
                    <button class="fcd-btn accent" id="btn-call" onclick="doBetAction('call')">Call</button>
                </div>
                <div class="fcd-row">
                    <input type="number" id="raise-input" min="10" value="20">
                    <button class="fcd-btn" onclick="doBetAction('raise', +document.getElementById('raise-input').value)">Raise</button>
                </div>
            </div>

            <div id="next-panel" style="display:none;margin-top:12px;">
                <button class="fcd-btn accent" id="btn-next-hand" onclick="newHand()">Next Hand</button>
            </div>
        </div>

        <div id="hs-box">
            &#127942; Most Chips: <strong id="hs-val">—</strong> by <strong id="hs-user">—</strong>
        </div>
    </div>

    <button type="button" onclick="navigateToPage('../gamer/games.html')">&#8592; Back to Games</button>
    <script src="/js/gamer-chat.js"></script>
    <script>
        function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

        const myName   = (typeof getOrCreateUsername === 'function') ? getOrCreateUsername() : 'Guest';
        const FB_HS    = 'scores/fivecarddraw';
        const AI_NAMES = ['Aria','Blake','Casey','Dana','Ellis'];
        const PHASES   = ['bet1','draw','bet2','showdown'];

        let state = null, mode = 'sp', myIdx = 0;
        let roomId = null, roomRef = null, isHost = false, mpMyIdx = null;
        let aiTimer = null;
        let selectedCards = new Set(); // indices of cards selected for discard

        // ── Card rendering ────────────────────────────────────────────────────
        function cardEl(card, faceDown, idx) {
            const d = document.createElement('div');
            if (faceDown) { d.className = 'card back'; return d; }
            if (!card)    { d.className = 'card ghost'; return d; }
            d.className = 'card' + ((card.suit === 'H' || card.suit === 'D') ? ' red' : '');
            const lbl = rankLabel(card.rank) + suitSymbol(card.suit);
            d.innerHTML = `<span>${lbl}</span><span class="card-b">${lbl}</span>`;
            if (idx !== undefined) {
                d.dataset.idx = idx;
                d.onclick = () => toggleCard(idx);
            }
            return d;
        }

        function toggleCard(idx) {
            if (!state || state.phase !== 'draw') return;
            const humanIdx = mode === 'sp' ? myIdx : mpMyIdx;
            if (state.activePlayerIdx !== humanIdx) return;
            if (selectedCards.has(idx)) selectedCards.delete(idx);
            else selectedCards.add(idx);
            renderYourCards();
        }

        function renderYourCards() {
            const humanIdx = mode === 'sp' ? myIdx : (mpMyIdx !== null ? mpMyIdx : -1);
            if (humanIdx < 0 || !state) return;
            const me = state.players[humanIdx];
            const container = document.getElementById('your-cards');
            container.innerHTML = '';
            (me.hand || []).forEach((c, i) => {
                const el = cardEl(c, false, i);
                if (selectedCards.has(i)) el.classList.add('selected');
                container.appendChild(el);
            });
            document.getElementById('selected-count').textContent = selectedCards.size;
        }

        // ── Mode switching ────────────────────────────────────────────────────
        function setMode(m) {
            mode = m;
            document.getElementById('tab-sp').classList.toggle('active', m === 'sp');
            document.getElementById('tab-mp').classList.toggle('active', m === 'mp');
            document.getElementById('sp-setup').style.display = m === 'sp' ? '' : 'none';
            document.getElementById('mp-setup').style.display = m === 'mp' ? '' : 'none';
            document.getElementById('game-panel').style.display = 'none';
        }

        // ── SP ────────────────────────────────────────────────────────────────
        function spStart() {
            const n = +document.getElementById('sp-count').value;
            state  = newFCDState([myName, ...AI_NAMES.slice(0, n - 1)]);
            myIdx  = 0;
            state  = startFCDHand(state);
            selectedCards.clear();
            document.getElementById('game-panel').style.display = '';
            renderState();
            runAITurns();
        }

        function newHand() {
            if (mode === 'sp') {
                state = { ...state, dealerIdx:(state.dealerIdx + 1) % state.players.length };
                state = startFCDHand(state);
                selectedCards.clear();
                renderState();
                runAITurns();
            } else if (isHost) {
                let ns = { ...state, dealerIdx:(state.dealerIdx + 1) % state.players.length };
                ns = startFCDHand(ns);
                pushMPState(ns);
            } else {
                roomRef && roomRef.child('requestNewHand').set(myName);
            }
        }

        function doBetAction(action, amount) {
            if (!state) return;
            const humanIdx = mode === 'sp' ? myIdx : mpMyIdx;
            if (state.activePlayerIdx !== humanIdx) return;
            if (mode === 'sp') {
                state = fcdAction(state, action, amount);
                selectedCards.clear();
                renderState();
                if (state.phase !== 'showdown') runAITurns();
                else onShowdown();
            } else {
                if (isHost) {
                    state = fcdAction(state, action, amount);
                    pushMPState(state);
                } else {
                    roomRef.child('pendingAction').set({ username:myName, action, amount:amount||0, ts:Date.now() });
                }
            }
        }

        function doDraw() {
            const humanIdx = mode === 'sp' ? myIdx : mpMyIdx;
            if (!state || state.activePlayerIdx !== humanIdx) return;
            const discards = Array.from(selectedCards);
            if (mode === 'sp') {
                state = fcdDraw(state, humanIdx, discards);
                selectedCards.clear();
                renderState();
                if (state.phase !== 'showdown') runAITurns();
                else onShowdown();
            } else {
                if (isHost) {
                    state = fcdDraw(state, humanIdx, discards);
                    pushMPState(state);
                } else {
                    roomRef.child('pendingAction').set({ username:myName, action:'draw', discards, ts:Date.now() });
                }
            }
        }

        function standPat() {
            selectedCards.clear();
            renderYourCards();
            doDraw();
        }

        function runAITurns() {
            clearTimeout(aiTimer);
            if (!state || state.phase === 'showdown' || state.phase === 'waiting') return;
            if (state.activePlayerIdx === myIdx) { showMyActions(); return; }
            hideAllActions();
            aiTimer = setTimeout(() => {
                if (!state || state.activePlayerIdx === myIdx) return;
                const ai = getFCDAIAction(state, state.activePlayerIdx);
                if (ai.action === 'draw') {
                    state = fcdDraw(state, state.activePlayerIdx, ai.discards);
                } else {
                    state = fcdAction(state, ai.action, ai.amount);
                }
                selectedCards.clear();
                renderState();
                if (state.phase === 'showdown') onShowdown();
                else runAITurns();
            }, 700);
        }

        function onShowdown() {
            if (mode === 'sp') maybeUpdateHighScore(state.players[myIdx].chips);
        }

        function showMyActions() {
            if (!state) return;
            const humanIdx = mode === 'sp' ? myIdx : mpMyIdx;
            if (humanIdx === null || humanIdx < 0) return;
            const me = state.players[humanIdx];
            if (me.folded) { hideAllActions(); return; }

            if (state.phase === 'draw') {
                document.getElementById('draw-panel').style.display = '';
                document.getElementById('bet-panel').style.display  = 'none';
                document.getElementById('draw-hint').style.display  = '';
            } else if (state.phase === 'bet1' || state.phase === 'bet2') {
                document.getElementById('draw-panel').style.display = 'none';
                document.getElementById('bet-panel').style.display  = '';
                document.getElementById('draw-hint').style.display  = 'none';
                const toCall = state.currentBet - me.bet;
                document.getElementById('btn-call').textContent  = toCall > 0 ? `Call $${toCall}` : 'Call';
                document.getElementById('btn-call').disabled     = toCall === 0;
                document.getElementById('btn-check').disabled    = toCall > 0;
                document.getElementById('raise-input').min       = Math.max(FCD_ANTE, state.currentBet - me.bet + FCD_ANTE);
            } else {
                hideAllActions();
            }
        }

        function hideAllActions() {
            document.getElementById('draw-panel').style.display = 'none';
            document.getElementById('bet-panel').style.display  = 'none';
            document.getElementById('draw-hint').style.display  = 'none';
        }

        // ── Render ────────────────────────────────────────────────────────────
        function renderState() {
            if (!state) return;
            const humanIdx = mode === 'sp' ? myIdx : (mpMyIdx !== null ? mpMyIdx : -1);
            const phIdx = PHASES.indexOf(state.phase);

            const phaseNames = { bet1:'Bet 1', draw:'Draw', bet2:'Bet 2', showdown:'Showdown', waiting:'Waiting' };
            document.getElementById('phase-label').textContent = phaseNames[state.phase] || state.phase;
            const dealer = state.players[state.dealerIdx];
            document.getElementById('dealer-label').textContent = dealer ? '[Dealer: '+dealer.name+']' : '';

            PHASES.forEach((ph, i) => {
                const el = document.getElementById('ph-' + ph);
                el.className = 'phase-step' +
                    (i < phIdx ? ' done' : i === phIdx ? ' active' : '');
            });

            document.getElementById('pot-val').textContent = state.pot;
            document.getElementById('bet-val').textContent = state.currentBet;

            const winnerId = state.winner;
            const hrMap = {};
            (state.handResults||[]).forEach(hr => hrMap[hr.id] = hr.eval);

            // Opponents grid
            const grid = document.getElementById('players-grid');
            grid.innerHTML = '';
            state.players.forEach((p, i) => {
                if (i === humanIdx) return;
                const isActive  = state.activePlayerIdx === i && state.phase !== 'showdown';
                const isWinner  = p.id === winnerId;
                const showCards = state.phase === 'showdown' && !p.folded;

                const seat = document.createElement('div');
                seat.className = 'player-seat' +
                    (isActive  ? ' active'  : '') +
                    (p.folded  ? ' folded'  : '') +
                    (isWinner  ? ' winner'  : '');

                const cardsDiv = document.createElement('div');
                cardsDiv.className = 'seat-cards';
                if (showCards) {
                    (p.hand||[]).forEach(c => cardsDiv.appendChild(cardEl(c, false)));
                } else if (p.hand && p.hand.length) {
                    p.hand.forEach(() => cardsDiv.appendChild(cardEl(null, true)));
                }

                const status = p.folded ? 'FOLDED' :
                    (state.phase === 'draw' && !p.drawn ? 'DRAWING…' :
                    (isActive ? 'THINKING…' : ''));
                const handName = (showCards && hrMap[p.id]) ? hrMap[p.id].name : '';

                seat.innerHTML = `
                    <div class="seat-name">${escHtml(p.name)}${isWinner ? ' ★' : ''}</div>
                    <div class="seat-chips">$${p.chips}</div>
                    <div class="seat-bet">${p.bet > 0 ? 'Bet: $'+p.bet : ''}</div>
                `;
                seat.appendChild(cardsDiv);
                if (status) {
                    const s=document.createElement('div'); s.className='seat-status'; s.textContent=status; seat.appendChild(s);
                }
                if (handName) {
                    const hn=document.createElement('div');
                    hn.className='hand-name'+(isWinner?' winner':''); hn.textContent=handName; seat.appendChild(hn);
                }
                grid.appendChild(seat);
            });

            // Your hand
            if (humanIdx >= 0 && humanIdx < state.players.length) {
                const me = state.players[humanIdx];
                renderYourCards();
                document.getElementById('my-chips').textContent = me.chips;
                document.getElementById('my-bet').textContent   = me.bet;

                const ev = (me.hand && me.hand.length === 5) ? evaluateHand(me.hand) : null;
                document.getElementById('your-hand-name').textContent = ev ? ev.name : '';
            }

            // Message
            const msg = document.getElementById('fcd-msg');
            msg.className = ''; msg.textContent = '';

            if (state.phase === 'showdown') {
                hideAllActions();
                const winner = state.players.find(p => p.id === state.winner);
                if (winner) {
                    if (humanIdx >= 0 && winner.id === state.players[humanIdx].id) {
                        msg.textContent = 'You win the pot!'; msg.className = 'win';
                    } else {
                        msg.textContent = (winner.name||'?') + ' wins the pot!'; msg.className = 'lose';
                    }
                }
                document.getElementById('next-panel').style.display =
                    (mode === 'sp' || isHost) ? '' : 'none';
            } else {
                document.getElementById('next-panel').style.display = 'none';
                if (humanIdx >= 0 && state.activePlayerIdx === humanIdx &&
                        !state.players[humanIdx].folded) {
                    showMyActions();
                } else if (mode === 'mp') {
                    hideAllActions();
                }
            }
        }

        // ── MP ────────────────────────────────────────────────────────────────
        function mpCreate() {
            if (!window.FIREBASE_READY) { alert('Firebase not available.'); return; }
            isHost = true; mpMyIdx = 0;
            roomId  = Math.random().toString(36).slice(2,8).toUpperCase();
            roomRef = firebase.database().ref('fcdRooms/' + roomId);
            state   = newFCDState([myName]);
            roomRef.set({ host:myName, lobby:[myName], state:JSON.stringify(state), pendingAction:null });
            document.getElementById('mp-room-info').textContent = 'Room: ' + roomId + ' — share with friends';
            document.getElementById('game-panel').style.display = '';
            listenMPRoom();
        }

        function mpJoin() {
            if (!window.FIREBASE_READY) { alert('Firebase not available.'); return; }
            roomId = (document.getElementById('mp-join-id').value||'').toUpperCase();
            if (!roomId) return;
            roomRef = firebase.database().ref('fcdRooms/' + roomId);
            roomRef.once('value', snap => {
                const v = snap.val();
                if (!v) { alert('Room not found.'); return; }
                isHost = (v.host === myName);
                const lobby = v.lobby || [];
                if (!lobby.includes(myName)) {
                    lobby.push(myName);
                    roomRef.child('lobby').set(lobby);
                }
                mpMyIdx = lobby.indexOf(myName);
                document.getElementById('mp-room-info').textContent = 'Joined room: ' + roomId;
                document.getElementById('game-panel').style.display = '';
                listenMPRoom();
            });
        }

        function listenMPRoom() {
            if (!roomRef) return;
            roomRef.child('state').on('value', snap => {
                const raw = snap.val();
                if (!raw) return;
                state = JSON.parse(raw);
                if (mpMyIdx === null)
                    mpMyIdx = state.players.findIndex(p => p.name === myName);
                selectedCards.clear();
                renderState();
            });
            roomRef.child('pendingAction').on('value', snap => {
                if (!isHost || !snap.val()) return;
                const act = snap.val();
                if (!state) return;
                const pidx = state.players.findIndex(p => p.name === act.username);
                if (pidx < 0 || state.activePlayerIdx !== pidx) return;
                if (act.action === 'draw') {
                    state = fcdDraw(state, pidx, act.discards || []);
                } else {
                    state = fcdAction(state, act.action, act.amount || 0);
                }
                pushMPState(state);
                roomRef.child('pendingAction').remove();
            });
            roomRef.child('requestNewHand').on('value', snap => {
                if (!isHost || !snap.val()) return;
                let ns = { ...state, dealerIdx:(state.dealerIdx+1) % state.players.length };
                ns = startFCDHand(ns);
                pushMPState(ns);
                roomRef.child('requestNewHand').remove();
            });
            roomRef.child('lobby').on('value', snap => {
                const lobby = snap.val() || [];
                renderLobby(lobby);
            });
        }

        function pushMPState(s) {
            state = s;
            if (s.phase === 'showdown') maybeUpdateHighScore(s.players.find(p=>p.name===myName)?.chips || 0);
            roomRef.child('state').set(JSON.stringify(s));
        }

        function renderLobby(lobby) {
            const lb = document.getElementById('mp-lobby');
            lb.innerHTML = '<div style="font-family:\'Courier New\',monospace;font-size:10px;color:#555;letter-spacing:1px;margin-bottom:6px;">PLAYERS IN LOBBY:</div>';
            lobby.forEach(name => {
                const d = document.createElement('div');
                d.className = 'lobby-row';
                d.textContent = name + (name === myName ? ' (you)' : '');
                lb.appendChild(d);
            });
            if (isHost && state && state.phase === 'waiting' && lobby.length >= 2) {
                const btn = document.createElement('button');
                btn.className = 'fcd-btn accent';
                btn.style.marginTop = '10px';
                btn.textContent = '▶ Start Hand';
                btn.onclick = () => {
                    const ns = startFCDHand(newFCDState(lobby));
                    pushMPState(ns);
                };
                lb.appendChild(btn);
            }
        }

        // ── High scores ───────────────────────────────────────────────────────
        function maybeUpdateHighScore(chips) {
            if (!window.FIREBASE_READY || !chips) return;
            const ref = firebase.database().ref(FB_HS);
            ref.once('value', snap => {
                const v   = snap.val();
                const cur = (v && Number.isFinite(v.score)) ? v.score : 0;
                if (chips > cur)
                    ref.set({ score:Math.min(chips, 999999), username:String(myName).slice(0,40) });
            });
        }

        if (window.FIREBASE_READY) {
            firebase.database().ref(FB_HS).on('value', snap => {
                const v = snap.val();
                if (!v) return;
                document.getElementById('hs-val').textContent  = Number.isFinite(v.score) ? v.score : '—';
                document.getElementById('hs-user').textContent = typeof v.username === 'string' ? v.username.slice(0,40) : '—';
            });
        }
    </script>
</body>
</html>
