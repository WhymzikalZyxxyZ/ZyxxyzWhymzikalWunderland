<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzle — ZYXXYZ's Whymzykal Wunderland</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/script.js" defer></script>
    <link rel="preconnect" href="https://www.gstatic.com">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="/js/firebase-config.js"></script>
    <script src="/js/username-gen.js"></script>
    <script src="/js/puzzle-engine.js"></script>
    <style>
        #puz-page { max-width: 700px; margin: 0 auto; padding: 0 16px 80px; }
        .puz-panel { background:rgba(0,0,0,0.75); border:1px solid #2a2a2a;
            border-radius:12px; padding:20px; margin-bottom:16px; }
        .puz-title { font-family:'Courier New',monospace; font-size:11px; letter-spacing:3px;
            text-transform:uppercase; color:#f4a261;
            border-bottom:1px solid #2a2a2a; padding-bottom:8px; margin:0 0 16px; }
        .setup-row { display:flex; align-items:center; gap:12px; margin-bottom:12px; }
        .setup-row label { font-family:'Courier New',monospace; font-size:11px; color:#888; white-space:nowrap; }
        #piece-count-slider { flex:1; accent-color:#f4a261; }
        #piece-count-val { font-family:'Courier New',monospace; font-size:13px;
            color:#f4a261; min-width:36px; }
        .ctrl-btn { background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.14);
            color:#bbb; border-radius:6px; padding:8px 18px;
            font-family:'Courier New',monospace; font-size:12px; cursor:pointer; }
        .ctrl-btn:hover { border-color:#f4a261; color:#fff; }
        .ctrl-btn.accent { background:#f4a261; border-color:#f4a261; color:#111; font-weight:bold; }
        #puz-board-wrap {
            position:relative; margin:0 auto;
            border:2px solid #2a2a2a; border-radius:4px; overflow:hidden;
            touch-action:none; user-select:none;
            background:#111;
        }
        #puz-source { margin-top:12px; }
        #source-title { font-family:'Courier New',monospace; font-size:9px;
            letter-spacing:2px; color:#555; margin-bottom:6px; }
        #puz-tray { display:flex; flex-wrap:wrap; gap:4px; }
        .puz-piece {
            cursor:grab; flex-shrink:0; touch-action:none;
            transition:opacity 0.1s, filter 0.1s;
        }
        .puz-piece:hover { filter: brightness(1.18); }
        .puz-piece:active { opacity:0.5; cursor:grabbing; }
        #timer-row { display:flex; gap:20px; align-items:center; margin-top:8px; }
        #puz-timer { font-family:'Courier New',monospace; font-size:18px; color:#f4a261; }
        #puz-progress { font-family:'Courier New',monospace; font-size:11px; color:#888; }
        #puz-done-msg { text-align:center; font-family:'Courier New',monospace;
            font-size:1.4em; color:#4caf50; min-height:1.5em; margin-top:8px; }
        #hs-box { text-align:center; font-family:'Courier New',monospace;
            font-size:11px; color:#666; margin-top:12px; }
        #hs-box strong { color:#f4a261; }
    </style>
</head>
<body class="wunderBody">
    <div class="navbar">
        <a href="../">Home</a>
        <a href="../gamer/games">Games</a>
    </div>

    <div id="puz-page">
        <div class="puz-panel">
            <div class="puz-title">Jigsaw Puzzle</div>
            <div class="setup-row">
                <label>Pieces</label>
                <input type="range" id="piece-count-slider" min="9" max="420" value="25" step="1">
                <span id="piece-count-val">25</span>
            </div>
            <button class="ctrl-btn accent" onclick="startPuzzle()">&#9654; New Puzzle</button>
        </div>

        <div class="puz-panel" id="game-panel" style="display:none;">
            <div class="puz-title">Playing — <span id="user-label" style="color:#bbb;font-size:10px;"></span></div>
            <div class="timer-row" id="timer-row">
                <span style="font-family:'Courier New',monospace;font-size:11px;color:#555;">Time:</span>
                <span id="puz-timer">0:00</span>
                <span id="puz-progress"></span>
            </div>
            <div id="puz-done-msg"></div>

            <!-- Board where pieces snap into place -->
            <div id="puz-board-wrap">
                <canvas id="puz-board" style="display:block;"></canvas>
            </div>

            <!-- Tray of unplaced pieces -->
            <div id="puz-source">
                <div id="source-title">PIECES — drag to board</div>
                <div id="puz-tray"></div>
            </div>
        </div>

        <div id="hs-box">
            🏆 Best Score: <strong id="hs-val">—</strong> by <strong id="hs-user">—</strong>
            <span style="color:#555;"> (pieces × 1000 / seconds)</span>
        </div>
    </div>

    <button type="button" onclick="navigateToPage('/gamer/games')">&#8592; Back to Games</button>
    <script src="/js/gamer-chat.js"></script>
    <script src="/js/gamer/puzzle.js" defer></script>
</body>
</html>
