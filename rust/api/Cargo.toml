[package]
name    = "zyxxyz-api"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "api"
path = "src/main.rs"

[dependencies]
zyxxyz-chess = { path = "../shared" }
axum         = "0.7"
tokio        = { version = "1", features = ["full"] }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
jsonwebtoken = "9"
