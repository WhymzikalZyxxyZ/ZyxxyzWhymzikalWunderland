name               = "epitome"
main               = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[[routes]]
pattern   = "epitome.zyxwonderland.xyz/*"
zone_name = "zyxwonderland.xyz"

[assets]
directory          = "../client/dist"
not_found_handling = "single-page-application"
run_worker_first   = true
binding            = "ASSETS"

[[d1_databases]]
binding       = "DB"
database_name = "epitome"
database_id   = "c72a5077-2872-4af3-9ac3-7ab32d252efb"
# drizzle-kit (see drizzle.config.ts) already outputs generated migration SQL
# to ./drizzle — pointing wrangler's own tracked-migrations tooling at the
# same folder instead of its "migrations" default avoids a rename and keeps
# schema generation and migration application on one shared source of truth.
migrations_dir = "drizzle"

[[kv_namespaces]]
binding = "STORAGE"
id      = "c738882a6ba04e7181ad0bc46c7d0b37"

[ai]
binding = "AI"

[vars]
ENVIRONMENT  = "production"
SITE_ORIGIN  = "https://zyxwonderland.xyz"
