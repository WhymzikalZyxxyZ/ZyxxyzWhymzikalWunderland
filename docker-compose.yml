version: '3.9'

services:

  # Live development — mounts the repo and serves it with file watching.
  # Usage: docker compose up dev
  dev:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - '8080:8080'
    command: sh -c "npm install && npx serve -l 8080 ."

  # Run the full test suite inside a clean container.
  # Usage: docker compose run --rm test
  test:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: sh -c "npm ci && npm test"

  # Build and preview the production nginx image locally.
  # Usage: docker compose up preview  (then open http://localhost:8080)
  preview:
    build:
      context: .
      target: server
    ports:
      - '8080:80'

volumes:
  node_modules:
