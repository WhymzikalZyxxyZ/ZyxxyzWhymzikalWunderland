<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog — ZYXXYZ's Whymzykal Wunderland</title>
    <meta name="description" content="Updates, behind-the-scenes, and new additions to ZYXXYZ's Whymzykal Wunderland.">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/script.js" defer></script>
    <script src="/js/utils.js" defer></script>
    <link rel="preconnect" href="https://www.gstatic.com">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="/js/firebase-config.js"></script>
    <style>
        #blog-page { max-width: 720px; margin: 0 auto; padding: 24px 20px 80px; }

        .blog-header { text-align: center; margin-bottom: 40px; }
        .blog-header h2 { font-family: Jokerman, fantasy; color: #f4a261; font-size: clamp(1.6rem, 5vw, 2.4rem); margin-bottom: 6px; }
        .blog-header p { font-family: 'Courier New', monospace; font-size: 11px; color: #555; letter-spacing: 2px; text-transform: uppercase; }

        .blog-eyebrow { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; }
        .blog-eyebrow::before, .blog-eyebrow::after { content: ''; flex: 1; height: 1px; background: rgba(244,162,97,0.15); }
        .blog-eyebrow span { font-family: 'Courier New', monospace; font-size: 9px; letter-spacing: 4px; text-transform: uppercase; color: rgba(244,162,97,0.4); white-space: nowrap; }

        /* Admin write panel */
        #blog-write { background: rgba(0,0,0,0.5); border: 1px solid #2a2a2a; border-radius: 12px; padding: 20px; margin-bottom: 32px; display: none; }
        #blog-write.visible { display: block; }
        .blog-write-label { font-family: 'Courier New', monospace; font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: #555; margin-bottom: 8px; }
        #post-title-input { width: 100%; background: #111; border: 1px solid #2a2a2a; color: #ddd; border-radius: 6px; padding: 8px 12px; font-size: 14px; margin-bottom: 10px; box-sizing: border-box; }
        #post-body-input  { width: 100%; background: #111; border: 1px solid #2a2a2a; color: #ddd; border-radius: 6px; padding: 8px 12px; font-size: 13px; min-height: 120px; resize: vertical; line-height: 1.6; margin-bottom: 10px; box-sizing: border-box; }
        #post-tag-input   { width: 100%; background: #111; border: 1px solid #2a2a2a; color: #ddd; border-radius: 6px; padding: 6px 12px; font-size: 12px; margin-bottom: 14px; box-sizing: border-box; }
        .blog-post-btn { background: #f4a261; border: none; color: #111; border-radius: 6px; padding: 9px 22px; font-family: 'Courier New', monospace; font-size: 12px; font-weight: bold; cursor: pointer; }
        .blog-post-btn:hover { background: #e76f51; }

        /* Posts */
        .blog-post { background: rgba(0,0,0,0.4); border: 1px solid #1e1e1e; border-radius: 12px; padding: 24px 26px; margin-bottom: 20px; transition: border-color 0.2s; }
        .blog-post:hover { border-color: rgba(244,162,97,0.2); }
        .post-meta { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
        .post-date { font-family: 'Courier New', monospace; font-size: 10px; color: #444; letter-spacing: 1px; }
        .post-tag { font-family: 'Courier New', monospace; font-size: 9px; letter-spacing: 2px; text-transform: uppercase; background: rgba(244,162,97,0.1); color: #f4a261; border: 1px solid rgba(244,162,97,0.2); border-radius: 20px; padding: 2px 8px; }
        .post-title { font-family: Jokerman, fantasy; font-size: 1.2rem; color: #e8d0b0; margin-bottom: 10px; line-height: 1.3; }
        .post-body { font-size: 14px; color: #999; line-height: 1.8; white-space: pre-wrap; }
        .post-body a { color: #f4a261; text-decoration: none; border-bottom: 1px dotted rgba(244,162,97,0.4); }
        .post-reactions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
        .react-btn { background: rgba(255,255,255,0.04); border: 1px solid #2a2a2a; color: #777; border-radius: 20px; padding: 3px 10px; font-size: 12px; cursor: pointer; transition: background 0.13s, border-color 0.13s; }
        .react-btn:hover, .react-btn.reacted { background: rgba(244,162,97,0.1); border-color: rgba(244,162,97,0.35); color: #f4a261; }

        .blog-empty { text-align: center; font-family: 'Courier New', monospace; font-size: 12px; color: #333; padding: 60px 0; }
        .blog-loading { text-align: center; padding: 40px; }

        #admin-toggle { font-family: 'Courier New', monospace; font-size: 10px; color: #2a2a2a; background: none; border: none; cursor: pointer; float: right; }
        #admin-toggle:hover { color: #555; }
        .post-delete { background: none; border: none; color: #333; font-size: 11px; cursor: pointer; margin-left: auto; padding: 2px 6px; border-radius: 4px; transition: color 0.15s; }
        .post-delete:hover { color: #c04040; }
        .blog-more-btn { display: block; margin: 20px auto 0; background: none; border: 1px solid #2a2a2a; color: #555; font-family: 'Courier New', monospace; font-size: 12px; padding: 9px 24px; border-radius: 8px; cursor: pointer; transition: border-color 0.15s, color 0.15s; }
        .blog-more-btn:hover { border-color: rgba(244,162,97,0.4); color: var(--accent); }
    </style>
</head>
<body class="wunderBody">
    <div class="navbar"></div>

    <div id="blog-page">
        <div class="blog-header">
            <h2>The Blog</h2>
            <p>Updates &amp; behind the scenes</p>
        </div>

        <button id="admin-toggle" title="Admin login" aria-label="Admin login">✦</button>

        <div id="blog-write">
            <div class="blog-write-label">New Post</div>
            <input id="post-title-input" type="text" placeholder="Post title…" maxlength="120">
            <textarea id="post-body-input" placeholder="What's new? What did you make? What broke?"></textarea>
            <input id="post-tag-input" type="text" placeholder="Tag (e.g. update, gamer, art)…" maxlength="30">
            <button class="blog-post-btn" id="post-submit">Publish →</button>
        </div>

        <div class="blog-eyebrow"><span>latest</span></div>

        <div id="blog-feed">
            <div class="blog-loading"><span class="firebase-loading"></span></div>
        </div>
    </div>

    <script src="/js/blog.js" defer></script>
</body>
</html>
