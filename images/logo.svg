<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <!-- Background gradient: deep purple starfield -->
    <radialGradient id="bgGrad" cx="50%" cy="42%" r="72%">
      <stop offset="0%"   stop-color="#3d0862"/>
      <stop offset="55%"  stop-color="#1e0438"/>
      <stop offset="100%" stop-color="#080014"/>
    </radialGradient>

    <!-- Heart fill: rich magenta to deep rose -->
    <linearGradient id="heartFill" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%"   stop-color="#e8185c"/>
      <stop offset="45%"  stop-color="#c4104e"/>
      <stop offset="100%" stop-color="#8a0836"/>
    </linearGradient>

    <!-- Heart highlight: soft pink radial near top-left bump -->
    <radialGradient id="heartHL" cx="38%" cy="26%" r="32%">
      <stop offset="0%"   stop-color="#ff70a0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff70a0" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow for the heart drop-shadow -->
    <filter id="heartGlow" x="-18%" y="-18%" width="136%" height="136%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Neon glow for text -->
    <filter id="neonGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft glow for sparkles / small elements -->
    <filter id="sparkle" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Heart clip for text containment -->
    <clipPath id="heartClip">
      <path d="M 545,650 C 310,520 100,350 110,200
               C 120,80  240,40  350,40
               C 420,40  490,75  545,170
               C 600,75  670,40  740,40
               C 850,40  970,80  980,200
               C 990,350 780,520 545,650 Z"/>
    </clipPath>
  </defs>

  <!-- ── BACKGROUND ───────────────────────────────────────────────────────── -->
  <rect width="1200" height="800" fill="url(#bgGrad)"/>

  <!-- Stars: scattered twinkling dots -->
  <g fill="#ffffff" filter="url(#sparkle)">
    <circle cx="45"  cy="60"  r="1.4" opacity="0.8"/>
    <circle cx="130" cy="30"  r="1.0" opacity="0.6"/>
    <circle cx="210" cy="110" r="1.8" opacity="0.9"/>
    <circle cx="290" cy="55"  r="1.2" opacity="0.7"/>
    <circle cx="380" cy="20"  r="1.5" opacity="0.8"/>
    <circle cx="70"  cy="200" r="1.0" opacity="0.6"/>
    <circle cx="170" cy="250" r="1.6" opacity="0.8"/>
    <circle cx="30"  cy="380" r="1.2" opacity="0.7"/>
    <circle cx="90"  cy="490" r="1.4" opacity="0.6"/>
    <circle cx="150" cy="620" r="1.0" opacity="0.5"/>
    <circle cx="50"  cy="700" r="1.6" opacity="0.8"/>
    <circle cx="250" cy="760" r="1.2" opacity="0.6"/>
    <circle cx="450" cy="780" r="1.5" opacity="0.7"/>
    <circle cx="700" cy="790" r="1.3" opacity="0.6"/>
    <circle cx="900" cy="770" r="1.6" opacity="0.8"/>
    <circle cx="1050" cy="750" r="1.0" opacity="0.5"/>
    <circle cx="1150" cy="700" r="1.4" opacity="0.7"/>
    <circle cx="1100" cy="560" r="1.8" opacity="0.9"/>
    <circle cx="1170" cy="420" r="1.2" opacity="0.6"/>
    <circle cx="1140" cy="280" r="1.5" opacity="0.8"/>
    <circle cx="1080" cy="140" r="1.0" opacity="0.6"/>
    <circle cx="980"  cy="50"  r="1.6" opacity="0.8"/>
    <circle cx="860"  cy="25"  r="1.2" opacity="0.7"/>
    <circle cx="760"  cy="60"  r="1.4" opacity="0.8"/>
    <circle cx="640"  cy="15"  r="1.8" opacity="0.9"/>
    <circle cx="520"  cy="40"  r="1.0" opacity="0.5"/>
    <circle cx="1020" cy="350" r="1.4" opacity="0.7"/>
    <circle cx="1160" cy="100" r="1.2" opacity="0.6"/>
    <circle cx="20"   cy="130" r="1.6" opacity="0.8"/>
    <circle cx="340"  cy="740" r="1.0" opacity="0.6"/>
  </g>

  <!-- Soft nebula clouds in background -->
  <ellipse cx="200" cy="200" rx="280" ry="180" fill="rgba(160,50,255,0.04)"/>
  <ellipse cx="1000" cy="180" rx="220" ry="160" fill="rgba(255,80,160,0.035)"/>
  <ellipse cx="600"  cy="600" rx="300" ry="180" fill="rgba(60,180,255,0.028)"/>

  <!-- ── DECORATIVE BACK SHAPE ────────────────────────────────────────────── -->
  <rect x="560" y="60" width="440" height="540" rx="28"
        fill="#3a1878" opacity="0.50"
        transform="rotate(-11, 780, 330)"/>

  <!-- ── HEART (shadow then fill) ─────────────────────────────────────────── -->
  <!-- Shadow / outer glow -->
  <path d="M 545,650 C 310,520 100,350 110,200
           C 120,80  240,40  350,40
           C 420,40  490,75  545,170
           C 600,75  670,40  740,40
           C 850,40  970,80  980,200
           C 990,350 780,520 545,650 Z"
        fill="#a0065c" opacity="0.35"
        transform="translate(10,12)"
        filter="url(#heartGlow)"/>

  <!-- Main heart -->
  <path d="M 545,650 C 310,520 100,350 110,200
           C 120,80  240,40  350,40
           C 420,40  490,75  545,170
           C 600,75  670,40  740,40
           C 850,40  970,80  980,200
           C 990,350 780,520 545,650 Z"
        fill="url(#heartFill)"
        filter="url(#heartGlow)"/>

  <!-- Heart highlight -->
  <path d="M 545,650 C 310,520 100,350 110,200
           C 120,80  240,40  350,40
           C 420,40  490,75  545,170
           C 600,75  670,40  740,40
           C 850,40  970,80  980,200
           C 990,350 780,520 545,650 Z"
        fill="url(#heartHL)"/>

  <!-- ── BRAND TEXT ────────────────────────────────────────────────────────── -->
  <g filter="url(#neonGlow)" clip-path="url(#heartClip)">
    <!-- "ZYXXYZ's" -->
    <text x="390" y="250"
          font-family="'Comic Sans MS', cursive, sans-serif"
          font-size="54" font-weight="bold"
          fill="#00ff7f" text-anchor="middle"
          letter-spacing="1">ZYXXYZ's</text>

    <!-- "Whymzykal!" -->
    <text x="385" y="340"
          font-family="'Comic Sans MS', cursive, sans-serif"
          font-size="68" font-style="italic"
          fill="#00ff7f" text-anchor="middle">Whymzykal!</text>

    <!-- "WONDERLAND" -->
    <text x="375" y="445"
          font-family="'Comic Sans MS', cursive, sans-serif"
          font-size="76" font-weight="900"
          fill="#00ff7f" text-anchor="middle"
          letter-spacing="3">WONDERLAND</text>
  </g>

  <!-- ── RABBIT IN TOP HAT (upper-right of heart) ─────────────────────────── -->
  <g transform="translate(686, 52)">
    <!-- Hat: magical glow beneath brim -->
    <ellipse cx="105" cy="222" rx="85" ry="14" fill="#a030d0" opacity="0.35"/>

    <!-- Hat brim shadow -->
    <ellipse cx="108" cy="218" rx="80" ry="13" fill="rgba(0,0,0,0.35)"/>
    <!-- Hat brim -->
    <ellipse cx="105" cy="214" rx="78" ry="12" fill="#111111"/>
    <!-- Brim pink inner rim -->
    <ellipse cx="105" cy="214" rx="66" ry="9"  fill="#c8427a" opacity="0.85"/>

    <!-- Hat body -->
    <rect x="52" y="102" width="106" height="114" rx="6" fill="#0f0f0f"/>

    <!-- Gold band gradient simulation (two rects) -->
    <rect x="52" y="188" width="106" height="16" rx="2" fill="#c49a14"/>
    <rect x="52" y="188" width="53"  height="16" rx="2" fill="#ffd700" opacity="0.6"/>

    <!-- Hat top -->
    <ellipse cx="105" cy="102" rx="53" ry="10" fill="#0f0f0f"/>
    <ellipse cx="105" cy="102" rx="53" ry="10" fill="none" stroke="#222" stroke-width="1"/>

    <!-- Hat side edge highlights -->
    <line x1="52"  y1="214" x2="52"  y2="102" stroke="#1c1c1c" stroke-width="1"/>
    <line x1="158" y1="214" x2="158" y2="102" stroke="#1c1c1c" stroke-width="1"/>

    <!-- ── Rabbit body (peeking from hat) -->
    <!-- Body (below head, in hat) -->
    <ellipse cx="105" cy="162" rx="42" ry="48" fill="#e6e6e6"/>

    <!-- Left ear (behind head) -->
    <g transform="translate(72, 38) rotate(-12, 0, 0)">
      <ellipse cx="0" cy="-30" rx="14" ry="38" fill="#e0e0e0"/>
      <ellipse cx="0" cy="-30" rx="8"  ry="25" fill="#ffb0c4"/>
    </g>

    <!-- Right ear (behind head) -->
    <g transform="translate(138, 38) rotate(12, 0, 0)">
      <ellipse cx="0" cy="-30" rx="14" ry="38" fill="#e0e0e0"/>
      <ellipse cx="0" cy="-30" rx="8"  ry="25" fill="#ffb0c4"/>
    </g>

    <!-- Head -->
    <ellipse cx="105" cy="80" rx="40" ry="36" fill="#f2f2f2"/>

    <!-- Rosy cheeks -->
    <circle cx="76"  cy="88" r="11" fill="#ff69b4" opacity="0.26"/>
    <circle cx="134" cy="88" r="11" fill="#ff69b4" opacity="0.26"/>

    <!-- Eyes: outer, iris, pupil, shine -->
    <circle cx="88"  cy="70" r="9"   fill="#1a1a1a"/>
    <circle cx="122" cy="70" r="9"   fill="#1a1a1a"/>
    <circle cx="88"  cy="70" r="5.5" fill="#c084fc"/>
    <circle cx="122" cy="70" r="5.5" fill="#c084fc"/>
    <circle cx="88"  cy="70" r="2.6" fill="#0d0d0d"/>
    <circle cx="122" cy="70" r="2.6" fill="#0d0d0d"/>
    <circle cx="91"  cy="67" r="2.2" fill="#ffffff"/>
    <circle cx="125" cy="67" r="2.2" fill="#ffffff"/>

    <!-- Nose -->
    <circle cx="105" cy="82" r="4.5" fill="#ff8fa3"/>

    <!-- Smile -->
    <path d="M 93 92 Q 105 102 117 92"
          stroke="#999999" stroke-width="2.2" fill="none" stroke-linecap="round"/>

    <!-- Waving paw (right) -->
    <g transform="translate(150, 130) rotate(-35)">
      <ellipse cx="0" cy="0" rx="15" ry="11" fill="#e0e0e0"/>
    </g>

    <!-- Orbiting gold sparkles -->
    <circle cx="172" cy="68"  r="4" fill="#ffd700" opacity="0.85" filter="url(#sparkle)"/>
    <circle cx="32"  cy="55"  r="3" fill="#ffd700" opacity="0.70" filter="url(#sparkle)"/>
    <circle cx="178" cy="155" r="3" fill="#ffd700" opacity="0.75" filter="url(#sparkle)"/>
    <circle cx="18"  cy="140" r="2.5" fill="#ff69b4" opacity="0.80" filter="url(#sparkle)"/>
  </g>

  <!-- ── DECORATIVE ACCENTS ─────────────────────────────────────────────────── -->
  <!-- Floating suits / symbols around the heart -->
  <g font-family="serif" fill-opacity="0.50">
    <text x="95"  y="215" font-size="28" fill="#ff69b4">♥</text>
    <text x="80"  y="500" font-size="22" fill="#c084fc">♠</text>
    <text x="185" cy="710" font-size="24" fill="#ff69b4">♪</text>
    <text x="1060" y="185" font-size="26" fill="#ffd700">★</text>
    <text x="1080" y="560" font-size="22" fill="#5eead4">♦</text>
    <text x="950"  y="730" font-size="26" fill="#ffd700">✨</text>
    <text x="220"  y="758" font-size="22" fill="#ff69b4">♫</text>
  </g>

  <!-- Small hearts scattered -->
  <g fill="#ff69b4" opacity="0.45" filter="url(#sparkle)">
    <circle cx="68"  cy="330" r="4"/>
    <circle cx="990" cy="310" r="3.5"/>
    <circle cx="110" cy="600" r="3"/>
    <circle cx="1060" cy="640" r="4"/>
  </g>

  <!-- Gold star accents near heart edge -->
  <g fill="#ffd700" opacity="0.80" filter="url(#sparkle)">
    <circle cx="108" cy="165" r="3.5"/>
    <circle cx="975" cy="160" r="3.5"/>
    <circle cx="140" cy="600" r="3"/>
    <circle cx="942" cy="595" r="3"/>
    <circle cx="545" cy="668" r="4"/>
  </g>
</svg>
