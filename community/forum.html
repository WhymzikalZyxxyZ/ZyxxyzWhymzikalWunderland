<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publyk Forum — ZYXXYZ's Whymzykal Wunderland</title>
    <meta name="description" content="Drop in, say hello, leave a suggestion, or just lurk. All welcome.">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/script.js" defer></script>
    <link rel="preconnect" href="https://www.gstatic.com">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="/js/config/firebase-config.js"></script>
    <style>
        .chat-window {
            max-width: 680px;
            margin: 24px auto;
            background: rgba(0,0,0,0.69);
            border: 1px solid #444;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            height: 520px;
            overflow: hidden;
        }
        .chat-header {
            padding: 12px 18px;
            border-bottom: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0,0,0,0.3);
            flex-shrink: 0;
        }
        .chat-user-badge {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #888;
        }
        .chat-user-badge span {
            color: var(--accent);
            font-weight: bold;
        }
        .chat-status-dot {
            font-size: 11px;
            font-family: 'Courier New', monospace;
            color: #888;
        }
        .chat-status-dot.live { color: #4caf50; }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .chat-messages::-webkit-scrollbar { width: 5px; }
        .chat-messages::-webkit-scrollbar-track { background: transparent; }
        .chat-messages::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
        .msg {
            display: flex;
            flex-direction: column;
            max-width: 78%;
        }
        .msg.mine   { align-self: flex-end;   align-items: flex-end; }
        .msg.theirs { align-self: flex-start; align-items: flex-start; }
        .msg-meta {
            font-family: 'Courier New', monospace;
            font-size: 10px;
            margin-bottom: 3px;
            padding: 0 4px;
        }
        .msg.mine .msg-meta   { color: var(--accent); text-align: right; }
        .msg.theirs .msg-meta { color: #888; }
        .msg-meta .sender { font-weight: bold; }
        .msg-meta .time   { opacity: 0.6; }
        .msg-bubble {
            padding: 9px 14px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.55;
            word-break: break-word;
        }
        .msg.mine .msg-bubble {
            background: rgba(244,162,97,0.18);
            border: 1px solid rgba(244,162,97,0.35);
            color: #f4d0aa;
            border-radius: 14px 14px 2px 14px;
        }
        .msg.theirs .msg-bubble {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            color: #ddd;
            border-radius: 14px 14px 14px 2px;
        }
        .msg-system {
            align-self: center;
            font-family: 'Courier New', monospace;
            font-size: 10px;
            color: #555;
            padding: 2px 0;
        }
        .chat-input-bar {
            padding: 12px 16px;
            border-top: 1px solid #333;
            display: flex;
            gap: 10px;
            flex-shrink: 0;
            background: rgba(0,0,0,0.2);
        }
        .chat-input-bar input {
            flex: 1;
            background: rgba(255,255,255,0.06);
            border: 1px solid #555;
            border-radius: 8px;
            padding: 9px 14px;
            color: #fff;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }
        .chat-input-bar input:focus { border-color: var(--accent); }
        .chat-input-bar input:disabled { opacity: 0.5; cursor: not-allowed; }
        .chat-input-bar input::placeholder { color: #555; }
        #chat-send {
            background: var(--accent);
            border: none;
            border-radius: 8px;
            padding: 9px 20px;
            color: #111;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
            margin: 0;
            transition: background 0.2s;
        }
        #chat-send:hover:not(:disabled) { background: var(--accent-dark); color: #fff; }
        #chat-send:disabled { background: #555; color: #888; cursor: default; }
        .char-count {
            font-family: 'Courier New', monospace;
            font-size: 10px;
            color: #555;
            text-align: right;
            max-width: 680px;
            margin: 0 auto 4px;
            padding: 0 4px;
        }
        .char-count.warn { color: var(--accent); }
        #load-older-btn {
            display: block;
            margin: 0 auto 8px;
            background: transparent;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 4px 14px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            color: #888;
            cursor: pointer;
            transition: border-color 0.2s, color 0.2s;
        }
        #load-older-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
        #load-older-btn:disabled { opacity: 0.5; cursor: default; }
        .msg-delete {
            background: transparent;
            border: none;
            color: #666;
            font-size: 10px;
            cursor: pointer;
            padding: 0 0 0 6px;
            line-height: 1;
            transition: color 0.15s;
        }
        .msg-delete:hover { color: #f44; }
    </style>
</head>
<body class="wunderBody">

    <div class="navbar"></div>

    <div class="chat-window">
        <div class="chat-header">
            <div class="chat-user-badge">Chatting as: <span id="chat-username">...</span></div>
            <div class="chat-status-dot" id="chat-status-dot">● connecting</div>
        </div>
        <div class="chat-messages" id="chat-messages">
            <button id="load-older-btn">Load older messages</button>
        </div>
        <div class="chat-input-bar">
            <input type="text" id="chat-input" placeholder="getting your name..." maxlength="500" autocomplete="off" disabled>
            <button id="chat-send" disabled>SEND</button>
        </div>
    </div>
    <div class="char-count" id="char-count">0 / 500</div>

    <script src="/js/community/forum.js" defer></script>

</body>
</html>
