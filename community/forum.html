<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Publyk Forum — ZYXXYZ's Whymzykal Wunderland</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/script.js"></script>

    <!-- Firebase compat SDK (no build step needed) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        .chat-window {
            max-width: 680px;
            margin: 24px auto;
            background: rgba(0,0,0,0.62);
            border: 1px solid #444;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            height: 500px;
            overflow: hidden;
        }
        .chat-header {
            padding: 12px 18px;
            border-bottom: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0,0,0,0.3);
            flex-shrink: 0;
        }
        .chat-user-badge {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #888;
        }
        .chat-user-badge span {
            color: #f4a261;
            font-weight: bold;
        }
        .chat-status-dot {
            font-size: 11px;
            font-family: 'Courier New', monospace;
            color: #888;
        }
        .chat-status-dot.live {
            color: #4caf50;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .chat-messages::-webkit-scrollbar { width: 5px; }
        .chat-messages::-webkit-scrollbar-track { background: transparent; }
        .chat-messages::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
        .msg {
            display: flex;
            flex-direction: column;
            max-width: 78%;
        }
        .msg.mine {
            align-self: flex-end;
            align-items: flex-end;
        }
        .msg.theirs {
            align-self: flex-start;
            align-items: flex-start;
        }
        .msg-meta {
            font-family: 'Courier New', monospace;
            font-size: 10px;
            color: #666;
            margin-bottom: 3px;
            padding: 0 4px;
        }
        .msg-bubble {
            padding: 9px 14px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.55;
            word-break: break-word;
        }
        .msg.mine .msg-bubble {
            background: rgba(244,162,97,0.18);
            border: 1px solid rgba(244,162,97,0.35);
            color: #f4d0aa;
            border-radius: 14px 14px 2px 14px;
        }
        .msg.theirs .msg-bubble {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            color: #ddd;
            border-radius: 14px 14px 14px 2px;
        }
        .msg-system {
            align-self: center;
            font-family: 'Courier New', monospace;
            font-size: 10px;
            color: #555;
            padding: 2px 0;
        }
        .chat-input-bar {
            padding: 12px 16px;
            border-top: 1px solid #333;
            display: flex;
            gap: 10px;
            flex-shrink: 0;
            background: rgba(0,0,0,0.2);
        }
        .chat-input-bar input {
            flex: 1;
            background: rgba(255,255,255,0.06);
            border: 1px solid #555;
            border-radius: 8px;
            padding: 9px 14px;
            color: #fff;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }
        .chat-input-bar input:focus {
            border-color: #f4a261;
        }
        .chat-input-bar input::placeholder {
            color: #555;
        }
        #chat-send {
            background: #f4a261;
            border: none;
            border-radius: 8px;
            padding: 9px 20px;
            color: #111;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
            margin: 0;
            display: block;
            transition: background 0.2s;
        }
        #chat-send:hover {
            background: #e76f51;
            color: #fff;
        }
        #chat-send:disabled {
            background: #555;
            color: #888;
            cursor: default;
        }
        .char-count {
            font-family: 'Courier New', monospace;
            font-size: 10px;
            color: #555;
            text-align: right;
            max-width: 680px;
            margin: 0 auto 4px;
            padding: 0 4px;
        }
        .char-count.warn {
            color: #f4a261;
        }
        .setup-notice {
            max-width: 680px;
            margin: 24px auto;
            background: rgba(244,162,97,0.1);
            border: 1px solid rgba(244,162,97,0.3);
            border-radius: 10px;
            padding: 20px 24px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #aaa;
            line-height: 1.8;
        }
        .setup-notice strong {
            color: #f4a261;
        }
    </style>
</head>
<body class="notYetBody">

    <h2>Publyk Forum</h2>

    <div class="navbar">
        <a href="../index.html">Home</a>
        <a href="../about.html">About</a>
        <a href="../virtuoso/virtuoso.html">Virtuoso</a>
        <a href="../gamer/games.html">Gamer</a>
        <a href="../technologist/apps.html">Technologist</a>
        <a href="../community/forum.html">Community</a>
    </div>

    <div id="setup-notice" class="setup-notice" style="display:none;">
        <strong>&#9888; Chat not yet connected.</strong><br>
        To enable live messaging, add your Firebase config to forum.html.<br>
        See the <code>FIREBASE SETUP</code> comment in the script block below.
    </div>

    <div class="chat-window" id="chat-window">
        <div class="chat-header">
            <div class="chat-user-badge">Chatting as: <span id="chat-username">...</span></div>
            <div class="chat-status-dot" id="chat-status-dot">● connecting</div>
        </div>
        <div class="chat-messages" id="chat-messages"></div>
        <div class="chat-input-bar">
            <input type="text" id="chat-input" placeholder="Say something..." maxlength="500" autocomplete="off">
            <button id="chat-send" onclick="sendMessage()">SEND</button>
        </div>
    </div>
    <div class="char-count" id="char-count">0 / 500</div>

    <button type="button" onclick="navigateToPage('../index.html')">E.T. Phone Home!</button>

    <script>
        // ─── USERNAME ───────────────────────────────────────────────────────────────
        const ADJECTIVES = ['Whymzykal','Mystic','Velvet','Crimson','Silver','Golden',
            'Shadow','Crystal','Cosmic','Neon','Lunar','Wild','Electric','Curious','Arcane'];
        const NOUNS = ['Wanderer','Fox','Owl','Phoenix','Raven','Wolf','Sprite',
            'Specter','Sage','Muse','Echo','Ghost','Cipher','Rebel','Enigma'];

        function genUsername() {
            const adj = ADJECTIVES[Math.floor(Math.random() * ADJECTIVES.length)];
            const noun = NOUNS[Math.floor(Math.random() * NOUNS.length)];
            const num = Math.floor(Math.random() * 900 + 100);
            return `${adj}${noun}_${num}`;
        }

        let myUsername = sessionStorage.getItem('forumUsername');
        if (!myUsername) {
            myUsername = genUsername();
            sessionStorage.setItem('forumUsername', myUsername);
        }
        document.getElementById('chat-username').textContent = myUsername;

        // ─── FIREBASE SETUP ─────────────────────────────────────────────────────────
        // 1. Go to https://console.firebase.google.com and create a project.
        // 2. Add a Web App to get your config object.
        // 3. Under Build > Realtime Database, create a database (start in test mode).
        // 4. Replace the placeholder values below with your actual config.
        // 5. Set database rules to:
        //      { "rules": { "forum": { ".read": true, ".write": true } } }

        const FIREBASE_CONFIG = {
            apiKey: "AIzaSyBolSqtz8_CTVVLjRGFZaIQ_7u4sIWAuZY",
            authDomain: "wunderland-cd935.firebaseapp.com
            databaseURL: "https://wunderland-cd935-default-rtdb.firebaseio.com",
            projectId: "wunderland-cd935
            storageBucket: "wunderland-cd935.firebasestorage.app
            messagingSenderId: "96451930583
            appId: "1:96451930583:web:37350a5d4bf76cd6bd8392
            measurementId: "G-KNX537QQ8G"
        };

        // ─── INIT ────────────────────────────────────────────────────────────────────
        const isConfigured = FIREBASE_CONFIG.apiKey !== "YOUR_API_KEY";

        if (!isConfigured) {
            document.getElementById('setup-notice').style.display = 'block';
            document.getElementById('chat-window').style.display = 'none';
            document.getElementById('char-count').style.display = 'none';
        } else {
            firebase.initializeApp(FIREBASE_CONFIG);
            const db = firebase.database();
            const messagesRef = db.ref('forum/messages');
            const chatMessages = document.getElementById('chat-messages');
            const statusDot = document.getElementById('chat-status-dot');

            // ─── HELPERS ─────────────────────────────────────────────────────────────
            function escHtml(str) {
                return str
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;');
            }

            function fmtTime(ts) {
                return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            }

            function addSystemMsg(text) {
                const el = document.createElement('div');
                el.className = 'msg-system';
                el.textContent = text;
                chatMessages.appendChild(el);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            function addMessageEl(username, text, ts, isMine) {
                const div = document.createElement('div');
                div.className = 'msg ' + (isMine ? 'mine' : 'theirs');
                const meta = isMine
                    ? fmtTime(ts)
                    : `${escHtml(username)} · ${fmtTime(ts)}`;
                div.innerHTML =
                    `<div class="msg-meta">${meta}</div>` +
                    `<div class="msg-bubble">${escHtml(text)}</div>`;
                chatMessages.appendChild(div);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            // ─── LOAD + LISTEN ────────────────────────────────────────────────────────
            addSystemMsg('— connecting —');

            messagesRef.limitToLast(100).on('child_added', snapshot => {
                // Clear "connecting" placeholder on first message arrival
                const placeholder = chatMessages.querySelector('.msg-system');
                if (placeholder && placeholder.textContent === '— connecting —') {
                    placeholder.remove();
                    addSystemMsg('— last 100 messages —');
                }
                const msg = snapshot.val();
                addMessageEl(msg.username, msg.text, msg.ts, msg.username === myUsername);
            });

            // Connection state indicator
            firebase.database().ref('.info/connected').on('value', snap => {
                if (snap.val()) {
                    statusDot.textContent = '● live';
                    statusDot.classList.add('live');
                } else {
                    statusDot.textContent = '● reconnecting';
                    statusDot.classList.remove('live');
                }
            });

            // ─── SEND ─────────────────────────────────────────────────────────────────
            let lastSent = 0;

            window.sendMessage = function () {
                const input = document.getElementById('chat-input');
                const text = input.value.trim();
                if (!text || text.length > 500) return;
                if (Date.now() - lastSent < 1500) return; // simple rate limit
                lastSent = Date.now();
                messagesRef.push({ username: myUsername, text, ts: Date.now() });
                input.value = '';
                document.getElementById('char-count').textContent = '0 / 500';
                document.getElementById('char-count').classList.remove('warn');
            };

            // Enter to send
            document.getElementById('chat-input').addEventListener('keydown', e => {
                if (e.key === 'Enter') { e.preventDefault(); sendMessage(); }
            });

            // Character counter
            document.getElementById('chat-input').addEventListener('input', function () {
                const len = this.value.length;
                const counter = document.getElementById('char-count');
                counter.textContent = `${len} / 500`;
                counter.classList.toggle('warn', len > 420);
            });
        }
    </script>
</body>
</html>
