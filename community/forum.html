<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publyk Forum — ZYXXYZ's Whymzykal Wunderland</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/script.js" defer></script>
    <link rel="preconnect" href="https://www.gstatic.com">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="/js/firebase-config.js"></script>
    <style>
        .chat-window {
            max-width: 680px;
            margin: 24px auto;
            background: rgba(0,0,0,0.69);
            border: 1px solid #444;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            height: 520px;
            overflow: hidden;
        }
        .chat-header {
            padding: 12px 18px;
            border-bottom: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0,0,0,0.3);
            flex-shrink: 0;
        }
        .chat-user-badge {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #888;
        }
        .chat-user-badge span {
            color: #f4a261;
            font-weight: bold;
        }
        .chat-status-dot {
            font-size: 11px;
            font-family: 'Courier New', monospace;
            color: #888;
        }
        .chat-status-dot.live { color: #4caf50; }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .chat-messages::-webkit-scrollbar { width: 5px; }
        .chat-messages::-webkit-scrollbar-track { background: transparent; }
        .chat-messages::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
        .msg {
            display: flex;
            flex-direction: column;
            max-width: 78%;
        }
        .msg.mine   { align-self: flex-end;   align-items: flex-end; }
        .msg.theirs { align-self: flex-start; align-items: flex-start; }
        .msg-meta {
            font-family: 'Courier New', monospace;
            font-size: 10px;
            margin-bottom: 3px;
            padding: 0 4px;
        }
        .msg.mine .msg-meta   { color: #f4a261; text-align: right; }
        .msg.theirs .msg-meta { color: #888; }
        .msg-meta .sender { font-weight: bold; }
        .msg-meta .time   { opacity: 0.6; }
        .msg-bubble {
            padding: 9px 14px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.55;
            word-break: break-word;
        }
        .msg.mine .msg-bubble {
            background: rgba(244,162,97,0.18);
            border: 1px solid rgba(244,162,97,0.35);
            color: #f4d0aa;
            border-radius: 14px 14px 2px 14px;
        }
        .msg.theirs .msg-bubble {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            color: #ddd;
            border-radius: 14px 14px 14px 2px;
        }
        .msg-system {
            align-self: center;
            font-family: 'Courier New', monospace;
            font-size: 10px;
            color: #555;
            padding: 2px 0;
        }
        .chat-input-bar {
            padding: 12px 16px;
            border-top: 1px solid #333;
            display: flex;
            gap: 10px;
            flex-shrink: 0;
            background: rgba(0,0,0,0.2);
        }
        .chat-input-bar input {
            flex: 1;
            background: rgba(255,255,255,0.06);
            border: 1px solid #555;
            border-radius: 8px;
            padding: 9px 14px;
            color: #fff;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }
        .chat-input-bar input:focus { border-color: #f4a261; }
        .chat-input-bar input:disabled { opacity: 0.5; cursor: not-allowed; }
        .chat-input-bar input::placeholder { color: #555; }
        #chat-send {
            background: #f4a261;
            border: none;
            border-radius: 8px;
            padding: 9px 20px;
            color: #111;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
            margin: 0;
            transition: background 0.2s;
        }
        #chat-send:hover:not(:disabled) { background: #e76f51; color: #fff; }
        #chat-send:disabled { background: #555; color: #888; cursor: default; }
        .char-count {
            font-family: 'Courier New', monospace;
            font-size: 10px;
            color: #555;
            text-align: right;
            max-width: 680px;
            margin: 0 auto 4px;
            padding: 0 4px;
        }
        .char-count.warn { color: #f4a261; }
    </style>
</head>
<body class="wunderBody">

    <h2>Publyk Forum</h2>

    <div class="navbar">
        <a href="/">Home</a>
        <a href="/about">About</a>
        <a href="/virtuoso/virtuoso">Virtuoso</a>
        <a href="/gamer/games">Gamer</a>
        <a href="/technologist/apps">Technologist</a>
        <a href="/community/forum">Forum</a>
        <a href="/community/wellness">Wellness</a>
    </div>

    <div class="banner"></div>

    <div class="chat-window">
        <div class="chat-header">
            <div class="chat-user-badge">Chatting as: <span id="chat-username">...</span></div>
            <div class="chat-status-dot" id="chat-status-dot">● connecting</div>
        </div>
        <div class="chat-messages" id="chat-messages"></div>
        <div class="chat-input-bar">
            <input type="text" id="chat-input" placeholder="getting your name..." maxlength="500" autocomplete="off" disabled>
            <button id="chat-send" onclick="sendMessage()" disabled>SEND</button>
        </div>
    </div>
    <div class="char-count" id="char-count">0 / 500</div>

    <script>
        // ── Username pool ─────────────────────────────────────────────────────────────
        const ADJS  = ['Cosmic','Neon','Velvet','Funky','Mystic','Jazzy','Quirky','Sneaky',
                        'Zesty','Fuzzy','Glitchy','Lunar','Tangy','Wobbly','Spiffy'];
        const NOUNS = ['Penguin','Wizard','Pickle','Comet','Noodle','Goblin','Muffin','Platypus',
                        'Biscuit','Cactus','Gnome','Waffle','Ferret','Pebble','Sprocket'];

        function genUsername() {
            const adj  = ADJS[Math.floor(Math.random() * ADJS.length)];
            const noun = NOUNS[Math.floor(Math.random() * NOUNS.length)];
            return `${adj}${noun}_${Math.floor(Math.random() * 900 + 100)}`;
        }

        function claimUsername(username) {
            const ref = firebase.database().ref(`forum/presence/${username}`);
            ref.onDisconnect().remove();
            return new Promise(resolve => {
                ref.transaction(
                    current => current === null ? { ts: Date.now() } : undefined,
                    (err, committed) => {
                        if (!committed) ref.onDisconnect().cancel();
                        resolve(!err && committed);
                    }
                );
            });
        }

        async function initUsername() {
            const stored = sessionStorage.getItem('forumUsername');
            if (stored && await claimUsername(stored)) return stored;
            let name;
            do { name = genUsername(); } while (!await claimUsername(name));
            sessionStorage.setItem('forumUsername', name);
            return name;
        }

        // ── Helpers ───────────────────────────────────────────────────────────────────
        const chatMessages = document.getElementById('chat-messages');
        const statusDot    = document.getElementById('chat-status-dot');
        const chatInput    = document.getElementById('chat-input');
        const chatSend     = document.getElementById('chat-send');

        function escHtml(str) {
            return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }
        function fmtTime(ts) {
            const d = new Date(ts);
            const date = d.toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' });
            const time = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            return date + ' · ' + time;
        }
        function addSystemMsg(text) {
            const el = document.createElement('div');
            el.className = 'msg-system';
            el.textContent = text;
            chatMessages.appendChild(el);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
        function addMessageEl(username, text, ts, isMine) {
            const div = document.createElement('div');
            div.className = 'msg ' + (isMine ? 'mine' : 'theirs');

            const meta = document.createElement('div');
            meta.className = 'msg-meta';

            const sender = document.createElement('span');
            sender.className = 'sender';
            sender.textContent = isMine ? 'You' : username;

            const time = document.createElement('span');
            time.className = 'time';
            time.textContent = ' · ' + fmtTime(ts);

            meta.appendChild(sender);
            meta.appendChild(time);

            const bubble = document.createElement('div');
            bubble.className = 'msg-bubble';
            bubble.textContent = text;

            div.appendChild(meta);
            div.appendChild(bubble);

            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // ── Firebase ──────────────────────────────────────────────────────────────────
        if (typeof FIREBASE_READY !== 'undefined' && FIREBASE_READY) {
            const messagesRef = firebase.database().ref('forum/messages');
            let myUsername    = null;
            let lastSent      = 0;

            window.sendMessage = function () {
                if (!myUsername) return;
                const text = chatInput.value.trim();
                if (!text || text.length > 500) return;
                if (Date.now() - lastSent < 1500) return;
                lastSent = Date.now();
                messagesRef.push({ username: myUsername, text, ts: Date.now() });
                chatInput.value = '';
                document.getElementById('char-count').textContent = '0 / 500';
                document.getElementById('char-count').classList.remove('warn');
            };

            firebase.database().ref('.info/connected').on('value', snap => {
                statusDot.textContent = snap.val() ? '● live' : '● reconnecting';
                statusDot.classList.toggle('live', !!snap.val());
            });

            initUsername().then(username => {
                myUsername = username;
                document.getElementById('chat-username').textContent = username;
                chatInput.disabled    = false;
                chatSend.disabled     = false;
                chatInput.placeholder = 'Say something...';
                chatInput.focus();

                let initialLoad = true;
                messagesRef.orderByChild('ts').limitToLast(100).on('child_added', snapshot => {
                    if (initialLoad) {
                        addSystemMsg('— last 100 messages —');
                        initialLoad = false;
                    }
                    const msg = snapshot.val();
                    if (msg && msg.text) {
                        addMessageEl(msg.username, msg.text, msg.ts, msg.username === myUsername);
                    }
                });
            });

        } else {
            statusDot.textContent = '● not configured';
            const myUsername = sessionStorage.getItem('forumUsername') || genUsername();
            sessionStorage.setItem('forumUsername', myUsername);
            document.getElementById('chat-username').textContent = myUsername;
            addSystemMsg('— chat requires Firebase — see /js/firebase-config.js —');
            window.sendMessage = function () {};
        }

        chatInput.addEventListener('keydown', e => {
            if (e.key === 'Enter') { e.preventDefault(); sendMessage(); }
        });
        chatInput.addEventListener('input', function () {
            const len     = this.value.length;
            const counter = document.getElementById('char-count');
            counter.textContent = `${len} / 500`;
            counter.classList.toggle('warn', len > 420);
        });
    </script>

</body>
</html>
