<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Dashboard — ZYXXYZ's Whymzykal Wunderland</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/script.js" defer></script>
    <style>
        :root {
            --js:  #f7df1e;
            --go:  #00acd7;
            --kt:  #a07fff;
            --cs:  #c07fe0;
            --py:  #4b8bbe;
            --jv:  #e76f00;
        }

        .lc-page { max-width: 1160px; margin: 0 auto; padding: 0 24px 96px; }

        /* ── Hero ── */
        .lc-hero { text-align: center; padding: 52px 24px 44px; }
        .lc-hero h1 {
            font-family: Jokerman, fantasy;
            font-size: clamp(2em, 5vw, 3.2em);
            color: #f4a261;
            text-shadow: 0 0 40px rgba(244,162,97,0.4), 0 0 80px rgba(244,162,97,0.15);
            margin-bottom: 12px;
            letter-spacing: 1px;
        }
        .lc-hero p { color: #7a94b8; font-size: 1em; max-width: 520px; margin: 0 auto; }

        /* ══════════════════════════════════════════════════════
           LANGUAGE SELECTOR — sultry spotlight design
        ══════════════════════════════════════════════════════ */
        .selector-stage {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
            margin-bottom: 64px;
        }

        .selector-label {
            font-family: 'Courier New', monospace;
            font-size: 0.7em;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #3a3a4a;
            margin-bottom: 28px;
        }

        .selector-list {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 720px;
            gap: 2px;
        }

        .sel-item {
            position: relative;
            display: flex;
            align-items: center;
            padding: 18px 32px;
            cursor: pointer;
            overflow: hidden;
            border-radius: 4px;
            transition: padding-left .35s cubic-bezier(.4,0,.2,1);
            user-select: none;
        }

        /* Sweep background */
        .sel-item::before {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(90deg, var(--c) 0%, transparent 70%);
            opacity: 0;
            transition: opacity .4s ease;
        }
        .sel-item::after {
            content: '';
            position: absolute; left: 0; top: 0; bottom: 0;
            width: 3px;
            background: var(--c);
            transform: scaleY(0);
            transform-origin: center;
            transition: transform .3s cubic-bezier(.4,0,.2,1);
            box-shadow: 0 0 12px var(--c);
        }

        .sel-item:hover::before  { opacity: 0.06; }
        .sel-item:hover::after   { transform: scaleY(1); }
        .sel-item:hover { padding-left: 40px; }

        .sel-item.active::before  { opacity: 0.12; }
        .sel-item.active::after   { transform: scaleY(1); box-shadow: 0 0 20px var(--c), 0 0 40px var(--c); }
        .sel-item.active { padding-left: 44px; }

        .sel-item.dimmed { opacity: 0.22; }
        .sel-item.dimmed:hover { opacity: 0.55; }

        /* lang key */
        .sel-key {
            font-family: 'Courier New', monospace;
            font-size: 0.72em;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--c);
            width: 100px;
            flex-shrink: 0;
            transition: color .2s, letter-spacing .3s;
        }
        .sel-item.active .sel-key { letter-spacing: 4px; }

        /* lang name */
        .sel-name {
            font-size: 1.6em;
            font-weight: 300;
            color: #ddd;
            letter-spacing: -0.5px;
            flex: 1;
            transition: color .25s, transform .3s cubic-bezier(.4,0,.2,1);
        }
        .sel-item:hover .sel-name  { color: #fff; transform: translateX(4px); }
        .sel-item.active .sel-name { color: #fff; transform: translateX(8px); font-weight: 400; }

        /* role tag */
        .sel-role {
            font-family: 'Courier New', monospace;
            font-size: 0.72em;
            color: #444;
            text-align: right;
            flex-shrink: 0;
            transition: color .25s;
            max-width: 200px;
        }
        .sel-item:hover .sel-role  { color: #666; }
        .sel-item.active .sel-role { color: var(--c); opacity: 0.7; }

        /* glow pulse on active */
        @keyframes langPulse {
            0%, 100% { text-shadow: 0 0 8px var(--c); }
            50%       { text-shadow: 0 0 24px var(--c), 0 0 40px var(--c); }
        }
        .sel-item.active .sel-name {
            text-shadow: 0 0 12px rgba(255,255,255,0.15);
            animation: langPulse 3s ease-in-out infinite;
            animation-timing-function: ease-in-out;
        }

        /* divider lines */
        .sel-divider {
            width: 100%;
            max-width: 720px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05) 30%, rgba(255,255,255,0.05) 70%, transparent);
        }

        /* clear btn */
        .sel-clear {
            margin-top: 20px;
            font-family: 'Courier New', monospace;
            font-size: 0.72em;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #333;
            background: none;
            border: none;
            cursor: pointer;
            transition: color .2s;
            padding: 6px 12px;
        }
        .sel-clear:hover { color: #888; }
        .sel-clear.visible { color: #555; }

        /* ── Section headings ── */
        .section-heading {
            font-family: Papyrus, fantasy;
            font-size: 0.9em; font-weight: 700;
            color: #c8b0d8;
            letter-spacing: 2.5px; text-transform: uppercase;
            padding: 0 0 10px;
            border-bottom: 1px solid rgba(200,176,216,0.18);
            margin: 0 0 32px;
        }

        /* ── Radar + metric bars ── */
        .viz-row { display: flex; gap: 40px; flex-wrap: wrap; margin-bottom: 60px; align-items: flex-start; }
        .radar-wrap { flex: 0 0 320px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
        .radar-legend { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
        .radar-legend-item { display: flex; align-items: center; gap: 7px; font-size: 0.76em; color: #666; font-family: 'Courier New', monospace; transition: color .2s; }
        .radar-legend-item.active { color: #aaa; }
        .radar-legend-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }

        /* ── Metric bars ── */
        .metrics-wrap { flex: 1 1 340px; }
        .metric-row { margin-bottom: 22px; }
        .metric-label { font-size: 0.82em; color: #999; font-family: 'Courier New', monospace; margin-bottom: 8px; letter-spacing: 0.5px; }
        .metric-bars { display: flex; flex-direction: column; gap: 6px; }
        .metric-bar-row { display: flex; align-items: center; gap: 12px; transition: opacity .3s; }
        .metric-lang-label { width: 30px; font-size: 0.68em; color: #555; font-family: 'Courier New', monospace; text-align: right; flex-shrink: 0; }
        .metric-bar-bg { flex: 1; height: 6px; background: rgba(255,255,255,0.05); border-radius: 3px; overflow: hidden; }
        .metric-bar-fill { height: 100%; border-radius: 3px; transition: width 0.9s cubic-bezier(.4,0,.2,1), opacity .3s; width: 0; }
        .metric-bar-fill.js { background: linear-gradient(90deg, #f7df1e66, var(--js)); }
        .metric-bar-fill.go { background: linear-gradient(90deg, #00acd766, var(--go)); }
        .metric-bar-fill.kt { background: linear-gradient(90deg, #7f52ff66, var(--kt)); }
        .metric-bar-fill.cs { background: linear-gradient(90deg, #9b4dca66, var(--cs)); }
        .metric-bar-fill.py { background: linear-gradient(90deg, #4b8bbe66, var(--py)); }
        .metric-bar-fill.jv { background: linear-gradient(90deg, #e76f0066, var(--jv)); }
        .metric-score { width: 32px; font-size: 0.68em; color: #444; font-family: 'Courier New', monospace; text-align: right; flex-shrink: 0; }

        /* ── Comparison table ── */
        .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
        .filter-btn {
            padding: 5px 16px; border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            background: transparent; color: #666;
            font-family: 'Courier New', monospace; font-size: 0.76em;
            cursor: pointer; transition: all .2s; letter-spacing: 0.5px;
        }
        .filter-btn:hover { border-color: rgba(255,255,255,0.25); color: #aaa; }
        .filter-btn.active { background: rgba(244,162,97,0.12); border-color: rgba(244,162,97,0.5); color: #f4a261; }

        .table-wrap { overflow-x: auto; margin-bottom: 60px; }
        .compare-table { width: 100%; border-collapse: collapse; font-size: 0.85em; }
        .compare-table th {
            font-family: 'Courier New', monospace; font-size: 0.75em;
            letter-spacing: 1.5px; text-transform: uppercase; color: #555;
            padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,0.07); text-align: left;
        }
        .compare-table th.lh { text-align: center; }
        .compare-table td {
            padding: 11px 14px; border-bottom: 1px solid rgba(255,255,255,0.04);
            color: #bbb; vertical-align: middle; transition: opacity .3s;
        }
        .compare-table tr:hover td { background: rgba(255,255,255,0.02); }
        .compare-table td.row-label { color: #666; font-family: 'Courier New', monospace; font-size: 0.8em; white-space: nowrap; }
        .compare-table td.lh { text-align: center; }
        .pill { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 0.75em; font-family: 'Courier New', monospace; white-space: nowrap; }
        .pill-green  { background: rgba(76,175,80,0.14);  color: #4caf50; }
        .pill-yellow { background: rgba(247,223,30,0.1);  color: #c9b510; }
        .pill-orange { background: rgba(244,162,97,0.14); color: #f4a261; }
        .pill-red    { background: rgba(244,67,54,0.14);  color: #ef5350; }
        .pill-blue   { background: rgba(0,172,215,0.12);  color: #00acd7; }
        .pill-purple { background: rgba(127,82,255,0.14); color: #a07fff; }

        /* ── Use-case grid ── */
        .usecase-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
        .usecase-card {
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px; padding: 20px 18px;
            transition: border-color .3s, opacity .3s;
        }
        .usecase-card.dimmed { opacity: 0.2; }
        .usecase-card h4 { font-size: 0.88em; color: #ddd; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
        .usecase-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
        .usecase-card ul { margin: 0; padding: 0 0 0 14px; }
        .usecase-card li { font-size: 0.78em; color: #666; font-family: 'Courier New', monospace; margin-bottom: 5px; line-height: 1.4; }
    </style>
</head>
<body class="wunderBody">
<div class="navbar"></div>

<div class="lc-page">

    <div class="lc-hero">
        <h1>Language Dashboard</h1>
        <p>Six languages. One project. Click to isolate and compare.</p>
    </div>

    <!-- ══ SULTRY SELECTOR ══ -->
    <div class="selector-stage">
        <div class="selector-label">— select languages —</div>
        <div class="selector-list" id="selectorList"></div>
        <div class="sel-divider" style="margin-top:2px"></div>
        <button class="sel-clear" id="selClear">clear selection</button>
    </div>

    <!-- ── Radar + bars ── -->
    <h2 class="section-heading">Performance Profile</h2>
    <div class="viz-row">
        <div class="radar-wrap">
            <canvas id="radarChart" width="300" height="300"></canvas>
            <div class="radar-legend" id="radarLegend"></div>
        </div>
        <div class="metrics-wrap" id="metricBars"></div>
    </div>

    <!-- ── Table ── -->
    <h2 class="section-heading">Feature Comparison</h2>
    <div class="filter-bar" id="filterBar"></div>
    <div class="table-wrap">
        <table class="compare-table" id="compareTable">
            <thead>
                <tr>
                    <th>Feature</th>
                    <th class="lh">JS</th>
                    <th class="lh">Go</th>
                    <th class="lh">Kotlin</th>
                    <th class="lh">C#</th>
                    <th class="lh">Python</th>
                    <th class="lh">Java</th>
                </tr>
            </thead>
            <tbody id="compareBody"></tbody>
        </table>
    </div>

    <!-- ── Use cases ── -->
    <h2 class="section-heading">Used In This Project</h2>
    <div class="usecase-grid" id="usecaseGrid"></div>

</div>

<script src="/js/technologist/lang-compare.js"></script>
</body>
</html>
