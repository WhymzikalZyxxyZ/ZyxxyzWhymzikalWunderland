<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>State Machine — Technologist</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/script.js" defer></script>
    <style>
        #app { max-width: 1100px; margin: 0 auto; padding: 0 16px 80px; }
        .subtitle { text-align:center; font-family:'Courier New',monospace; font-size:11px; letter-spacing:4px; text-transform:uppercase; color:#555; margin:0 0 28px; }
        .sec { font-family:'Courier New',monospace; font-size:10px; letter-spacing:3px; text-transform:uppercase; color:#f4a261; border-bottom:1px solid rgba(244,162,97,0.18); padding-bottom:6px; margin:24px 0 14px; }

        .toolbar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; align-items:center; }
        .btn { padding:8px 16px; border-radius:7px; border:1px solid rgba(244,162,97,0.35); background:rgba(244,162,97,0.1); color:#f4a261; font-family:'Courier New',monospace; font-size:12px; cursor:pointer; transition:background 0.15s; }
        .btn:hover { background:rgba(244,162,97,0.22); }
        .btn.active { background:rgba(244,162,97,0.25); border-color:rgba(244,162,97,0.6); }
        .btn-danger { border-color:rgba(239,83,80,0.35); background:rgba(239,83,80,0.1); color:#ef5350; }
        .btn-danger:hover { background:rgba(239,83,80,0.22); }
        .btn-green { border-color:rgba(76,175,80,0.35); background:rgba(76,175,80,0.1); color:#4caf50; }
        .btn-green:hover { background:rgba(76,175,80,0.22); }

        .main-layout { display:grid; grid-template-columns:1fr 280px; gap:16px; }
        @media (max-width:800px) { .main-layout { grid-template-columns:1fr; } }

        .canvas-wrap { background:rgba(0,0,0,0.5); border:1px solid #2a1a0a; border-radius:10px; overflow:hidden; position:relative; }
        #fsm-canvas { display:block; cursor:crosshair; }
        .canvas-hint { position:absolute; bottom:10px; left:50%; transform:translateX(-50%); font-family:'Courier New',monospace; font-size:10px; color:#333; pointer-events:none; white-space:nowrap; }

        .sidebar { display:flex; flex-direction:column; gap:14px; }
        .panel-box { background:rgba(0,0,0,0.5); border:1px solid #2a1a0a; border-radius:9px; padding:14px; }
        .panel-title { font-family:'Courier New',monospace; font-size:10px; letter-spacing:2px; text-transform:uppercase; color:#f4a261; margin-bottom:10px; }

        .field-row { display:flex; flex-direction:column; gap:4px; margin-bottom:10px; }
        .field-label { font-family:'Courier New',monospace; font-size:10px; color:#555; letter-spacing:1px; text-transform:uppercase; }
        input[type=text], select {
            background:rgba(255,255,255,0.05); border:1px solid #333; border-radius:6px;
            padding:7px 10px; color:#f4d0aa; font-family:'Courier New',monospace; font-size:12px; outline:none; width:100%; box-sizing:border-box;
        }
        input[type=text]:focus, select:focus { border-color:#f4a261; }
        input[type=checkbox] { accent-color:#f4a261; }

        .event-list { display:flex; flex-direction:column; gap:6px; max-height:180px; overflow-y:auto; }
        .event-item { display:flex; gap:6px; }
        .event-item input { flex:1; }
        .event-fire { padding:6px 12px; border-radius:6px; border:1px solid rgba(76,175,80,0.4); background:rgba(76,175,80,0.1); color:#4caf50; font-family:'Courier New',monospace; font-size:12px; cursor:pointer; }
        .event-fire:hover { background:rgba(76,175,80,0.2); }

        .log { background:rgba(0,0,0,0.4); border-radius:6px; padding:8px; max-height:140px; overflow-y:auto; font-family:'Courier New',monospace; font-size:10px; line-height:1.7; }
        .log::-webkit-scrollbar { width:3px; }
        .log::-webkit-scrollbar-thumb { background:#333; }
        .log-ok    { color:#4caf50; }
        .log-err   { color:#ef5350; }
        .log-info  { color:#666; }

        .presets-row { display:flex; flex-wrap:wrap; gap:6px; }
        .preset-btn { padding:5px 10px; border-radius:5px; border:1px solid #2a1a0a; background:rgba(255,255,255,0.03); color:#666; font-family:'Courier New',monospace; font-size:10px; cursor:pointer; }
        .preset-btn:hover { border-color:#f4a261; color:#f4a261; }

        .mode-indicator { font-family:'Courier New',monospace; font-size:11px; padding:4px 10px; border-radius:5px; border:1px solid #333; color:#888; }
    </style>
</head>
<body class="wunderBody">
    <h2>State Machine</h2>
    <div class="navbar"></div>
    <div class="banner"></div>
    <div id="app">
        <p class="subtitle">FSM · States · Transitions · Guards · Simulation</p>

        <div class="toolbar">
            <button class="btn active" id="mode-add-state" onclick="setMode('addState')">+ State</button>
            <button class="btn" id="mode-add-trans" onclick="setMode('addTrans')">→ Transition</button>
            <button class="btn" id="mode-select"    onclick="setMode('select')">↖ Select</button>
            <button class="btn btn-green" id="mode-run" onclick="setMode('run')">▶ Run</button>
            <div style="flex:1"></div>
            <div class="mode-indicator" id="mode-lbl">Mode: Add State</div>
            <div style="flex:1"></div>
            <button class="btn btn-danger" onclick="clearMachine()">Clear</button>
        </div>

        <div class="presets-row" style="margin-bottom:12px;" id="presets-row"></div>

        <div class="main-layout">
            <div class="canvas-wrap">
                <canvas id="fsm-canvas" width="700" height="480"></canvas>
                <div class="canvas-hint" id="canvas-hint">Click canvas to add a state</div>
            </div>

            <div class="sidebar">
                <!-- Add state form -->
                <div class="panel-box" id="panel-state">
                    <div class="panel-title">State Properties</div>
                    <div class="field-row">
                        <div class="field-label">Name</div>
                        <input type="text" id="state-name" placeholder="e.g. Idle" value="Idle">
                    </div>
                    <div class="field-row" style="flex-direction:row;align-items:center;gap:8px;">
                        <input type="checkbox" id="is-initial"> <label style="font-family:'Courier New',monospace;font-size:11px;color:#888;">Initial state</label>
                        <input type="checkbox" id="is-final"> <label style="font-family:'Courier New',monospace;font-size:11px;color:#888;">Final state</label>
                    </div>
                    <button class="btn" style="width:100%;" onclick="addState()">Add State</button>
                </div>

                <!-- Transition form -->
                <div class="panel-box" id="panel-trans" style="display:none;">
                    <div class="panel-title">Transition Properties</div>
                    <div class="field-row">
                        <div class="field-label">Event</div>
                        <input type="text" id="trans-event" placeholder="e.g. START">
                    </div>
                    <div class="field-row">
                        <div class="field-label">Guard (optional)</div>
                        <input type="text" id="trans-guard" placeholder="e.g. isAuthorised">
                    </div>
                    <div style="font-family:'Courier New',monospace;font-size:11px;color:#555;margin-bottom:8px;">Click source state, then target state on canvas.</div>
                </div>

                <!-- Run panel -->
                <div class="panel-box" id="panel-run" style="display:none;">
                    <div class="panel-title">Fire Events</div>
                    <div class="field-row">
                        <div class="field-label">Current State</div>
                        <div style="font-family:'Courier New',monospace;font-size:13px;color:#f4a261;font-weight:bold;" id="cur-state">—</div>
                    </div>
                    <div class="event-list" id="event-list"></div>
                    <button class="btn" style="width:100%;margin-top:8px;" onclick="resetRun()">Reset to Initial</button>
                </div>

                <!-- Log -->
                <div class="panel-box">
                    <div class="panel-title">Event Log</div>
                    <div class="log" id="fsm-log"></div>
                    <button class="btn" style="width:100%;margin-top:8px;font-size:11px;" onclick="document.getElementById('fsm-log').innerHTML=''">Clear Log</button>
                </div>

                <!-- Selected info -->
                <div class="panel-box" id="panel-selected" style="display:none;">
                    <div class="panel-title">Selected</div>
                    <div id="selected-info" style="font-family:'Courier New',monospace;font-size:12px;color:#888;"></div>
                    <button class="btn btn-danger" style="width:100%;margin-top:8px;font-size:11px;" onclick="deleteSelected()">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/technologist/state-machine.js" defer></script>
</body>
</html>
