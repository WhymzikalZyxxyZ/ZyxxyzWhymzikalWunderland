<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distributed Systems — Technologist</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/script.js" defer></script>
    <style>
        #app { max-width: 1100px; margin: 0 auto; padding: 0 16px 80px; }
        .subtitle { text-align:center; font-family:'Courier New',monospace; font-size:11px; letter-spacing:4px; text-transform:uppercase; color:#555; margin:0 0 28px; }
        .sec { font-family:'Courier New',monospace; font-size:10px; letter-spacing:3px; text-transform:uppercase; color:#f4a261; border-bottom:1px solid rgba(244,162,97,0.18); padding-bottom:6px; margin:20px 0 12px; }

        .toolbar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; align-items:center; }
        .btn { padding:7px 14px; border-radius:7px; border:1px solid rgba(244,162,97,0.35); background:rgba(244,162,97,0.1); color:#f4a261; font-family:'Courier New',monospace; font-size:12px; cursor:pointer; transition:background 0.15s; }
        .btn:hover { background:rgba(244,162,97,0.22); }
        .btn.active { background:rgba(244,162,97,0.25); border-color:rgba(244,162,97,0.6); }
        .btn-danger { border-color:rgba(239,83,80,0.35); background:rgba(239,83,80,0.1); color:#ef5350; }
        .btn-danger:hover { background:rgba(239,83,80,0.22); }
        .btn-blue { border-color:rgba(100,160,255,0.35); background:rgba(100,160,255,0.1); color:#64a0ff; }
        .btn-blue:hover { background:rgba(100,160,255,0.22); }
        .btn-green { border-color:rgba(76,175,80,0.35); background:rgba(76,175,80,0.1); color:#4caf50; }
        .btn-green:hover { background:rgba(76,175,80,0.22); }
        .speed-grp { display:flex; gap:4px; align-items:center; margin-left:auto; }
        .speed-grp span { font-family:'Courier New',monospace; font-size:10px; color:#555; margin-right:2px; }
        .speed-btn { padding:4px 9px; border-radius:5px; border:1px solid #222; background:rgba(255,255,255,0.04); color:#555; font-family:'Courier New',monospace; font-size:11px; cursor:pointer; }
        .speed-btn.active { border-color:#f4a261; color:#f4a261; background:rgba(244,162,97,0.12); }

        .main-layout { display:grid; grid-template-columns:1fr 270px; gap:14px; }
        @media (max-width:820px) { .main-layout { grid-template-columns:1fr; } }

        .canvas-wrap { background:rgba(0,0,0,0.55); border:1px solid #2a1a0a; border-radius:10px; overflow:hidden; position:relative; }
        #ds-canvas { display:block; cursor:pointer; width:100%; }
        .canvas-hint { position:absolute; bottom:10px; left:50%; transform:translateX(-50%); font-family:'Courier New',monospace; font-size:10px; color:#333; pointer-events:none; white-space:nowrap; }

        .sidebar { display:flex; flex-direction:column; gap:12px; }
        .panel-box { background:rgba(0,0,0,0.5); border:1px solid #2a1a0a; border-radius:9px; padding:14px; }
        .panel-title { font-family:'Courier New',monospace; font-size:10px; letter-spacing:2px; text-transform:uppercase; color:#f4a261; margin-bottom:10px; }

        .node-table { width:100%; border-collapse:collapse; font-family:'Courier New',monospace; font-size:11px; }
        .node-table th { color:#444; text-align:left; padding:2px 5px 6px; letter-spacing:1px; font-size:10px; text-transform:uppercase; }
        .node-table td { padding:4px 5px; color:#888; border-top:1px solid #111; }
        .node-table td:first-child { color:#f4d0aa; }
        .state-dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; vertical-align:middle; }

        .clock-bar-wrap { display:flex; flex-direction:column; gap:5px; }
        .clock-row { display:flex; align-items:center; gap:6px; font-family:'Courier New',monospace; font-size:10px; }
        .clock-label { color:#666; width:24px; }
        .clock-bar-bg { flex:1; background:#111; border-radius:3px; height:8px; overflow:hidden; }
        .clock-bar-fill { height:100%; background:rgba(244,162,97,0.6); border-radius:3px; transition:width 0.3s; }
        .clock-val { color:#f4a261; width:28px; text-align:right; }

        .log { background:rgba(0,0,0,0.4); border-radius:6px; padding:8px; max-height:160px; overflow-y:auto; font-family:'Courier New',monospace; font-size:10px; line-height:1.7; }
        .log::-webkit-scrollbar { width:3px; }
        .log::-webkit-scrollbar-thumb { background:#333; }
        .log-election { color:#f4a261; }
        .log-leader   { color:#ffd700; }
        .log-partition{ color:#ef5350; }
        .log-msg      { color:#888; }
        .log-clock    { color:#64a0ff; }

        .legend { display:flex; flex-wrap:wrap; gap:8px; font-family:'Courier New',monospace; font-size:10px; }
        .legend-item { display:flex; align-items:center; gap:5px; color:#555; }
        .legend-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }

        .presets-row { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
        .preset-btn { padding:5px 11px; border-radius:5px; border:1px solid #2a1a0a; background:rgba(255,255,255,0.03); color:#666; font-family:'Courier New',monospace; font-size:10px; cursor:pointer; }
        .preset-btn:hover { border-color:#f4a261; color:#f4a261; }
    </style>
</head>
<body class="wunderBody">
    <h2>Distributed Systems</h2>
    <div class="navbar"></div>
    <div class="banner"></div>
    <div id="app">
        <p class="subtitle">Consensus · Replication · Partitions · Clocks</p>

        <!-- Presets -->
        <div class="presets-row" id="presets-row"></div>

        <!-- Toolbar -->
        <div class="toolbar">
            <button class="btn" onclick="addNodeRandom()">+ Node</button>
            <button class="btn btn-danger" onclick="removeNode()">− Node</button>
            <button class="btn btn-blue" onclick="triggerElection()">⚡ Trigger Election</button>
            <button class="btn btn-danger" id="part-btn" onclick="togglePartition()">✂ Partition</button>
            <button class="btn btn-green" onclick="healPartition()">⟳ Heal</button>
            <button class="btn btn-danger" onclick="resetSim()">Reset</button>
            <div class="speed-grp">
                <span>Speed</span>
                <button class="speed-btn" data-speed="0.5" onclick="setSpeed(0.5)">½×</button>
                <button class="speed-btn active" data-speed="1" onclick="setSpeed(1)">1×</button>
                <button class="speed-btn" data-speed="2" onclick="setSpeed(2)">2×</button>
                <button class="speed-btn" data-speed="4" onclick="setSpeed(4)">4×</button>
            </div>
        </div>

        <div class="main-layout">
            <!-- Canvas -->
            <div class="canvas-wrap">
                <canvas id="ds-canvas" width="700" height="460"></canvas>
                <div class="canvas-hint">Click a node to kill / revive it · Drag partition line</div>
            </div>

            <!-- Sidebar -->
            <div class="sidebar">

                <!-- Legend -->
                <div class="panel-box">
                    <div class="panel-title">Legend</div>
                    <div class="legend">
                        <div class="legend-item"><div class="legend-dot" style="background:#ffd700;box-shadow:0 0 6px #ffd700"></div>Leader</div>
                        <div class="legend-item"><div class="legend-dot" style="background:#64a0ff"></div>Follower</div>
                        <div class="legend-item"><div class="legend-dot" style="background:#ffe066"></div>Candidate</div>
                        <div class="legend-item"><div class="legend-dot" style="background:#555"></div>Dead</div>
                    </div>
                    <div class="legend" style="margin-top:8px;">
                        <div class="legend-item"><div class="legend-dot" style="background:#f4a261"></div>Heartbeat</div>
                        <div class="legend-item"><div class="legend-dot" style="background:#ffe066"></div>VoteReq</div>
                        <div class="legend-item"><div class="legend-dot" style="background:#4caf50"></div>VoteGrant</div>
                    </div>
                </div>

                <!-- Node status -->
                <div class="panel-box">
                    <div class="panel-title">Node Status</div>
                    <table class="node-table">
                        <thead><tr><th>Node</th><th>State</th><th>Term</th><th>Clock</th></tr></thead>
                        <tbody id="node-table-body"></tbody>
                    </table>
                </div>

                <!-- Lamport clocks -->
                <div class="panel-box">
                    <div class="panel-title">Lamport Clocks</div>
                    <div class="clock-bar-wrap" id="clock-bars"></div>
                </div>

                <!-- Event log -->
                <div class="panel-box">
                    <div class="panel-title">Event Log</div>
                    <div class="log" id="ds-log"></div>
                    <button class="btn" style="width:100%;margin-top:8px;font-size:11px;" onclick="document.getElementById('ds-log').innerHTML=''">Clear Log</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/technologist/distributed.js" defer></script>
</body>
</html>
