<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Query Plan — Technologist</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/script.js" defer></script>
    <style>
        #app { max-width: 1080px; margin: 0 auto; padding: 0 16px 80px; }
        .subtitle { text-align:center; font-family:'Courier New',monospace; font-size:11px; letter-spacing:4px; text-transform:uppercase; color:#555; margin:0 0 28px; }
        .sec { font-family:'Courier New',monospace; font-size:10px; letter-spacing:3px; text-transform:uppercase; color:#c9a0e8; border-bottom:1px solid rgba(180,100,220,0.18); padding-bottom:6px; margin:28px 0 16px; }

        .editor-wrap { background:rgba(0,0,0,0.6); border:1px solid #2a1a3a; border-radius:10px; overflow:hidden; margin-bottom:12px; }
        .editor-header { display:flex; align-items:center; justify-content:space-between; padding:8px 14px; background:rgba(180,100,220,0.08); border-bottom:1px solid #2a1a3a; }
        .editor-lang { font-family:'Courier New',monospace; font-size:10px; letter-spacing:2px; text-transform:uppercase; color:#888; }
        textarea#sql-input {
            width:100%; box-sizing:border-box; background:transparent; border:none; outline:none;
            color:#e0d0f0; font-family:'Courier New',monospace; font-size:13px; line-height:1.7;
            padding:16px; resize:vertical; min-height:140px;
        }

        .btn-row { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:24px; }
        .btn { padding:9px 20px; border-radius:7px; border:1px solid rgba(180,100,220,0.35); background:rgba(180,100,220,0.1); color:#c9a0e8; font-family:'Courier New',monospace; font-size:13px; cursor:pointer; transition:background 0.15s; }
        .btn:hover { background:rgba(180,100,220,0.22); }
        .btn-secondary { border-color:#333; background:rgba(255,255,255,0.04); color:#666; }
        .btn-secondary:hover { border-color:#c9a0e8; color:#c9a0e8; background:rgba(180,100,220,0.07); }

        .layout { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
        @media (max-width:700px) { .layout { grid-template-columns:1fr; } }

        .plan-wrap { background:rgba(0,0,0,0.5); border:1px solid #2a1a3a; border-radius:10px; padding:20px; overflow-x:auto; }
        .plan-wrap canvas { display:block; }

        .analysis-wrap { display:flex; flex-direction:column; gap:12px; }
        .analysis-card { background:rgba(0,0,0,0.5); border:1px solid #2a1a3a; border-radius:9px; padding:14px 16px; }
        .analysis-title { font-family:'Courier New',monospace; font-size:11px; letter-spacing:2px; text-transform:uppercase; color:#c9a0e8; margin-bottom:8px; }
        .analysis-body  { font-family:'Courier New',monospace; font-size:12px; color:#888; line-height:1.65; }
        .analysis-body strong { color:#e0d0f0; }
        .cost-bar-wrap { margin-top:4px; }
        .cost-bar-label { display:flex; justify-content:space-between; margin-bottom:3px; font-family:'Courier New',monospace; font-size:11px; color:#777; }
        .cost-bar-bg { height:8px; background:rgba(255,255,255,0.06); border-radius:4px; }
        .cost-bar-fill { height:8px; border-radius:4px; background:linear-gradient(to right,#c9a0e8,#8060c0); transition:width 0.4s; }

        .warning-badge { display:inline-block; background:rgba(244,162,97,0.15); border:1px solid rgba(244,162,97,0.3); border-radius:4px; color:#f4a261; font-family:'Courier New',monospace; font-size:10px; padding:2px 7px; margin:2px; }
        .ok-badge { display:inline-block; background:rgba(76,175,80,0.12); border:1px solid rgba(76,175,80,0.25); border-radius:4px; color:#4caf50; font-family:'Courier New',monospace; font-size:10px; padding:2px 7px; margin:2px; }

        .examples-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px; }
        .ex-btn { padding:6px 12px; border-radius:6px; border:1px solid #2a1a3a; background:rgba(255,255,255,0.03); color:#666; font-family:'Courier New',monospace; font-size:11px; cursor:pointer; transition:all 0.15s; }
        .ex-btn:hover { border-color:rgba(180,100,220,0.4); color:#c9a0e8; }

        .empty-state { text-align:center; font-family:'Courier New',monospace; font-size:13px; color:#333; padding:60px 20px; }
    </style>
</head>
<body class="wunderBody">
    <h2>Query Plan</h2>
    <div class="navbar"></div>
    <div class="banner"></div>
    <div id="app">
        <p class="subtitle">SQL · Execution Plan · Cost Estimation · Index Analysis</p>

        <div class="sec">SQL Query</div>
        <div class="editor-wrap">
            <div class="editor-header">
                <span class="editor-lang">SQL</span>
                <span style="font-family:'Courier New',monospace;font-size:10px;color:#444;">Enter a SELECT statement to visualise its execution plan</span>
            </div>
            <textarea id="sql-input" spellcheck="false">SELECT u.name, u.email, COUNT(o.id) AS order_count, SUM(o.total) AS revenue
FROM users u
JOIN orders o ON u.id = o.user_id
JOIN order_items oi ON o.id = oi.order_id
WHERE u.created_at > '2024-01-01'
  AND o.status = 'completed'
GROUP BY u.id, u.name, u.email
HAVING COUNT(o.id) > 5
ORDER BY revenue DESC
LIMIT 20</textarea>
        </div>

        <div class="examples-row" id="examples-row"></div>

        <div class="btn-row">
            <button class="btn" onclick="analyseQuery()">▶ Analyse Query</button>
            <button class="btn btn-secondary" onclick="clearAll()">Clear</button>
        </div>

        <div id="results" style="display:none;">
            <div class="layout">
                <div>
                    <div class="sec" style="margin-top:0;">Execution Plan</div>
                    <div class="plan-wrap" id="plan-wrap">
                        <canvas id="plan-canvas"></canvas>
                    </div>
                </div>
                <div>
                    <div class="sec" style="margin-top:0;">Analysis</div>
                    <div class="analysis-wrap" id="analysis-wrap"></div>
                </div>
            </div>
        </div>
        <div class="empty-state" id="empty-state">Enter a SELECT query above and click Analyse Query.</div>
    </div>

    <script src="/js/technologist/query-plan.js" defer></script>
</body>
</html>
