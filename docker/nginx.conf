server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Clean URLs: /gamer/games → /gamer/games.html
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;

    # Long-lived cache for fingerprinted static assets
    location ~* \.(js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # No caching for HTML or manifest
    location ~* \.(html|json|xml)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}
