name: Deploy to GitHub Pages + Cloudflare + Fly.io

# Fires when main is updated (typically by promote.yml after CI passes).
# By the time code lands on main, the full CI matrix has already blessed it,
# so no redundant lint/test jobs are run here — deploy straight away.

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  # ── Deploy editor-service to Fly.io ──────────────────────────────────────────
  deploy-editor-service:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy editor-service to Fly.io
        run: flyctl deploy --remote-only
        working-directory: editor-service
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # ── Deploy Cloudflare Worker (Anonymail) ─────────────────────────────────────
  deploy-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Deploy Anonymail Worker to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken:         ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId:        ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: anonymail/worker

  # ── Deploy Cloudflare Worker (The Locator) ────────────────────────────────────
  deploy-locator-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Build The Locator client
        run: |
          cd the-locator/client
          npm ci
          npm run build

      - name: Deploy The Locator Worker to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken:         ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId:        ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: the-locator/worker
          secrets:          |
            MAPBOX_TOKEN
            CENSUS_API_KEY
        env:
          MAPBOX_TOKEN:      ${{ secrets.LOCATOR_MAPBOX_TOKEN }}
          CENSUS_API_KEY:    ${{ secrets.CENSUS_API_KEY }}

  # ── Deploy static site to GitHub Pages ───────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate Firebase config
        env:
          FIREBASE_API_KEY:             ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN:         ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_DATABASE_URL:        ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_PROJECT_ID:          ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET:      ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID:              ${{ secrets.FIREBASE_APP_ID }}
        run: |
          node -e "
          const cfg = {
              apiKey:            process.env.FIREBASE_API_KEY,
              authDomain:        process.env.FIREBASE_AUTH_DOMAIN,
              databaseURL:       process.env.FIREBASE_DATABASE_URL,
              projectId:         process.env.FIREBASE_PROJECT_ID,
              storageBucket:     process.env.FIREBASE_STORAGE_BUCKET,
              messagingSenderId: process.env.FIREBASE_MESSAGING_SENDER_ID,
              appId:             process.env.FIREBASE_APP_ID,
          };
          const out = 'const FIREBASE_CONFIG = ' + JSON.stringify(cfg, null, 4) + ';\n' +
              'const FIREBASE_READY = FIREBASE_CONFIG.apiKey !== \"YOUR_API_KEY\";\n' +
              'if (FIREBASE_READY && !firebase.apps.length) { firebase.initializeApp(FIREBASE_CONFIG); }\n';
          require('fs').writeFileSync('js/config/firebase-config.js', out);
          "

      - name: Minify assets
        run: |
          docker run --rm \
            -v "$PWD:/app" -w /app \
            node:22-alpine \
            sh -c "npm ci && node scripts/minify.js"

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ── Smoke tests ───────────────────────────────────────────────────────────────
  # Runs after all deploy jobs complete. Gives workers ~20s to propagate before
  # hitting the live endpoints.
  smoke-test:
    name: Smoke test deployed services
    runs-on: ubuntu-latest
    needs: [deploy, deploy-worker, deploy-locator-worker, deploy-editor-service]
    steps:
      - name: Wait for propagation
        run: sleep 20

      - name: Smoke test — static site (200 OK)
        run: |
          STATUS=$(curl -fsS -o /dev/null -w "%{http_code}" https://zyxwonderland.xyz/)
          echo "Static site: $STATUS"
          [ "$STATUS" = "200" ] || (echo "Expected 200, got $STATUS" && exit 1)

      - name: Smoke test — Locator Worker health endpoint
        run: |
          BODY=$(curl -fsS https://locator.zyxwonderland.xyz/api/health)
          echo "Locator health: $BODY"
          echo "$BODY" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          assert d.get('status') == 'ok', f'unexpected health response: {d}'
          print('OK')
          "
