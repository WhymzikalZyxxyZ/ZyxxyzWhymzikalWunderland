name: Deploy Website to Porkbun

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Generate Firebase config
        env:
          FIREBASE_API_KEY:            ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN:        ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_DATABASE_URL:       ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_PROJECT_ID:         ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET:     ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID:             ${{ secrets.FIREBASE_APP_ID }}
        run: |
          cat > js/firebase-config.js <<EOF
          const FIREBASE_CONFIG = {
              apiKey:            "${FIREBASE_API_KEY}",
              authDomain:        "${FIREBASE_AUTH_DOMAIN}",
              databaseURL:       "${FIREBASE_DATABASE_URL}",
              projectId:         "${FIREBASE_PROJECT_ID}",
              storageBucket:     "${FIREBASE_STORAGE_BUCKET}",
              messagingSenderId: "${FIREBASE_MESSAGING_SENDER_ID}",
              appId:             "${FIREBASE_APP_ID}"
          };
          const FIREBASE_READY = FIREBASE_CONFIG.apiKey !== "YOUR_API_KEY";
          if (FIREBASE_READY && !firebase.apps.length) {
              firebase.initializeApp(FIREBASE_CONFIG);
          }
          EOF

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@4.3.4
        with:
          server:     ${{ secrets.FTP_SERVER }}
          username:   ${{ secrets.FTP_USERNAME }}
          password:   ${{ secrets.FTP_PASSWORD }}
          local-dir:  ./
          server-dir: /public_html/

      - name: Deployment confirmation
        run: echo "Deployment to Porkbun successful!"
