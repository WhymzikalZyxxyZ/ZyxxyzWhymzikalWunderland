name: Deploy Website to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  # ── Lint + test ──────────────────────────────────────────────────────────────
  # Runs entirely inside a pinned Node.js container — no setup-node action needed.
  lint-and-test:
    runs-on: ubuntu-latest
    container: node:20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Lint JavaScript
        run: npm run lint:js

      - name: Lint CSS
        run: npm run lint:css

      - name: Lint HTML
        run: npm run lint:html

      - name: Run tests with coverage
        run: npm test

  # ── Deploy Cloudflare Worker (Anonymail) ─────────────────────────────────────
  deploy-worker:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Anonymail Worker to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken:         ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId:        ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: anonymail/worker

  # ── Deploy ───────────────────────────────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: lint-and-test
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Generate Firebase config using the runner's built-in Node.js.
      - name: Generate Firebase config
        env:
          FIREBASE_API_KEY:             ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN:         ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_DATABASE_URL:        ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_PROJECT_ID:          ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET:      ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID:              ${{ secrets.FIREBASE_APP_ID }}
        run: |
          node -e "
          const cfg = {
              apiKey:            process.env.FIREBASE_API_KEY,
              authDomain:        process.env.FIREBASE_AUTH_DOMAIN,
              databaseURL:       process.env.FIREBASE_DATABASE_URL,
              projectId:         process.env.FIREBASE_PROJECT_ID,
              storageBucket:     process.env.FIREBASE_STORAGE_BUCKET,
              messagingSenderId: process.env.FIREBASE_MESSAGING_SENDER_ID,
              appId:             process.env.FIREBASE_APP_ID,
          };
          const out = 'const FIREBASE_CONFIG = ' + JSON.stringify(cfg, null, 4) + ';\n' +
              'const FIREBASE_READY = FIREBASE_CONFIG.apiKey !== \"YOUR_API_KEY\";\n' +
              'if (FIREBASE_READY && !firebase.apps.length) { firebase.initializeApp(FIREBASE_CONFIG); }\n';
          require('fs').writeFileSync('js/config/firebase-config.js', out);
          "

      # Minify inside a pinned node:20-alpine container for a reproducible build.
      # The volume mount shares the checked-out repo with the container.
      - name: Minify assets
        run: |
          docker run --rm \
            -v "$PWD:/app" -w /app \
            node:20-alpine \
            sh -c "npm ci && node scripts/minify.js"

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
