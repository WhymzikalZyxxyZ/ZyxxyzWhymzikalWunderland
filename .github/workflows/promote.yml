name: Promote development → test → main

# Triggers whenever a push lands on development (including merges from version branches).
# Automatically fast-merges development into test, then test into main.
#
# IMPORTANT — deploy trigger:
#   Pushes made with GITHUB_TOKEN do NOT trigger other workflows (GitHub security rule).
#   To ensure deploy.yml fires when main is updated, create a fine-grained Personal
#   Access Token with "Contents: Read and Write" on this repo and save it as:
#     Settings → Secrets and variables → Actions → GH_PAT
#   If GH_PAT is absent the merges still happen; deploy.yml just won't auto-trigger.

on:
  push:
    branches:
      - development

jobs:

  # ── Gate: wait for CI to pass ────────────────────────────────────────────────
  # The promote jobs only run after all CI checks pass on development.
  # This is enforced here AND should be set as a required status check in
  # Settings → Branches → development branch protection rules.

  # ── Step 1: development → test ───────────────────────────────────────────────
  promote-to-test:
    name: Merge development into test
    runs-on: ubuntu-latest
    needs: []
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.merge.outputs.sha }}

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge development into test
        id: merge
        run: |
          git fetch origin
          git checkout test
          git merge --no-ff origin/development \
            -m "Auto-promote: development → test [skip ci]

          Triggered by push to development @ ${{ github.sha }}
          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git push origin test
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # ── Step 2: test → main ───────────────────────────────────────────────────────
  promote-to-main:
    name: Merge test into main
    runs-on: ubuntu-latest
    needs: promote-to-test
    permissions:
      contents: write

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge test into main
        run: |
          git fetch origin
          git checkout main
          git merge --no-ff origin/test \
            -m "Auto-promote: test → main [v$(cat VERSION 2>/dev/null || echo '?')]

          Promoted from test @ ${{ needs.promote-to-test.outputs.sha }}
          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git push origin main
