name: Promote development -> test -> main

# Triggers only after the CI workflow passes on the development branch.
# This is the primary safety gate: nothing reaches test or main unless every
# lint and test job was green on development first.
#
# IMPORTANT — deploy trigger:
#   Pushes made with GITHUB_TOKEN do NOT trigger other workflows (GitHub security rule).
#   To ensure deploy.yml fires when main is updated, create a fine-grained Personal
#   Access Token with "Contents: Read and Write" on this repo and save it as:
#     Settings -> Secrets and variables -> Actions -> GH_PAT
#   If GH_PAT is absent the merges still happen; deploy.yml just won't auto-trigger.

on:
  workflow_run:
    workflows: ["CI — lint + test all languages"]
    types: [completed]
    branches: [development]

jobs:

  # ── Step 1: development -> test ───────────────────────────────────────────────
  promote-to-test:
    name: Merge development into test
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.merge.outputs.sha }}

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge development into test
        id: merge
        run: |
          git fetch origin
          git checkout test
          git merge --no-ff origin/development \
            -m "Auto-promote: development -> test [skip ci]

          CI run: ${{ github.event.workflow_run.html_url }}
          Triggered by: ${{ github.event.workflow_run.head_sha }}"
          git push origin test
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # ── Step 2: test -> main ───────────────────────────────────────────────────────
  promote-to-main:
    name: Merge test into main
    runs-on: ubuntu-latest
    needs: promote-to-test
    permissions:
      contents: write

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge test into main
        run: |
          git fetch origin
          git checkout main
          git merge --no-ff origin/test \
            -m "Auto-promote: test -> main [v$(cat VERSION 2>/dev/null | tr -d '[:space:]' || echo '?')]

          Promoted from test @ ${{ needs.promote-to-test.outputs.sha }}
          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git push origin main

      - name: Tag release
        run: |
          git fetch --tags
          VERSION=$(cat VERSION 2>/dev/null | tr -d '[:space:]' || echo "unknown")
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            SUFFIX=$(git rev-parse --short HEAD)
            git tag "v${VERSION}-${SUFFIX}"
            git push origin "v${VERSION}-${SUFFIX}"
            echo "Tagged as v${VERSION}-${SUFFIX} (v${VERSION} already existed)"
          else
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
            echo "Tagged as v${VERSION}"
          fi
