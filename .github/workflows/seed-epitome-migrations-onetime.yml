name: ONE-TIME — Seed Epitome d1_migrations bookkeeping

# Temporary, manually-triggered only. Exists to run a single idempotent seed
# command (see PR #202) marking migrations 0001 and 0002 as already applied
# in production, before deploy.yml's tracked `wrangler d1 migrations apply`
# step runs there for the first time. Safe to run more than once — the
# command it executes is CREATE TABLE IF NOT EXISTS + INSERT OR IGNORE.
# Delete this file once it's been run successfully.

on:
  workflow_dispatch: {}

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      # Without this, wrangler-action falls back to installing the latest
      # wrangler globally, which conflicts with drizzle-orm's pinned
      # @cloudflare/workers-types peer dependency. deploy.yml's real Epitome
      # job avoids this the same way — installing from the lockfile first so
      # the already-compatible pinned wrangler version is what gets used.
      - name: Install Epitome worker dependencies
        run: cd epitome/worker && npm ci

      - name: Seed d1_migrations for already-applied 0001 + 0002
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken:         ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId:        ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: epitome/worker
          command: >-
            d1 execute epitome --remote --command="CREATE TABLE IF NOT EXISTS d1_migrations(id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT UNIQUE, applied_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP NOT NULL); INSERT OR IGNORE INTO d1_migrations (name) VALUES ('0001_initial.sql'), ('0002_chapters.sql');"

      - name: Verify seeded rows
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken:         ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId:        ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: epitome/worker
          command:          d1 execute epitome --remote --command="SELECT * FROM d1_migrations;"
