name: .NET Build

on:
  push:
    paths:
      - 'dotnet/**'
      - '.github/workflows/dotnet.yml'
  pull_request:
    paths:
      - 'dotnet/**'
      - '.github/workflows/dotnet.yml'

jobs:
  build-shared:
    name: Shared library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet restore dotnet/shared/ZyxxyzShared.csproj
      - run: dotnet build dotnet/shared/ZyxxyzShared.csproj --no-restore -c Release

  build-api:
    name: Web API
    runs-on: ubuntu-latest
    needs: build-shared
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet restore dotnet/api/ZyxxyzApi.csproj
      - run: dotnet build dotnet/api/ZyxxyzApi.csproj --no-restore -c Release

  build-realtime:
    name: SignalR server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet restore dotnet/realtime/ZyxxyzRealtime.csproj
      - run: dotnet build dotnet/realtime/ZyxxyzRealtime.csproj --no-restore -c Release

  build-blazor:
    name: Blazor WASM
    runs-on: ubuntu-latest
    needs: build-shared
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet restore dotnet/blazor/ZyxxyzBlazor.csproj
      - run: dotnet build dotnet/blazor/ZyxxyzBlazor.csproj --no-restore -c Release

  build-maui:
    name: MAUI (Android framework only)
    runs-on: ubuntu-latest
    needs: build-shared
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      # maui-ios / maui-maccatalyst workloads can't even be installed on
      # Linux ("isn't supported on this platform"), so unfiltered restore of
      # this multi-target csproj is a dead end here — it must be scoped down.
      # ZyxxyzMaui.csproj's ProjectReference to the single-target (net9.0)
      # dotnet/shared/ZyxxyzShared.csproj carries
      # SetTargetFramework="TargetFramework=net9.0" so that reference always
      # restores/builds as net9.0 regardless of what TFM the entry project
      # restores under — but NuGet only honors that metadata via its
      # cross-targeting restore graph, which only activates when
      # $(TargetFrameworks) still evaluates to 2+ values. Collapsing it to a
      # single value (net9.0-android alone) drops out of that graph entirely
      # and falls back to bluntly propagating the global TargetFramework
      # property to every reference, breaking ZyxxyzShared's restore the
      # same way a bare -p:TargetFramework=net9.0-android override did.
      # Keeping two entries (android + windows, dropping only the
      # uninstallable ios/maccatalyst ones) keeps cross-targeting active so
      # SetTargetFramework is actually respected, while the build step below
      # still only builds Android.
      - run: dotnet workload install maui-android --skip-sign-check
      - run: dotnet restore dotnet/maui/ZyxxyzMaui/ZyxxyzMaui.csproj "-p:TargetFrameworks=net9.0-android;net9.0-windows10.0.19041.0"
      - run: dotnet build dotnet/maui/ZyxxyzMaui/ZyxxyzMaui.csproj --no-restore -c Release -f net9.0-android
