name: .NET Build

on:
  push:
    paths:
      - 'dotnet/**'
      - '.github/workflows/dotnet.yml'
  pull_request:
    paths:
      - 'dotnet/**'
      - '.github/workflows/dotnet.yml'

jobs:
  build-shared:
    name: Shared library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet restore dotnet/shared/ZyxxyzShared.csproj
      - run: dotnet build dotnet/shared/ZyxxyzShared.csproj --no-restore -c Release

  build-api:
    name: Web API
    runs-on: ubuntu-latest
    needs: build-shared
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet restore dotnet/api/ZyxxyzApi.csproj
      - run: dotnet build dotnet/api/ZyxxyzApi.csproj --no-restore -c Release

  build-realtime:
    name: SignalR server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet restore dotnet/realtime/ZyxxyzRealtime.csproj
      - run: dotnet build dotnet/realtime/ZyxxyzRealtime.csproj --no-restore -c Release

  build-blazor:
    name: Blazor WASM
    runs-on: ubuntu-latest
    needs: build-shared
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet restore dotnet/blazor/ZyxxyzBlazor.csproj
      - run: dotnet build dotnet/blazor/ZyxxyzBlazor.csproj --no-restore -c Release

  build-maui:
    name: MAUI (Android framework only)
    runs-on: ubuntu-latest
    needs: build-shared
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      # maui-ios / maui-maccatalyst workloads can't even be installed on
      # Linux ("isn't supported on this platform"), so unfiltered restore of
      # this multi-target csproj is a dead end here — it must be scoped to
      # Android. Passing -p:TargetFramework(s) globally to do that used to
      # break dotnet/shared/ZyxxyzShared.csproj's own restore, because
      # MSBuild propagates command-line global properties to every
      # ProjectReference regardless of what that referenced project actually
      # declares — it would silently override ZyxxyzShared's fixed net9.0
      # TargetFramework too. Fixed at the source instead: ZyxxyzShared's
      # ProjectReference in ZyxxyzMaui.csproj now carries
      # SetTargetFramework="TargetFramework=net9.0", which pins that
      # specific reference's TFM through NuGet's restore graph regardless of
      # which global TargetFrameworks override the entry project restores
      # under.
      - run: dotnet workload install maui-android --skip-sign-check
      - run: dotnet restore dotnet/maui/ZyxxyzMaui/ZyxxyzMaui.csproj -p:TargetFrameworks=net9.0-android
      - run: dotnet build dotnet/maui/ZyxxyzMaui/ZyxxyzMaui.csproj --no-restore -c Release -f net9.0-android
