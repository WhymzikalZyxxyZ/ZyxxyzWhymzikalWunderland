name: .NET Build

on:
  push:
    paths:
      - 'dotnet/**'
      - '.github/workflows/dotnet.yml'
  pull_request:
    paths:
      - 'dotnet/**'
      - '.github/workflows/dotnet.yml'

jobs:
  build-shared:
    name: Shared library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet restore dotnet/shared/ZyxxyzShared.csproj
      - run: dotnet build dotnet/shared/ZyxxyzShared.csproj --no-restore -c Release

  build-api:
    name: Web API
    runs-on: ubuntu-latest
    needs: build-shared
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet restore dotnet/api/ZyxxyzApi.csproj
      - run: dotnet build dotnet/api/ZyxxyzApi.csproj --no-restore -c Release

  build-realtime:
    name: SignalR server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet restore dotnet/realtime/ZyxxyzRealtime.csproj
      - run: dotnet build dotnet/realtime/ZyxxyzRealtime.csproj --no-restore -c Release

  build-blazor:
    name: Blazor WASM
    runs-on: ubuntu-latest
    needs: build-shared
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet restore dotnet/blazor/ZyxxyzBlazor.csproj
      - run: dotnet build dotnet/blazor/ZyxxyzBlazor.csproj --no-restore -c Release

  build-maui:
    name: MAUI (Android framework only)
    runs-on: ubuntu-latest
    needs: build-shared
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      # Passing -p:TargetFramework(s) to `dotnet restore` to scope it to Android
      # doesn't just affect ZyxxyzMaui.csproj — MSBuild propagates global
      # properties to every ProjectReference too, including the plain
      # single-target (net9.0) dotnet/shared/ZyxxyzShared.csproj, which then
      # tries to restore itself as net9.0-android and breaks. So instead we
      # install every workload this multi-target csproj references and let
      # restore run unfiltered across all of them; only the build step below
      # is scoped to Android via -f.
      - run: dotnet workload install maui-android maui-ios maui-maccatalyst --skip-sign-check
      - run: dotnet restore dotnet/maui/ZyxxyzMaui/ZyxxyzMaui.csproj
      - run: dotnet build dotnet/maui/ZyxxyzMaui/ZyxxyzMaui.csproj --no-restore -c Release -f net9.0-android
