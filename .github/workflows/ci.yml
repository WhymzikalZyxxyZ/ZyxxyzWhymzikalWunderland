name: CI — lint + test all languages

# Runs on every push to a version/* or feature/* branch, and on PRs into development.
# The promote workflow waits for this to pass before merging to test/main.
#
# Also runs on a nightly schedule (and on-demand via workflow_dispatch) with
# every language job forced on, bypassing the path filter below entirely.
# Path-filtered jobs can otherwise go stale for months without anyone
# noticing — the MAUI and Dart jobs both silently stopped running on real
# inputs for a long stretch simply because dart/**, dotnet/**, and ci.yml
# happened not to change, and a broken coverage-threshold script and an
# unbuildable restore command both sat undetected until something
# incidental (editing this file) finally forced them to run again.
on:
  push:
    branches:
      - 'version/**'
      - 'feature/**'
      - development
  pull_request:
    branches:
      - development
  schedule:
    - cron: '0 9 * * *'  # 09:00 UTC daily
  workflow_dispatch: {}

# A new push to the same ref makes any already-running CI for the previous
# commit on that ref moot — cancel it instead of letting it burn compute to
# completion. Doesn't dedupe the separate push-vs-pull_request double-trigger
# (those land on different refs: refs/heads/<branch> vs refs/pull/<pr>/merge,
# so they don't share a group), only repeated pushes to the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Detect changed paths ─────────────────────────────────────────────────────
  # Every language job checks this output; if only unrelated paths changed the
  # job is skipped, cutting matrix time to what actually matters.
  # Both the language path AND .github/workflows/ci.yml changes trigger a job,
  # so editing the workflow itself re-validates all affected suites.
  # On a scheduled or manually-dispatched run there's no meaningful "changed
  # paths" to diff against, so every output is forced true instead — the
  # whole point of the nightly run is to catch jobs that path-filtering has
  # been silently skipping.
  detect-changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      web:        ${{ steps.force.outputs.all == 'true' || steps.filter.outputs.web == 'true' }}
      typescript: ${{ steps.force.outputs.all == 'true' || steps.filter.outputs.typescript == 'true' }}
      go:         ${{ steps.force.outputs.all == 'true' || steps.filter.outputs.go == 'true' }}
      kotlin:     ${{ steps.force.outputs.all == 'true' || steps.filter.outputs.kotlin == 'true' }}
      dotnet:     ${{ steps.force.outputs.all == 'true' || steps.filter.outputs.dotnet == 'true' }}
      python:     ${{ steps.force.outputs.all == 'true' || steps.filter.outputs.python == 'true' }}
      rust:       ${{ steps.force.outputs.all == 'true' || steps.filter.outputs.rust == 'true' }}
      swift:      ${{ steps.force.outputs.all == 'true' || steps.filter.outputs.swift == 'true' }}
      dart:       ${{ steps.force.outputs.all == 'true' || steps.filter.outputs.dart == 'true' }}
      cpp:        ${{ steps.force.outputs.all == 'true' || steps.filter.outputs.cpp == 'true' }}
      java:       ${{ steps.force.outputs.all == 'true' || steps.filter.outputs.java == 'true' }}
      godot:      ${{ steps.force.outputs.all == 'true' || steps.filter.outputs.godot == 'true' }}
      ci:         ${{ steps.force.outputs.all == 'true' || steps.filter.outputs.ci == 'true' }}
    steps:
      - id: force
        run: echo "all=${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        if: steps.force.outputs.all != 'true'
      - uses: dorny/paths-filter@v3
        id: filter
        if: steps.force.outputs.all != 'true'
        with:
          filters: |
            web:
              - 'js/**'
              - 'css/**'
              - '**/*.html'
              - 'tests/**'
              - 'package.json'
              - 'package-lock.json'
              - 'eslint.config.mjs'
              - '.htmlhintrc'
              - '.stylelintrc.json'
            typescript:
              - 'typescript/**'
            go:
              - 'editor-service/**'
            kotlin:
              - 'kotlin/**'
            dotnet:
              - 'dotnet/**'
            python:
              - 'python/**'
            rust:
              - 'rust/**'
            swift:
              - 'swift/**'
            dart:
              - 'dart/**'
            cpp:
              - 'cpp/**'
            java:
              - 'java/**'
            godot:
              - 'salvation/**'
            ci:
              - '.github/workflows/ci.yml'

  # ── Web: JS / CSS / HTML ──────────────────────────────────────────────────────
  lint-web:
    name: Lint JS · CSS · HTML
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.web == 'true' || needs.detect-changes.outputs.ci == 'true'
    container: node:22
    steps:
      - uses: actions/checkout@v5
      - name: Cache npm
        uses: actions/cache@v5
        with:
          path: /root/.npm
          key: ${{ runner.os }}-npm-web-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-web-
      - name: Install dependencies
        run: npm ci
      - name: Lint JavaScript
        run: npm run lint:js
      - name: Lint CSS
        run: npm run lint:css
      - name: Lint HTML
        run: npm run lint:html

  # ── Web: Jest tests ───────────────────────────────────────────────────────────
  test-js:
    name: Test JavaScript (Jest)
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.web == 'true' || needs.detect-changes.outputs.ci == 'true'
    container: node:22
    steps:
      - uses: actions/checkout@v5
      - name: Cache npm
        uses: actions/cache@v5
        with:
          path: /root/.npm
          key: ${{ runner.os }}-npm-web-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-web-
      - name: Install dependencies
        run: npm ci
      - name: Run tests with coverage
        run: npm test

  # ── TypeScript ────────────────────────────────────────────────────────────────
  lint-typescript:
    name: Lint + type-check TypeScript
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.typescript == 'true' || needs.detect-changes.outputs.ci == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: typescript/api/package.json
      - name: Install API dependencies
        working-directory: typescript/api
        run: npm install
      - name: Type-check shared engine
        working-directory: typescript/shared
        run: ../api/node_modules/.bin/tsc --noEmit
      - name: Type-check API
        working-directory: typescript/api
        run: npx tsc --noEmit
      - name: ESLint shared engine
        working-directory: typescript/shared
        run: |
          npx eslint --no-eslintrc \
            --parser-options="ecmaVersion:2022,sourceType:module" \
            --rule "no-unused-vars: warn" \
            chess_engine.ts || true
      - name: ESLint API
        working-directory: typescript/api
        run: |
          npx eslint --no-eslintrc \
            --parser-options="ecmaVersion:2022,sourceType:module" \
            --rule "no-unused-vars: warn" \
            server.ts || true

  test-typescript:
    name: Test TypeScript (node:test via tsx)
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.typescript == 'true' || needs.detect-changes.outputs.ci == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: typescript/api/package.json
      - name: Install API dependencies (provides tsx)
        working-directory: typescript/api
        run: npm install
      - name: Run shared engine tests
        run: typescript/api/node_modules/.bin/tsx --test typescript/shared/chess_engine.test.ts

  # ── Go ────────────────────────────────────────────────────────────────────────
  lint-go:
    name: Lint Go (editor-service)
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.go == 'true' || needs.detect-changes.outputs.ci == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: editor-service/go.mod
          cache-dependency-path: editor-service/go.sum
      # A dependency bump (golang.org/x/image/x/text, to close real HIGH-
      # severity CVEs — the x/image and x/text fix releases both require
      # Go 1.25) pushed editor-service's go.mod to `go 1.25.0`. As of this
      # change, no golangci-lint release (checked: pinned v1.64.8, and
      # `latest`, which still resolves to the same v1.64.8) supports
      # linting Go-1.25-targeted code yet — it refuses outright ("the Go
      # language version used to build golangci-lint is lower than the
      # targeted Go version"). continue-on-error keeps this from blocking
      # merges on a linter that hasn't caught up to the language version,
      # while still surfacing the failure in the checks list so it's not
      # silently forgotten. go vet (see the build step above) still runs
      # and blocks on real correctness issues regardless.
      - name: golangci-lint
        continue-on-error: true
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: editor-service

  # ── Kotlin ────────────────────────────────────────────────────────────────────
  lint-kotlin:
    name: Lint Kotlin
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.kotlin == 'true' || needs.detect-changes.outputs.ci == 'true'
    steps:
      - uses: actions/checkout@v5
      - name: Download ktlint
        run: |
          curl -sSLO https://github.com/pinterest/ktlint/releases/download/1.3.1/ktlint
          chmod +x ktlint
      - name: Lint Kotlin sources
        run: ./ktlint --relative 'kotlin/**/*.kt'

  test-kotlin:
    name: Test Kotlin (commonTest via androidTarget)
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.kotlin == 'true' || needs.detect-changes.outputs.ci == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      # No gradlew wrapper is committed in kotlin/, so setup-gradle provisions
      # a matching Gradle directly (8.9 — within AGP 8.5.2's supported range)
      # and we invoke `gradle` rather than `./gradlew`.
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - name: Ensure compileSdk 35 platform is installed
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      # commonTest only has kotlin.test as a dependency (no JVM target is
      # declared), so androidTarget's unit-test task is the only way to run
      # it in CI — testDebugUnitTest runs on the JVM via Robolectric-style
      # unit testing, no emulator required.
      - name: Run shared module tests
        working-directory: kotlin
        run: gradle :shared:testDebugUnitTest --no-daemon

  # ── .NET / C# ─────────────────────────────────────────────────────────────────
  lint-dotnet:
    name: Build + Roslyn analysis (.NET)
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.dotnet == 'true' || needs.detect-changes.outputs.ci == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore + build shared (Roslyn warnings-as-errors)
        run: dotnet build dotnet/shared/ZyxxyzShared.csproj -c Release /warnaserror
      - name: Restore + build API
        run: dotnet build dotnet/api/ZyxxyzApi.csproj -c Release /warnaserror
      - name: Restore + build Blazor
        run: dotnet build dotnet/blazor/ZyxxyzBlazor.csproj -c Release /warnaserror
      - name: Restore + build SignalR
        run: dotnet build dotnet/realtime/ZyxxyzRealtime.csproj -c Release /warnaserror

  # ── Python ────────────────────────────────────────────────────────────────────
  lint-python:
    name: Lint Python (Ruff)
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.python == 'true' || needs.detect-changes.outputs.ci == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-ruff-${{ hashFiles('python/**/requirements*.txt') }}
          restore-keys: ${{ runner.os }}-pip-ruff-
      - name: Install Ruff
        run: pip install ruff
      - name: Lint shared engine
        run: ruff check python/shared/chess_engine.py
      - name: Lint desktop app
        run: ruff check python/desktop/app.py
      - name: Lint API
        run: ruff check python/api/app.py

  test-python:
    name: Test Python (pytest + coverage)
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.python == 'true' || needs.detect-changes.outputs.ci == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-pytest-${{ hashFiles('python/**/requirements*.txt') }}
          restore-keys: ${{ runner.os }}-pip-pytest-
      - name: Install test dependencies
        run: pip install pytest pytest-cov
      - name: Run tests with coverage (>=90% required)
        run: |
          pytest python/tests/ -v \
            --cov=python/shared \
            --cov-report=term-missing \
            --cov-fail-under=90

  # ── Rust ─────────────────────────────────────────────────────────────────────
  lint-rust:
    name: Lint Rust (clippy)
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.rust == 'true' || needs.detect-changes.outputs.ci == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/*/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Clippy — shared lib
        working-directory: rust/shared
        run: cargo clippy -- -D warnings
      - name: Clippy — API
        working-directory: rust/api
        run: cargo clippy -- -D warnings
      - name: Clippy — desktop
        working-directory: rust/desktop
        run: cargo clippy -- -D warnings

  test-rust:
    name: Test Rust (cargo test + tarpaulin coverage)
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.rust == 'true' || needs.detect-changes.outputs.ci == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('rust/*/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-test-
      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin
      - name: Test + coverage (>=90% required)
        working-directory: rust/shared
        run: cargo tarpaulin --out Stdout --fail-under 90

  # ── Swift ─────────────────────────────────────────────────────────────────────
  lint-swift:
    name: Lint Swift (SwiftLint)
    runs-on: macos-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.swift == 'true' || needs.detect-changes.outputs.ci == 'true'
    steps:
      - uses: actions/checkout@v5
      - name: Cache Homebrew packages
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/Homebrew
          key: ${{ runner.os }}-brew-swiftlint
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: SwiftLint
        run: swiftlint lint swift/ --strict

  test-swift:
    name: Build + test Swift package
    runs-on: macos-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.swift == 'true' || needs.detect-changes.outputs.ci == 'true'
    steps:
      - uses: actions/checkout@v5
      - name: Cache Swift PM
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('swift/Package.swift') }}
          restore-keys: ${{ runner.os }}-spm-
      - name: Build ChessEngine module
        working-directory: swift
        run: swift build -c release
      - name: Run ChessEngine tests
        working-directory: swift
        run: swift test

  # ── Dart ──────────────────────────────────────────────────────────────────────
  lint-dart:
    name: Lint Dart (dart analyze)
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.dart == 'true' || needs.detect-changes.outputs.ci == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Cache pub
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('dart/shared/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-
      - name: Get dependencies — shared
        working-directory: dart/shared
        run: dart pub get
      - name: Analyze shared engine
        working-directory: dart/shared
        run: dart analyze --fatal-infos

  test-dart:
    name: Test Dart (dart test + coverage)
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.dart == 'true' || needs.detect-changes.outputs.ci == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Cache pub
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('dart/shared/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-
      - name: Get dependencies
        working-directory: dart/shared
        run: dart pub get
      - name: Run tests with coverage
        working-directory: dart/shared
        run: dart test --coverage=coverage
      - name: Generate LCOV report
        working-directory: dart/shared
        run: dart pub global activate coverage && dart pub global run coverage:format_coverage --lcov --in=coverage --out=coverage/lcov.info --report-on=lib
      - name: Check coverage threshold (>=90%)
        working-directory: dart/shared
        run: |
          pip install lcov_cobertura 2>/dev/null || true
          COVERED=$(grep -c "DA:[0-9]*,[1-9]" coverage/lcov.info || echo 0)
          TOTAL=$(grep -c "DA:" coverage/lcov.info || echo 1)
          PCT=$(( COVERED * 100 / TOTAL ))
          echo "Coverage: ${PCT}% (${COVERED}/${TOTAL} lines)"
          if [ "$PCT" -lt 90 ]; then echo "Coverage below 90%"; exit 1; fi

  # ── Java ──────────────────────────────────────────────────────────────────────
  # Not previously in CI at all — no lint, build, or test job existed for
  # java/, despite java/shared/pom.xml already having JUnit + Surefire
  # configured. Adding a real job here rather than leaving it unvalidated.
  test-java:
    name: Test Java (shared engine, JaCoCo >=90%)
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.java == 'true' || needs.detect-changes.outputs.ci == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
          cache-dependency-path: java/shared/pom.xml
      - name: Test + JaCoCo coverage check (>=90% required)
        working-directory: java/shared
        run: mvn -B test

  # ── C++ ───────────────────────────────────────────────────────────────────────
  lint-cpp:
    name: Lint C++ (clang-tidy)
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.cpp == 'true' || needs.detect-changes.outputs.ci == 'true'
    steps:
      - uses: actions/checkout@v5
      - name: Install clang-tidy
        run: sudo apt-get install -y clang-tidy
      - name: Run clang-tidy on shared engine
        run: |
          clang-tidy cpp/shared/chess_engine.cpp \
            --checks='-*,clang-analyzer-*,modernize-*,bugprone-*,readability-*' \
            -- -std=c++17 -I cpp/shared

  build-cpp:
    name: Build C++ (CMake)
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.cpp == 'true' || needs.detect-changes.outputs.ci == 'true'
    steps:
      - uses: actions/checkout@v5
      - name: Install build tools
        run: sudo apt-get install -y cmake build-essential
      - name: Configure
        run: cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build cpp/build
      - name: Run tests
        working-directory: cpp/build
        run: ctest --output-on-failure

  # ── WASM build ────────────────────────────────────────────────────────────────
  build-wasm:
    name: Build Rust → WASM (wasm-pack)
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.rust == 'true' || needs.detect-changes.outputs.ci == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('rust/wasm/Cargo.toml', 'rust/shared/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-wasm-
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build WASM module
        working-directory: rust/wasm
        run: wasm-pack build --target web --release --out-dir pkg
      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: chess-wasm
          path: rust/wasm/pkg/
          retention-days: 7

  # ── JS benchmark (perft correctness gate) ────────────────────────────────────
  benchmark-js:
    name: JS chess engine benchmark (perft correctness)
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.web == 'true' || needs.detect-changes.outputs.ci == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Run perft benchmark
        run: node benchmarks/run.js

  # ── Dependency vulnerability scanning ────────────────────────────────────────
  audit-npm:
    name: Audit npm dependencies
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.web == 'true' || needs.detect-changes.outputs.typescript == 'true' || needs.detect-changes.outputs.ci == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Audit root dependencies
        run: npm audit --audit-level=high
      - name: Audit TypeScript API dependencies
        working-directory: typescript/api
        run: npm install --ignore-scripts && npm audit --audit-level=high

  audit-rust:
    name: Audit Rust dependencies (cargo-audit)
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.rust == 'true' || needs.detect-changes.outputs.ci == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-audit-${{ hashFiles('rust/*/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-audit-
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Audit Rust dependencies
        run: |
          for manifest in rust/*/Cargo.toml; do
            dir=$(dirname "$manifest")
            echo "Auditing $dir"
            (cd "$dir" && cargo audit)
          done

  audit-python:
    name: Audit Python dependencies (pip-audit)
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.python == 'true' || needs.detect-changes.outputs.ci == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit Python dependencies
        run: |
          for req in python/*/requirements*.txt; do
            [ -f "$req" ] || continue
            echo "Auditing $req"
            pip-audit -r "$req" --progress-spinner off
          done

  audit-dotnet:
    name: Audit .NET dependencies
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.dotnet == 'true' || needs.detect-changes.outputs.ci == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Check for vulnerable packages
        run: |
          for proj in dotnet/**/*.csproj; do
            echo "Auditing $proj"
            dotnet list "$proj" package --vulnerable --include-transitive 2>&1 | tee /tmp/audit.txt
            grep -q "has the following vulnerable packages" /tmp/audit.txt && exit 1 || true
          done

  # ── Godot: GUT test suite (Salvation) ────────────────────────────────────────
  # Uses the standard (non-mono) Godot build — Salvation is pure GDScript, no
  # .NET runtime involved, matching what actually ships in the Web export.
  test-godot:
    name: Test Godot (GUT — Salvation)
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.godot == 'true' || needs.detect-changes.outputs.ci == 'true'
    steps:
      - uses: actions/checkout@v5
      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: false
      - name: Import project (registers script class_names)
        run: godot --headless --path salvation/project --import
      - name: Run GUT suite
        run: >
          godot --headless --path salvation/project
          -s addons/gut/gut_cmdln.gd -gdir=res://tests -ginclude_subdirs -gexit
      - name: Verify main level loads without script errors
        run: |
          godot --headless --path salvation/project scenes/levels/level1.tscn --quit-after 2 2>&1 | tee /tmp/level1.log
          if grep -q "SCRIPT ERROR" /tmp/level1.log; then
            echo "::error::level1.tscn produced script errors on load"
            exit 1
          fi
