<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wunderland Kitchen — ZYXXYZ's Whymzykal Wunderland</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/script.js" defer></script>
    <style>
        #recipe-page {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 16px 60px;
        }

        /* ══ HEADER ══ */
        .kitchen-header {
            text-align: center;
            margin: 24px 0 22px;
        }
        .kitchen-title {
            font-family: 'Comic Sans MS', cursive;
            font-size: 2em;
            color: #f4a261;
            margin: 0 0 6px;
            text-shadow: 0 0 28px rgba(244,162,97,0.35);
        }
        .kitchen-subtitle {
            font-family: 'Courier New', monospace;
            font-size: 11px;
            color: #555;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* ══ TOOLBAR ══ */
        .toolbar-row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }
        #search-input {
            flex: 1;
            min-width: 160px;
            background: rgba(255,255,255,0.07);
            border: 1px solid #333;
            border-radius: 7px;
            color: #fff;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            padding: 8px 14px;
            outline: none;
            transition: border-color 0.15s;
        }
        #search-input::placeholder { color: #444; }
        #search-input:focus { border-color: #f4a261; }
        .add-btn {
            background: #f4a261;
            border: none;
            border-radius: 7px;
            color: #111;
            font-family: 'Comic Sans MS', cursive;
            font-size: 13px;
            font-weight: bold;
            padding: 8px 18px;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.13s, color 0.13s;
        }
        .add-btn:hover { background: #e76f51; color: #fff; }

        /* ══ CATEGORY FILTERS ══ */
        .filter-row {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
            margin-bottom: 22px;
        }
        .filter-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 20px;
            color: #888;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            padding: 5px 14px;
            cursor: pointer;
            transition: border-color 0.13s, color 0.13s, background 0.13s;
            user-select: none;
        }
        .filter-btn:hover { border-color: #f4a261; color: #fff; }
        .filter-btn.active {
            background: #f4a261;
            border-color: #f4a261;
            color: #111;
            font-weight: bold;
        }

        /* ══ RECIPE GRID ══ */
        .recipe-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 18px;
        }

        /* ══ RECIPE CARD ══ */
        .recipe-card {
            background: rgba(0,0,0,0.69);
            border: 2px solid #2a2a2a;
            border-radius: 12px;
            padding: 20px 18px 16px;
            cursor: pointer;
            transition: transform 0.18s, border-color 0.18s, box-shadow 0.18s;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .recipe-card:hover {
            transform: translateY(-6px);
            border-color: #f4a261;
            box-shadow: 0 10px 30px rgba(244,162,97,0.15);
        }
        .recipe-card.user-added { border-color: #3a2a1a; }
        .card-emoji { font-size: 2.6em; display: block; text-align: center; margin-bottom: 10px; }
        .card-name {
            font-family: 'Comic Sans MS', cursive;
            font-size: 1em;
            color: #f4a261;
            text-align: center;
            margin: 0 0 5px;
        }
        .card-category {
            display: block;
            text-align: center;
            font-family: 'Courier New', monospace;
            font-size: 9px;
            letter-spacing: 2px;
            color: #555;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .card-desc {
            font-family: 'Courier New', monospace;
            font-size: 11px;
            color: #888;
            text-align: center;
            line-height: 1.5;
            flex: 1;
        }
        .card-delete {
            position: absolute;
            top: 8px; right: 8px;
            background: none;
            border: none;
            color: #3a3a3a;
            font-size: 14px;
            cursor: pointer;
            padding: 2px 5px;
            border-radius: 4px;
            transition: color 0.12s;
            line-height: 1;
        }
        .card-delete:hover { color: #e55; }

        /* ══ EMPTY STATE ══ */
        .empty-notice {
            text-align: center;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            color: #444;
            padding: 40px 0;
            grid-column: 1 / -1;
        }

        /* ══ VIEW MODAL BACKDROP ══ */
        #modal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.82);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        #modal-backdrop.open { display: flex; }

        /* ══ VIEW MODAL ══ */
        #recipe-modal {
            background: #111;
            border: 2px solid #f4a261;
            border-radius: 14px;
            padding: 28px 28px 24px;
            max-width: 560px;
            width: 100%;
            max-height: 88vh;
            overflow-y: auto;
            position: relative;
            scrollbar-width: thin;
            scrollbar-color: #333 transparent;
        }
        #recipe-modal::-webkit-scrollbar { width: 5px; }
        #recipe-modal::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        .modal-close {
            position: absolute;
            top: 12px; right: 14px;
            background: none; border: none;
            color: #555; font-size: 22px;
            cursor: pointer; line-height: 1;
            transition: color 0.12s;
        }
        .modal-close:hover { color: #f4a261; }
        .modal-emoji { font-size: 3em; display: block; text-align: center; margin-bottom: 10px; }
        .modal-title {
            font-family: 'Comic Sans MS', cursive;
            font-size: 1.5em;
            color: #f4a261;
            text-align: center;
            margin: 0 0 4px;
        }
        .modal-category {
            display: block;
            text-align: center;
            font-family: 'Courier New', monospace;
            font-size: 10px;
            letter-spacing: 2px;
            color: #555;
            text-transform: uppercase;
            margin-bottom: 12px;
        }
        .modal-desc {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #aaa;
            text-align: center;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .modal-section-label {
            font-family: 'Comic Sans MS', cursive;
            font-size: 13px;
            color: #f4a261;
            border-bottom: 1px solid #2a2a2a;
            padding-bottom: 5px;
            margin: 18px 0 10px;
        }
        .modal-ingredients {
            list-style: none;
            padding: 0; margin: 0;
        }
        .modal-ingredients li {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #ccc;
            padding: 5px 0;
            border-bottom: 1px solid #1a1a1a;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }
        .modal-ingredients li::before {
            content: '✦';
            color: #f4a261;
            flex-shrink: 0;
            margin-top: 1px;
        }
        .modal-steps {
            list-style: none;
            padding: 0; margin: 0;
            counter-reset: steps;
        }
        .modal-steps li {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #ccc;
            padding: 7px 0 7px 34px;
            border-bottom: 1px solid #1a1a1a;
            position: relative;
            line-height: 1.55;
            counter-increment: steps;
        }
        .modal-steps li::before {
            content: counter(steps);
            position: absolute;
            left: 0; top: 7px;
            width: 22px; height: 22px;
            background: #f4a261;
            color: #111;
            border-radius: 50%;
            font-family: 'Comic Sans MS', cursive;
            font-size: 11px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 16px;
        }
        .modal-tag {
            background: rgba(244,162,97,0.1);
            border: 1px solid rgba(244,162,97,0.22);
            border-radius: 12px;
            color: #f4a261;
            font-family: 'Courier New', monospace;
            font-size: 10px;
            padding: 3px 10px;
        }

        /* ══ ADD MODAL BACKDROP ══ */
        #add-modal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 1010;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        #add-modal-backdrop.open { display: flex; }

        /* ══ ADD MODAL ══ */
        #add-modal {
            background: #111;
            border: 2px solid #f4a261;
            border-radius: 14px;
            padding: 28px;
            max-width: 520px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            scrollbar-width: thin;
            scrollbar-color: #333 transparent;
        }
        #add-modal::-webkit-scrollbar { width: 5px; }
        #add-modal::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        .add-modal-title {
            font-family: 'Comic Sans MS', cursive;
            font-size: 1.3em;
            color: #f4a261;
            margin: 0 0 20px;
        }
        .form-group { margin-bottom: 14px; }
        .form-label {
            display: block;
            font-family: 'Courier New', monospace;
            font-size: 10px;
            letter-spacing: 2px;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        .form-input, .form-select, .form-textarea {
            width: 100%;
            box-sizing: border-box;
            background: rgba(255,255,255,0.06);
            border: 1px solid #333;
            border-radius: 6px;
            color: #fff;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            padding: 8px 10px;
            outline: none;
            transition: border-color 0.14s;
        }
        .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: #f4a261; }
        .form-select option { background: #111; }
        .form-textarea { resize: vertical; min-height: 70px; }
        .form-hint { font-family: 'Courier New', monospace; font-size: 10px; color: #444; margin-top: 3px; }
        .form-row { display: flex; gap: 10px; }
        .form-row .form-group { flex: 1; }
        .form-btns {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 20px;
        }
        .form-btn-cancel {
            background: none;
            border: 1px solid #333;
            border-radius: 7px;
            color: #888;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            padding: 8px 18px;
            cursor: pointer;
            transition: border-color 0.13s, color 0.13s;
        }
        .form-btn-cancel:hover { border-color: #888; color: #fff; }
        .form-btn-save {
            background: #f4a261;
            border: none;
            border-radius: 7px;
            color: #111;
            font-family: 'Comic Sans MS', cursive;
            font-size: 13px;
            font-weight: bold;
            padding: 8px 22px;
            cursor: pointer;
            transition: background 0.13s, color 0.13s;
        }
        .form-btn-save:hover { background: #e76f51; color: #fff; }

        /* ══ RESPONSIVE ══ */
        @media (max-width: 540px) {
            .recipe-grid { grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); }
            #recipe-modal, #add-modal { padding: 20px 16px; }
        }
    </style>
</head>
<body class="wunderBody">
    <h2>Zyxxyz's Whymzykal Kitchen</h2>

    <div class="navbar">
        <a href="../../">Home</a>
        <a href="../../virtuoso/animations/motionpictures">Motion Pictures</a>
        <a href="../../virtuoso/comics/webcomic">Webcomic</a>
        <a href="../../virtuoso/crafts/handmade">Handmade</a>
        <a href="../../virtuoso/drawings/doodles">Doodles</a>
        <a href="../../virtuoso/writings/stories">Stories</a>
    </div>

    <div class="banner"></div>

    <div id="recipe-page">

        <div class="kitchen-header">
            <div class="kitchen-title">✨ The Whymzykal Recipe Book ✨</div>
            <div class="kitchen-subtitle">enchanted eats &amp; mystical mixtures</div>
        </div>

        <div class="toolbar-row">
            <input type="text" id="search-input" placeholder="🔍  search potions &amp; provisions..." oninput="renderGrid()">
            <button class="add-btn" onclick="openAddModal()">＋ Add Recipe</button>
        </div>

        <div class="filter-row" id="filter-row"></div>

        <div class="recipe-grid" id="recipe-grid"></div>

    </div>

    <!-- ══ VIEW RECIPE MODAL ══ -->
    <div id="modal-backdrop" onclick="closeModalBackdrop(event)">
        <div id="recipe-modal">
            <button class="modal-close" onclick="closeModalDirect()">✕</button>
            <span class="modal-emoji" id="m-emoji"></span>
            <div class="modal-title" id="m-title"></div>
            <span class="modal-category" id="m-category"></span>
            <div class="modal-desc" id="m-desc"></div>
            <div class="modal-section-label">✦ Ingredients</div>
            <ul class="modal-ingredients" id="m-ingredients"></ul>
            <div class="modal-section-label">✦ Steps</div>
            <ol class="modal-steps" id="m-steps"></ol>
            <div class="modal-tags" id="m-tags"></div>
        </div>
    </div>

    <!-- ══ ADD RECIPE MODAL ══ -->
    <div id="add-modal-backdrop" onclick="closeAddModalBackdrop(event)">
        <div id="add-modal">
            <button class="modal-close" onclick="closeAddModalDirect()">✕</button>
            <div class="add-modal-title">✦ New Recipe</div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Name</label>
                    <input class="form-input" id="f-name" type="text" placeholder="Dragon's Mac &amp; Cheese" maxlength="60">
                </div>
                <div class="form-group" style="max-width:76px">
                    <label class="form-label">Emoji</label>
                    <input class="form-input" id="f-emoji" type="text" placeholder="🍜" maxlength="4">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Category</label>
                    <select class="form-select" id="f-category">
                        <option value="Food">Food</option>
                        <option value="Drink">Drink</option>
                        <option value="Snack">Snack</option>
                        <option value="Dessert">Dessert</option>
                        <option value="Breakfast">Breakfast</option>
                        <option value="Potion">Potion</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Tags <span style="color:#333">(comma-sep)</span></label>
                    <input class="form-input" id="f-tags" type="text" placeholder="spicy, quick, vegan">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Description</label>
                <input class="form-input" id="f-desc" type="text" placeholder="A brief, enchanting summary..." maxlength="140">
            </div>

            <div class="form-group">
                <label class="form-label">Ingredients</label>
                <textarea class="form-textarea" id="f-ingredients" placeholder="1 cup flour&#10;2 eggs&#10;a pinch of magic"></textarea>
                <div class="form-hint">One ingredient per line.</div>
            </div>

            <div class="form-group">
                <label class="form-label">Steps</label>
                <textarea class="form-textarea" id="f-steps" placeholder="Preheat oven to 350°F&#10;Mix the ingredients&#10;Bake until golden" style="min-height:100px"></textarea>
                <div class="form-hint">One step per line.</div>
            </div>

            <div class="form-btns">
                <button class="form-btn-cancel" onclick="closeAddModalDirect()">Cancel</button>
                <button class="form-btn-save" onclick="saveRecipe()">✦ Save Recipe</button>
            </div>
        </div>
    </div>

    <button type="button" onclick="navigateToPage('/')">E.T. Phone Home!</button>

    <script src="/js/virtuoso/crafts/handmade.js" defer></script>
</body>
</html>
