<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wunderland Kitchen — ZYXXYZ's Whymzykal Wunderland</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/script.js"></script>
    <style>
        #recipe-page {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 16px 60px;
        }

        /* ══ HEADER ══ */
        .kitchen-header {
            text-align: center;
            margin: 24px 0 22px;
        }
        .kitchen-title {
            font-family: 'Comic Sans MS', cursive;
            font-size: 2em;
            color: #f4a261;
            margin: 0 0 6px;
            text-shadow: 0 0 28px rgba(244,162,97,0.35);
        }
        .kitchen-subtitle {
            font-family: 'Courier New', monospace;
            font-size: 11px;
            color: #555;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* ══ TOOLBAR ══ */
        .toolbar-row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }
        #search-input {
            flex: 1;
            min-width: 160px;
            background: rgba(255,255,255,0.07);
            border: 1px solid #333;
            border-radius: 7px;
            color: #fff;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            padding: 8px 14px;
            outline: none;
            transition: border-color 0.15s;
        }
        #search-input::placeholder { color: #444; }
        #search-input:focus { border-color: #f4a261; }
        .add-btn {
            background: #f4a261;
            border: none;
            border-radius: 7px;
            color: #111;
            font-family: 'Comic Sans MS', cursive;
            font-size: 13px;
            font-weight: bold;
            padding: 8px 18px;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.13s, color 0.13s;
        }
        .add-btn:hover { background: #e76f51; color: #fff; }

        /* ══ CATEGORY FILTERS ══ */
        .filter-row {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
            margin-bottom: 22px;
        }
        .filter-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 20px;
            color: #888;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            padding: 5px 14px;
            cursor: pointer;
            transition: border-color 0.13s, color 0.13s, background 0.13s;
            user-select: none;
        }
        .filter-btn:hover { border-color: #f4a261; color: #fff; }
        .filter-btn.active {
            background: #f4a261;
            border-color: #f4a261;
            color: #111;
            font-weight: bold;
        }

        /* ══ RECIPE GRID ══ */
        .recipe-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 18px;
        }

        /* ══ RECIPE CARD ══ */
        .recipe-card {
            background: rgba(0,0,0,0.69);
            border: 2px solid #2a2a2a;
            border-radius: 12px;
            padding: 20px 18px 16px;
            cursor: pointer;
            transition: transform 0.18s, border-color 0.18s, box-shadow 0.18s;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .recipe-card:hover {
            transform: translateY(-6px);
            border-color: #f4a261;
            box-shadow: 0 10px 30px rgba(244,162,97,0.15);
        }
        .recipe-card.user-added { border-color: #3a2a1a; }
        .card-emoji { font-size: 2.6em; display: block; text-align: center; margin-bottom: 10px; }
        .card-name {
            font-family: 'Comic Sans MS', cursive;
            font-size: 1em;
            color: #f4a261;
            text-align: center;
            margin: 0 0 5px;
        }
        .card-category {
            display: block;
            text-align: center;
            font-family: 'Courier New', monospace;
            font-size: 9px;
            letter-spacing: 2px;
            color: #555;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .card-desc {
            font-family: 'Courier New', monospace;
            font-size: 11px;
            color: #888;
            text-align: center;
            line-height: 1.5;
            flex: 1;
        }
        .card-delete {
            position: absolute;
            top: 8px; right: 8px;
            background: none;
            border: none;
            color: #3a3a3a;
            font-size: 14px;
            cursor: pointer;
            padding: 2px 5px;
            border-radius: 4px;
            transition: color 0.12s;
            line-height: 1;
        }
        .card-delete:hover { color: #e55; }

        /* ══ EMPTY STATE ══ */
        .empty-notice {
            text-align: center;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            color: #444;
            padding: 40px 0;
            grid-column: 1 / -1;
        }

        /* ══ VIEW MODAL BACKDROP ══ */
        #modal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.82);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        #modal-backdrop.open { display: flex; }

        /* ══ VIEW MODAL ══ */
        #recipe-modal {
            background: #111;
            border: 2px solid #f4a261;
            border-radius: 14px;
            padding: 28px 28px 24px;
            max-width: 560px;
            width: 100%;
            max-height: 88vh;
            overflow-y: auto;
            position: relative;
            scrollbar-width: thin;
            scrollbar-color: #333 transparent;
        }
        #recipe-modal::-webkit-scrollbar { width: 5px; }
        #recipe-modal::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        .modal-close {
            position: absolute;
            top: 12px; right: 14px;
            background: none; border: none;
            color: #555; font-size: 22px;
            cursor: pointer; line-height: 1;
            transition: color 0.12s;
        }
        .modal-close:hover { color: #f4a261; }
        .modal-emoji { font-size: 3em; display: block; text-align: center; margin-bottom: 10px; }
        .modal-title {
            font-family: 'Comic Sans MS', cursive;
            font-size: 1.5em;
            color: #f4a261;
            text-align: center;
            margin: 0 0 4px;
        }
        .modal-category {
            display: block;
            text-align: center;
            font-family: 'Courier New', monospace;
            font-size: 10px;
            letter-spacing: 2px;
            color: #555;
            text-transform: uppercase;
            margin-bottom: 12px;
        }
        .modal-desc {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #aaa;
            text-align: center;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .modal-section-label {
            font-family: 'Comic Sans MS', cursive;
            font-size: 13px;
            color: #f4a261;
            border-bottom: 1px solid #2a2a2a;
            padding-bottom: 5px;
            margin: 18px 0 10px;
        }
        .modal-ingredients {
            list-style: none;
            padding: 0; margin: 0;
        }
        .modal-ingredients li {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #ccc;
            padding: 5px 0;
            border-bottom: 1px solid #1a1a1a;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }
        .modal-ingredients li::before {
            content: '✦';
            color: #f4a261;
            flex-shrink: 0;
            margin-top: 1px;
        }
        .modal-steps {
            list-style: none;
            padding: 0; margin: 0;
            counter-reset: steps;
        }
        .modal-steps li {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #ccc;
            padding: 7px 0 7px 34px;
            border-bottom: 1px solid #1a1a1a;
            position: relative;
            line-height: 1.55;
            counter-increment: steps;
        }
        .modal-steps li::before {
            content: counter(steps);
            position: absolute;
            left: 0; top: 7px;
            width: 22px; height: 22px;
            background: #f4a261;
            color: #111;
            border-radius: 50%;
            font-family: 'Comic Sans MS', cursive;
            font-size: 11px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 16px;
        }
        .modal-tag {
            background: rgba(244,162,97,0.1);
            border: 1px solid rgba(244,162,97,0.22);
            border-radius: 12px;
            color: #f4a261;
            font-family: 'Courier New', monospace;
            font-size: 10px;
            padding: 3px 10px;
        }

        /* ══ ADD MODAL BACKDROP ══ */
        #add-modal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 1010;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        #add-modal-backdrop.open { display: flex; }

        /* ══ ADD MODAL ══ */
        #add-modal {
            background: #111;
            border: 2px solid #f4a261;
            border-radius: 14px;
            padding: 28px;
            max-width: 520px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            scrollbar-width: thin;
            scrollbar-color: #333 transparent;
        }
        #add-modal::-webkit-scrollbar { width: 5px; }
        #add-modal::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        .add-modal-title {
            font-family: 'Comic Sans MS', cursive;
            font-size: 1.3em;
            color: #f4a261;
            margin: 0 0 20px;
        }
        .form-group { margin-bottom: 14px; }
        .form-label {
            display: block;
            font-family: 'Courier New', monospace;
            font-size: 10px;
            letter-spacing: 2px;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        .form-input, .form-select, .form-textarea {
            width: 100%;
            box-sizing: border-box;
            background: rgba(255,255,255,0.06);
            border: 1px solid #333;
            border-radius: 6px;
            color: #fff;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            padding: 8px 10px;
            outline: none;
            transition: border-color 0.14s;
        }
        .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: #f4a261; }
        .form-select option { background: #111; }
        .form-textarea { resize: vertical; min-height: 70px; }
        .form-hint { font-family: 'Courier New', monospace; font-size: 10px; color: #444; margin-top: 3px; }
        .form-row { display: flex; gap: 10px; }
        .form-row .form-group { flex: 1; }
        .form-btns {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 20px;
        }
        .form-btn-cancel {
            background: none;
            border: 1px solid #333;
            border-radius: 7px;
            color: #888;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            padding: 8px 18px;
            cursor: pointer;
            transition: border-color 0.13s, color 0.13s;
        }
        .form-btn-cancel:hover { border-color: #888; color: #fff; }
        .form-btn-save {
            background: #f4a261;
            border: none;
            border-radius: 7px;
            color: #111;
            font-family: 'Comic Sans MS', cursive;
            font-size: 13px;
            font-weight: bold;
            padding: 8px 22px;
            cursor: pointer;
            transition: background 0.13s, color 0.13s;
        }
        .form-btn-save:hover { background: #e76f51; color: #fff; }

        /* ══ RESPONSIVE ══ */
        @media (max-width: 540px) {
            .recipe-grid { grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); }
            #recipe-modal, #add-modal { padding: 20px 16px; }
        }
    </style>
</head>
<body class="notYetBody">

    <h2>Zyxxyz's Wunderland Kitchen</h2>

    <div class="navbar">
        <a href="../../index.html">Home</a>
        <a href="../../virtuoso/animations/motionpictures.html">Motion Pictures</a>
        <a href="../../virtuoso/comics/webcomic.html">Webcomic</a>
        <a href="../../virtuoso/crafts/handmade.html">Handmade</a>
        <a href="../../virtuoso/drawings/doodles.html">Doodles</a>
        <a href="../../virtuoso/writings/stories.html">Stories</a>
    </div>

    <div class="banner"></div>

    <div id="recipe-page">

        <div class="kitchen-header">
            <div class="kitchen-title">✨ The Whymzykal Recipe Book ✨</div>
            <div class="kitchen-subtitle">enchanted eats &amp; mystical mixtures</div>
        </div>

        <div class="toolbar-row">
            <input type="text" id="search-input" placeholder="🔍  search potions &amp; provisions..." oninput="renderGrid()">
            <button class="add-btn" onclick="openAddModal()">＋ Add Recipe</button>
        </div>

        <div class="filter-row" id="filter-row"></div>

        <div class="recipe-grid" id="recipe-grid"></div>

    </div>

    <!-- ══ VIEW RECIPE MODAL ══ -->
    <div id="modal-backdrop" onclick="closeModalBackdrop(event)">
        <div id="recipe-modal">
            <button class="modal-close" onclick="closeModalDirect()">✕</button>
            <span class="modal-emoji" id="m-emoji"></span>
            <div class="modal-title" id="m-title"></div>
            <span class="modal-category" id="m-category"></span>
            <div class="modal-desc" id="m-desc"></div>
            <div class="modal-section-label">✦ Ingredients</div>
            <ul class="modal-ingredients" id="m-ingredients"></ul>
            <div class="modal-section-label">✦ Steps</div>
            <ol class="modal-steps" id="m-steps"></ol>
            <div class="modal-tags" id="m-tags"></div>
        </div>
    </div>

    <!-- ══ ADD RECIPE MODAL ══ -->
    <div id="add-modal-backdrop" onclick="closeAddModalBackdrop(event)">
        <div id="add-modal">
            <button class="modal-close" onclick="closeAddModalDirect()">✕</button>
            <div class="add-modal-title">✦ New Recipe</div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Name</label>
                    <input class="form-input" id="f-name" type="text" placeholder="Dragon's Mac &amp; Cheese" maxlength="60">
                </div>
                <div class="form-group" style="max-width:76px">
                    <label class="form-label">Emoji</label>
                    <input class="form-input" id="f-emoji" type="text" placeholder="🍜" maxlength="4">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Category</label>
                    <select class="form-select" id="f-category">
                        <option value="Food">Food</option>
                        <option value="Drink">Drink</option>
                        <option value="Snack">Snack</option>
                        <option value="Dessert">Dessert</option>
                        <option value="Breakfast">Breakfast</option>
                        <option value="Potion">Potion</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Tags <span style="color:#333">(comma-sep)</span></label>
                    <input class="form-input" id="f-tags" type="text" placeholder="spicy, quick, vegan">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Description</label>
                <input class="form-input" id="f-desc" type="text" placeholder="A brief, enchanting summary..." maxlength="140">
            </div>

            <div class="form-group">
                <label class="form-label">Ingredients</label>
                <textarea class="form-textarea" id="f-ingredients" placeholder="1 cup flour&#10;2 eggs&#10;a pinch of magic"></textarea>
                <div class="form-hint">One ingredient per line.</div>
            </div>

            <div class="form-group">
                <label class="form-label">Steps</label>
                <textarea class="form-textarea" id="f-steps" placeholder="Preheat oven to 350°F&#10;Mix the ingredients&#10;Bake until golden" style="min-height:100px"></textarea>
                <div class="form-hint">One step per line.</div>
            </div>

            <div class="form-btns">
                <button class="form-btn-cancel" onclick="closeAddModalDirect()">Cancel</button>
                <button class="form-btn-save" onclick="saveRecipe()">✦ Save Recipe</button>
            </div>
        </div>
    </div>

    <button type="button" onclick="navigateToPage('../../index.html')">E.T. Phone Home!</button>

    <script>
        // ── Built-in recipes ───────────────────────────────────────────────────────
        const BUILT_IN = [
            {
                id: 'bi-1', emoji: '🧙', name: "Wizard's Mac & Cheese",
                category: 'Food',
                desc: 'The most comforting spell in the grimoire. Creamy, gooey, and slightly legendary.',
                tags: ['comfort', 'cheesy', 'baked'],
                ingredients: [
                    '450g (1 lb) elbow macaroni',
                    '4 tbsp butter',
                    '¼ cup all-purpose flour',
                    '3 cups whole milk',
                    '2 cups sharp cheddar, shredded',
                    '1 cup gruyère, shredded',
                    '½ tsp mustard powder',
                    'Salt, pepper & a pinch of paprika',
                    'Breadcrumbs for topping (optional)',
                ],
                steps: [
                    'Preheat oven to 190°C / 375°F.',
                    'Cook macaroni in salted water until al dente. Drain and set aside.',
                    'Melt butter in a large saucepan over medium heat. Whisk in flour and cook 1 min.',
                    'Gradually whisk in milk until smooth. Simmer until thickened, about 5 min.',
                    'Remove from heat and stir in both cheeses, mustard powder, salt, and pepper.',
                    'Fold in the pasta and pour into a greased baking dish.',
                    'Top with breadcrumbs and a dusting of paprika.',
                    'Bake 20–25 min until golden and bubbling. Let sit 5 min before serving.',
                ],
            },
            {
                id: 'bi-2', emoji: '🥞', name: 'Moonbeam Pancakes',
                category: 'Breakfast',
                desc: 'Impossibly fluffy pancakes that seem to glow from within. Best eaten at sunrise.',
                tags: ['fluffy', 'quick', 'sweet'],
                ingredients: [
                    '1½ cups all-purpose flour',
                    '2 tbsp sugar',
                    '1 tsp baking powder',
                    '½ tsp baking soda',
                    '¼ tsp salt',
                    '1 cup buttermilk',
                    '1 large egg',
                    '2 tbsp melted butter',
                    '1 tsp vanilla extract',
                ],
                steps: [
                    'Whisk together flour, sugar, baking powder, baking soda, and salt in a bowl.',
                    'In a second bowl mix buttermilk, egg, butter, and vanilla.',
                    'Pour wet into dry and fold gently — lumps are fine, do not overmix.',
                    'Let batter rest 5 min while you heat a non-stick pan over medium-low.',
                    'Grease lightly and pour ¼ cup batter per pancake.',
                    'Cook until bubbles form on top and edges look set, about 2 min.',
                    'Flip once and cook 1 more min. Serve with maple syrup or enchanted berries.',
                ],
            },
            {
                id: 'bi-3', emoji: '🐉', name: 'Dragon Egg Deviled Eggs',
                category: 'Snack',
                desc: 'Fiery, creamy deviled eggs with a smoky paprika kick. Handle with care.',
                tags: ['spicy', 'party'],
                ingredients: [
                    '6 large eggs, hard-boiled and peeled',
                    '3 tbsp mayonnaise',
                    '1 tsp Dijon mustard',
                    '1 tsp sriracha (or more, adventurer)',
                    '1 tsp apple cider vinegar',
                    'Salt and pepper to taste',
                    'Smoked paprika and chives to garnish',
                ],
                steps: [
                    'Slice eggs in half lengthwise and pop yolks into a bowl.',
                    'Mash yolks with mayo, mustard, sriracha, and vinegar until smooth.',
                    'Season with salt and pepper. Taste and adjust heat to your dragon level.',
                    'Pipe or spoon filling back into egg whites.',
                    'Dust generously with smoked paprika and top with sliced chives.',
                    'Refrigerate until ready to serve — best within 2 hours of making.',
                ],
            },
            {
                id: 'bi-4', emoji: '⚡', name: 'Thundercloud Chili',
                category: 'Food',
                desc: 'A hearty, storm-worthy chili that rumbles all afternoon and gets better the next day.',
                tags: ['hearty', 'spicy', 'slow-cook'],
                ingredients: [
                    '500g (1 lb) ground beef or turkey',
                    '1 can (400g) diced tomatoes',
                    '1 can (400g) kidney beans, drained',
                    '1 can (400g) black beans, drained',
                    '1 onion, diced',
                    '3 garlic cloves, minced',
                    '1 red bell pepper, diced',
                    '2 tbsp chili powder',
                    '1 tsp each: cumin and smoked paprika',
                    '1 cup beef or veggie broth',
                    'Salt, pepper, a squeeze of lime',
                ],
                steps: [
                    'Brown the meat in a large pot over medium-high heat, seasoned with salt. Remove and set aside.',
                    'In the same pot sauté onion and pepper until soft, about 5 min. Add garlic and cook 1 min more.',
                    'Add chili powder, cumin, and paprika. Stir to coat and cook 30 seconds.',
                    'Return the meat. Add tomatoes, beans, and broth. Stir everything together.',
                    'Bring to a boil, then reduce heat and simmer uncovered for 30–45 min.',
                    'Adjust seasoning. Finish with a squeeze of lime.',
                    'Serve with cornbread, sour cream, shredded cheddar, or all of the above.',
                ],
            },
            {
                id: 'bi-5', emoji: '🌮', name: 'Enchanted Tacos',
                category: 'Food',
                desc: 'Crispy-edged seasoned meat tucked into warm tortillas with all the magical toppings.',
                tags: ['quick', 'crowd-pleaser'],
                ingredients: [
                    '500g (1 lb) ground beef or black beans',
                    '1 tbsp olive oil',
                    '1 tsp each: cumin, chili powder, garlic powder',
                    '½ tsp paprika, salt and pepper',
                    '¼ cup water',
                    '8 small corn or flour tortillas',
                    'Toppings: shredded lettuce, diced tomato, cheddar, sour cream, salsa, lime',
                ],
                steps: [
                    'Heat oil in a skillet over medium-high. Add meat and break apart. Cook until browned.',
                    'Drain excess fat. Add all spices and stir to coat.',
                    'Add water and simmer 3–4 min until sauce is absorbed and meat is glazed.',
                    'Warm tortillas in a dry pan or directly over a gas burner for 20 seconds per side.',
                    'Load each tortilla with meat and all your chosen toppings.',
                    'Squeeze lime over everything. Eat immediately.',
                ],
            },
            {
                id: 'bi-6', emoji: '☕', name: 'Potion of Awakening',
                category: 'Drink',
                desc: 'A perfectly brewed elixir to summon consciousness on even the most bewitched of mornings.',
                tags: ['coffee', 'hot', 'morning'],
                ingredients: [
                    '18g freshly ground coffee (medium-coarse grind)',
                    '300ml water at 93°C / 200°F (just off the boil)',
                    'Optional: splash of cream, spoonful of honey',
                ],
                steps: [
                    'Heat water to 93°C — just off the boil, let it rest 30 seconds after boiling.',
                    'Pour-over method: wet the filter, add coffee grounds. Bloom with ~50ml water for 30 sec.',
                    'Slowly pour remaining water in a steady spiral over 2–3 min total.',
                    'French press method: add grounds, pour all water, stir, steep 4 min, then press slowly.',
                    'Taste before adding anything — a well-brewed potion needs no decoration.',
                    'If desired, stir in a splash of cream and a spoonful of honey. Sip mindfully.',
                ],
            },
            {
                id: 'bi-7', emoji: '💙', name: 'Mystic Blue Lemonade',
                category: 'Drink',
                desc: 'Shimmering cerulean lemonade that turns violet when you add the citrus. Pure alchemy.',
                tags: ['cold', 'fruity', 'magical', 'caffeine-free'],

        // ── State & storage ────────────────────────────────────────────────────────
        const STORAGE_KEY = 'wunderland_recipes';
        let activeFilter  = 'All';

        function loadUserRecipes() {
            try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
            catch { return []; }
        }

        function saveUserRecipes(arr) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
        }

        function allRecipes() { return [...BUILT_IN, ...loadUserRecipes()]; }

        // ── Filters ────────────────────────────────────────────────────────────────
        function buildFilters() {
            const cats = ['All', ...new Set(allRecipes().map(r => r.category))];
            const row  = document.getElementById('filter-row');
            row.innerHTML = '';
            cats.forEach(c => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn' + (c === activeFilter ? ' active' : '');
                btn.textContent = c === 'All' ? '✨ All' : c;
                btn.addEventListener('click', () => {
                    activeFilter = c;
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    renderGrid();
                });
                row.appendChild(btn);
            });
        }

        // ── Grid ───────────────────────────────────────────────────────────────────
        function renderGrid() {
            const query   = document.getElementById('search-input').value.toLowerCase().trim();
            const grid    = document.getElementById('recipe-grid');
            const userIds = new Set(loadUserRecipes().map(r => r.id));

            const filtered = allRecipes().filter(r => {
                const catOk    = activeFilter === 'All' || r.category === activeFilter;
                const searchOk = !query
                    || r.name.toLowerCase().includes(query)
                    || r.desc.toLowerCase().includes(query)
                    || r.category.toLowerCase().includes(query)
                    || (r.tags || []).some(t => t.toLowerCase().includes(query));
                return catOk && searchOk;
            });

            grid.innerHTML = '';

            if (!filtered.length) {
                grid.innerHTML = '<div class="empty-notice">No recipes found... perhaps they vanished into the ether? ✨</div>';
                return;
            }

            filtered.forEach(r => {
                const card = document.createElement('div');
                card.className = 'recipe-card' + (userIds.has(r.id) ? ' user-added' : '');
                card.innerHTML =
                    '<span class="card-emoji">' + (r.emoji || '🍽') + '</span>' +
                    '<div class="card-name">' + esc(r.name) + '</div>' +
                    '<span class="card-category">' + esc(r.category) + '</span>' +
                    '<div class="card-desc">' + esc(r.desc) + '</div>';

                if (userIds.has(r.id)) {
                    const del = document.createElement('button');
                    del.className = 'card-delete';
                    del.textContent = '✕';
                    del.title = 'Delete recipe';
                    del.addEventListener('click', ev => {
                        ev.stopPropagation();
                        if (!confirm('Remove "' + r.name + '" from your recipe book?')) return;
                        saveUserRecipes(loadUserRecipes().filter(x => x.id !== r.id));
                        buildFilters();
                        renderGrid();
                    });
                    card.appendChild(del);
                }

                card.addEventListener('click', () => openModal(r));
                grid.appendChild(card);
            });
        }

        // ── View modal ─────────────────────────────────────────────────────────────
        function openModal(r) {
            document.getElementById('m-emoji').textContent    = r.emoji || '🍽';
            document.getElementById('m-title').textContent    = r.name;
            document.getElementById('m-category').textContent = r.category;
            document.getElementById('m-desc').textContent     = r.desc;

            const ingList = document.getElementById('m-ingredients');
            ingList.innerHTML = '';
            (r.ingredients || []).forEach(ing => {
                const li = document.createElement('li');
                li.textContent = ing;
                ingList.appendChild(li);
            });

            const stepList = document.getElementById('m-steps');
            stepList.innerHTML = '';
            (r.steps || []).forEach(s => {
                const li = document.createElement('li');
                li.textContent = s;
                stepList.appendChild(li);
            });

            const tagWrap = document.getElementById('m-tags');
            tagWrap.innerHTML = '';
            (r.tags || []).forEach(t => {
                const span = document.createElement('span');
                span.className = 'modal-tag';
                span.textContent = '#' + t;
                tagWrap.appendChild(span);
            });

            document.getElementById('modal-backdrop').classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeModalBackdrop(e) {
            if (e.target === document.getElementById('modal-backdrop')) closeModalDirect();
        }
        function closeModalDirect() {
            document.getElementById('modal-backdrop').classList.remove('open');
            document.body.style.overflow = '';
        }

        // ── Add modal ──────────────────────────────────────────────────────────────
        function openAddModal() {
            ['f-name','f-emoji','f-desc','f-ingredients','f-steps','f-tags'].forEach(id => {
                document.getElementById(id).value = '';
            });
            document.getElementById('f-category').value = 'Food';
            document.getElementById('add-modal-backdrop').classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeAddModalBackdrop(e) {
            if (e.target === document.getElementById('add-modal-backdrop')) closeAddModalDirect();
        }
        function closeAddModalDirect() {
            document.getElementById('add-modal-backdrop').classList.remove('open');
            document.body.style.overflow = '';
        }

        function saveRecipe() {
            const name = document.getElementById('f-name').value.trim();
            if (!name) { alert('Every recipe needs a name!'); return; }
            const recipe = {
                id:          'user-' + Date.now(),
                emoji:       document.getElementById('f-emoji').value.trim() || '🍽',
                name,
                category:    document.getElementById('f-category').value,
                desc:        document.getElementById('f-desc').value.trim() || 'A secret recipe from the Wunderland archives.',
                tags:        document.getElementById('f-tags').value.split(',').map(t => t.trim()).filter(Boolean),
                ingredients: document.getElementById('f-ingredients').value.split('\n').map(s => s.trim()).filter(Boolean),
                steps:       document.getElementById('f-steps').value.split('\n').map(s => s.trim()).filter(Boolean),
            };
            const arr = loadUserRecipes();
            arr.push(recipe);
            saveUserRecipes(arr);
            closeAddModalDirect();
            buildFilters();
            renderGrid();
        }

        // ── Utility ────────────────────────────────────────────────────────────────
        function esc(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') { closeModalDirect(); closeAddModalDirect(); }
        });

        // ── Init ───────────────────────────────────────────────────────────────────
        buildFilters();
        renderGrid();
    </script>
